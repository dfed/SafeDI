codecov:
  require_ci_to_pass: yes
  notify:
    # CI uploads two reports per run, one from the Linux job and one from the
    # macOS job. Wait for both before evaluating the project status, so the
    # status reflects the union of what each platform's tests reach instead of
    # flipping red on whichever upload lands first.
    after_n_builds: 2

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: no
  after_n_builds: 2

flag_management:
  default_rules:
    # When a run produces no upload for a platform (for example a change that
    # skips the build jobs), reuse that platform's coverage from the base commit
    # so the project status still resolves.
    carryforward: true
  individual_flags:
    - name: linux
    - name: macos

coverage:
  status:
    project:
      default:
        target: 100%
    patch: off

ignore:
  # This package is not shipped.
  - "Tests"
