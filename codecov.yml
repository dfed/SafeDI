codecov:
  require_ci_to_pass: yes

# Codecov feeds the README badge and the trend graphs; it does not gate merges
# ("Check Line Coverage on Linux" does) and posts no pull request comments.
comment: false

# Each upload is tagged with its platform. The project status below lists both
# flags, and Codecov holds that status until every listed flag has received its
# report, so the status reflects the union of what both platforms' tests reach
# instead of flipping red on whichever upload lands first. Unlike the global
# `codecov.notify.after_n_builds`, this per-flag gate is skipped when a commit
# has no coverage report at all. Carryforward is deliberately off: a
# carried-forward session would satisfy the gate with the base commit's stale
# data at the first upload.
flags:
  linux:
    after_n_builds: 1
  macos:
    after_n_builds: 1

coverage:
  status:
    project:
      default:
        target: 100%
        # Codecov gates nothing ("Check Line Coverage on Linux" does), so its
        # status is informational: it reports the result without turning a
        # pull request red, as it did when a base commit had no report.
        informational: true
        flags:
          - linux
          - macos
    patch: off

ignore:
  # This package is not shipped.
  - "Tests"
