codecov:
  require_ci_to_pass: yes

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: no
  # CI uploads two reports per run, one from the Linux job and one from the
  # macOS job. Wait for both before commenting. This gate counts report
  # sessions, so it is not applied to a commit that only sent an empty upload.
  after_n_builds: 2

# Each upload is tagged with its platform. The project status below lists both
# flags, and Codecov holds that status until every listed flag has received its
# report, so the status reflects the union of what both platforms' tests reach
# instead of flipping red on whichever upload lands first. Unlike the global
# `codecov.notify.after_n_builds`, this per-flag gate is skipped when a commit
# has no coverage report at all, so Markdown-only changes that send an empty
# upload still get their passing status. Carryforward is deliberately off: a
# carried-forward session would satisfy the gate with the base commit's stale
# data at the first upload.
flags:
  linux:
    after_n_builds: 1
  macos:
    after_n_builds: 1

coverage:
  status:
    project:
      default:
        target: 100%
        flags:
          - linux
          - macos
    patch: off

ignore:
  # This package is not shipped.
  - "Tests"
