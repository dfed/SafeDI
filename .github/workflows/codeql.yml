name: "CodeQL Advanced"

# Throwaway experiment: why does CodeQL's Swift analysis spend 8-9 minutes
# in SwiftPM before compiling anything? Two variants of the Swift job,
# run cold then warm. Results are never uploaded.

on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (swift, ${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # As on main: `xcrun swift build` under the tracer. The tracer
          # relocates /usr/bin/xcrun and falls back to its x86_64 slice,
          # so SwiftPM itself runs under Rosetta and builds for
          # x86_64-apple-macosx.
          - name: control
            runs-on: macos-26
            native: false
          # Launch the toolchain's own `swift` with Xcode's toolchain first
          # on PATH, so SwiftPM, swift-frontend, and git are Xcode's
          # arm64 binaries (no relocation needed) and only the extractor
          # runs under Rosetta.
          - name: native-toolchain
            runs-on: macos-26
            native: true
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Select Xcode Version
      run: sudo xcode-select --switch /Applications/Xcode_26.4.app/Contents/Developer
    - name: Print Host Architecture
      run: |
        uname -m
        sysctl -n sysctl.proc_translated 2>/dev/null || true
    - name: Cache Build Directory
      uses: actions/cache@v6
      with:
        path: .build
        key: codeql-exp-build-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: swift
        build-mode: manual
    - name: Build
      env:
        NATIVE: ${{ matrix.native }}
      run: |
        find Sources -name '*.swift' -exec touch {} +
        DEVELOPER_DIR=$(xcode-select -p)
        TOOLCHAIN="$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin"
        if [ "$NATIVE" = true ]; then
          # The step shell itself runs x86_64 under the tracer (relocated
          # /bin/bash falls back to its x86_64 slice), and children inherit
          # that preference. `arch -arm64` resets it for the build.
          export PATH="$TOOLCHAIN:$DEVELOPER_DIR/usr/bin:$PATH"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          RUN="arch -arm64 $TOOLCHAIN/swift"
        else
          RUN="xcrun swift"
        fi
        echo "::group::probes under the tracer"
        echo "step shell arch: $(uname -m)"
        if [ "$NATIVE" = true ]; then echo "arch -arm64 child: $(arch -arm64 uname -m || echo 'arch failed')"; fi
        time $RUN --version
        if [ -d .build/checkouts/swift-syntax ]; then time git -C .build/checkouts/swift-syntax rev-parse HEAD; fi
        time $RUN package dump-package > /dev/null
        time $RUN package dump-package > /dev/null
        echo "::endgroup::"
        time $RUN build -v --target SafeDI --target SafeDITool
        echo "build directories:"; ls -d .build/*-apple-macosx
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:swift/variant:${{ matrix.name }}"
        upload: never
