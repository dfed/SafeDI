name: "CodeQL Advanced"

# Throwaway experiment: why does CodeQL's Swift analysis spend 8-9 minutes
# in SwiftPM before compiling anything? Three variants of the Swift job,
# run cold then warm. Results are never uploaded.

on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (swift, ${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # As on main: arm64 runner, `.build` cached, build under the
          # tracer (which runs x86_64 under Rosetta on Apple Silicon).
          - name: control
            runs-on: macos-26
            swiftpm-cache: false
            prebuild: false
            extra-flags: ""
          # Also cache SwiftPM's user-level caches: compiled manifests and
          # repository mirrors, which otherwise are rebuilt and re-fetched
          # under the tracer on every run.
          - name: swiftpm-cache
            runs-on: macos-26
            swiftpm-cache: true
            prebuild: true-resolve-only
            extra-flags: ""
          # Resolve and fully build before CodeQL starts tracing, then
          # rebuild only SafeDI's targets under the tracer with
          # --skip-update so SwiftPM does no network or git work there.
          - name: pre-resolve
            runs-on: macos-26
            swiftpm-cache: true
            prebuild: true
            extra-flags: "--skip-update"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Select Xcode Version
      run: sudo xcode-select --switch /Applications/Xcode_26.4.app/Contents/Developer
    - name: Print Host Architecture
      run: |
        uname -m
        sysctl -n sysctl.proc_translated 2>/dev/null || true
    - name: Cache Build Directory
      uses: actions/cache@v6
      with:
        path: .build
        key: codeql-exp-build-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
    - if: matrix.swiftpm-cache
      name: Cache SwiftPM Caches
      uses: actions/cache@v6
      with:
        path: ~/Library/Caches/org.swift.swiftpm
        key: codeql-exp-swiftpm-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
    - if: matrix.prebuild == 'true-resolve-only'
      name: Resolve Before Tracing
      run: xcrun swift package resolve
    - if: matrix.prebuild == 'true'
      name: Resolve and Build Before Tracing
      run: |
        xcrun swift package resolve
        xcrun swift build --target SafeDI --target SafeDITool
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: swift
        build-mode: manual
    - name: Build
      env:
        EXTRA_FLAGS: ${{ matrix.extra-flags }}
      run: |
        find Sources -name '*.swift' -exec touch {} +
        xcrun swift build -v $EXTRA_FLAGS --target SafeDI --target SafeDITool
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:swift/variant:${{ matrix.name }}"
        upload: never
