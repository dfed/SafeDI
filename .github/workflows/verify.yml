name: Verify

# Runs SafeDI's tests on Linux by hand, for one branch, so a change can be
# checked without waiting on a local machine. Dispatch it on the branch to
# test, for example `gh workflow run verify.yml --ref my-branch -f
# filter=SafeDIToolSeam`; an empty filter runs the whole suite. Pull request
# checks are unaffected.
#
# Two modes test; a third, `warm`, only saves a build (see "Warm the Release
# Verify Build Cache" below), and a fourth, `function-compile-time`, runs no
# test: it times the compiler on each function of SafeDICore as ci.yml's
# "Check Function Compile Time on Linux" does (see "Verify Function Compile
# Time on Linux" below). `release`, the default, runs the same build as
# "Build Tests on Linux" in ci.yml, with the passed-compile-check cache of
# "Build and Test on Linux". It builds SafeDI's own targets in release with
# code coverage, starting from the build of main's newest commit that "Warm
# the Release Verify Build Cache" below saved, so it compiles again only the
# targets whose files differ from that commit's and the targets that depend on
# them: a change to tests alone rebuilds the test targets it touches, and a
# change to SafeDICore nearly everything. That works because both jobs give
# every tracked file a modification time derived from its content
# (.github/scripts/stamp-source-times.sh); a checkout alone gives every file a
# new time, and SwiftPM then rebuilds every target. The script's header holds
# what was measured, in debug and in release on Linux. `fast` builds in debug
# without coverage, as "Build and Test on Latest Swift" does, from a build
# cache of its own that "Warm the Fast Verify Build Cache" below keeps on
# main. Its build takes half as long or less, but its tests run slower,
# because the parser and macros come from a debug build of swift-syntax, and
# they run in the job that builds, as one process. So it pays off for a narrow
# filter, and a `fast` run needs one: the whole suite took 37 minutes in
# `fast`, 29 of them the tests (run 43793266801; 31 and 23 in run
# 43792894511), against about 20 from start to end in `release` (runs
# 43795430677 and 43793555016, whose build job took 11 and 13 minutes and
# whose seven test jobs 6 and 8), which splits it, so a `fast` run with an
# empty filter fails at once and says so. For a whole test target that
# compiles generated code the two modes take about as long, and `release`
# builds as CI does. Each mode keeps its passed compile checks under its own
# identity, since the identity hashes the test arguments.
#
# A `release` run of the whole suite (an empty filter) builds once and then
# runs the tests in seven jobs at the same time, four for the largest test
# targets, two for the graph fuzzer's smoke tests and one for the rest, each
# from the test bundle the build uploads; "Save Passed Compile Checks of
# Verify" joins the checks the seven passed into the one list an unsplit run
# saves, and "Check Every Verify Test Ran Once" fails unless all seven
# reported and their test counts sum to the bundle's. Such a run took 9.0
# minutes from start to end where the build job took under 3 (run
# 43766692766), with every compile check compiling. With `pins`,
# graph-fuzzer.yml's `coverage` jobs fuzz every corpus from the same bundle
# and check the pins (job "Fuzz", below), and the test jobs can start later
# than a plain run's. A run with a filter tests in the job that builds, since
# handing the bundle to another job costs about two minutes.
#
# A dispatched run checks out and caches under the ref it is dispatched on, so
# its caches are scoped to that branch and never become main's. The one thing
# it shares is the list of compile checks that passed, which "Share Passed
# Compile Checks" adds to a list every run restores, so a check that passed on
# one scratch branch is not compiled again on the next. Dispatching
# takes write access to the repository, and the ref must be a branch or tag of
# this repository, so a fork's code cannot run here. The job reads the
# repository and nothing else: no secrets, and the filter and mode reach the
# shell through environment variables, never interpolated into a script.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: A `swift test --filter` pattern, or empty for the whole suite.
        required: false
        default: ''
      mode:
        description: '`release` builds as "Build Tests on Linux" does; `fast` builds in debug without coverage and needs a filter; `warm` saves this branch a release build for its later `release` runs and tests nothing; `function-compile-time` runs only the check of the compiler''s time on each function of SafeDICore, and tests nothing.'
        required: false
        type: choice
        options:
          - release
          - fast
          - warm
          - function-compile-time
        default: release
      pins:
        description: With `release` and an empty filter, also fuzz every corpus from the same build, check the corpora's pins and report the changed lines no corpus graph executed (graph-fuzzer.yml's `coverage` jobs).
        required: false
        type: boolean
        default: false
      base:
        description: The commit or branch the coverage reports list changes since (the tests' report of every whole-suite `release` run, and with `pins` the corpora's), or empty for the merge base with main.
        required: false
        default: ''
  # Only to warm the two modes' build caches, which a dispatched run on any
  # branch can restore because main saved them. Markdown cannot change what
  # they build.
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

permissions: {}

env:
  # The same arguments as "Build and Test on Linux", so main's caches apply.
  RELEASE_SWIFT_TEST_ARGUMENTS: -c release --enable-code-coverage -Xswiftc -enable-testing -Xswiftc -Xllvm -Xswiftc -instrprof-atomic-counter-update-all --traits sourceBuild
  # Fast mode's arguments, which the warming job builds with too.
  FAST_SWIFT_TEST_ARGUMENTS: --traits sourceBuild

jobs:
  verify:
    # Nothing here needs macOS, so it uses the Linux test job's container.
    name: Verify on Linux
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'warm' && inputs.mode != 'function-compile-time' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 75
    permissions:
      contents: read
      # To read the passed compile checks other runs uploaded.
      actions: read
    outputs:
      identity: ${{ steps.compile-check-identity.outputs.identity }}
      split: ${{ steps.split.outputs.split }}
      tests: ${{ steps.count.outputs.tests }}
    steps:
      # Every branch's history, so that "Find an Earlier Verify Run's Build"
      # can tell which earlier runs built an ancestor of this commit.
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The whole suite in release mode runs in "Verify Tests on Linux"
      # below, one job per group of test targets, from the bundle this job
      # builds. A filter runs here as one process, and fast mode needs one.
      - name: Decide Whether to Split the Tests
        id: split
        env:
          FILTER: ${{ inputs.filter }}
          MODE: ${{ inputs.mode }}
          PINS: ${{ inputs.pins }}
        run: |
          if [ "$MODE" = release ] && [ -z "$FILTER" ]; then
            echo "split=true" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = fast ] && [ -z "$FILTER" ]; then
            # The whole suite in one debug process took 37 minutes (run
            # 43793266801); a release run takes about 20 from start to end
            # (run 43795430677).
            echo "::error::mode=fast needs a filter. For the whole suite dispatch mode=release, which runs the tests in seven jobs and ends sooner."
            exit 1
          else
            # The fuzzer's jobs read the bundle only a split run uploads, so
            # a run that cannot fuzz fails rather than pass without pins.
            if [ "$PINS" = true ]; then
              echo "::error::pins needs mode=release and an empty filter."
              exit 1
            fi
            echo "split=false" >> "$GITHUB_OUTPUT"
          fi
      # Before anything reads a source's modification time. The checkout is
      # the container's, so git needs telling that this user may read it.
      - name: Stamp Source Times
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          .github/scripts/stamp-source-times.sh
      - name: Choose Test Arguments
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            release) echo "SWIFT_TEST_ARGUMENTS=$RELEASE_SWIFT_TEST_ARGUMENTS" >> "$GITHUB_ENV" ;;
            fast) echo "SWIFT_TEST_ARGUMENTS=$FAST_SWIFT_TEST_ARGUMENTS" >> "$GITHUB_ENV" ;;
            *) echo "Unknown mode '$MODE'."; exit 1 ;;
          esac
      # The newest build the warming job saved: this branch's own, when it has
      # one, and otherwise main's. Before either has saved one the build is
      # cold: the build "Build Tests on Linux" saves is no start, since
      # its sources were not stamped and a build from it compiled the
      # dependencies again too (12 minutes, run 43761135608). This job saves
      # no build, so one branch's build never becomes another's.
      - name: Restore Release Build Directory
        if: ${{ inputs.mode == 'release' }}
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: verify-release-v1-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            verify-release-v1-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-${{ github.sha }}-
            verify-release-v1-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-
      # A cache is readable only from its own branch and main, and a run is
      # usually dispatched on a scratch ref that is deleted when it ends, so
      # the build above is main's: for a branch that changes SafeDICore, as
      # every branch of a stack does, a start that rebuilds nearly everything
      # (20.1 minutes on the 2.3.0 stack, run 44595917463, where a build from
      # nothing takes 23 to 26). An artifact is readable from every branch,
      # so each whole-suite run uploads its build directory ("Upload Build
      # Directory for Later Runs" below) and the next run of a commit above
      # it starts from that: the newest such build whose commit is an
      # ancestor of this one, or this one, and is not on main, where the
      # cache above is at least as new. Sources are stamped by content, so a
      # build from any commit is a correct start, as main's is; an ancestor's
      # is the closest. The artifact's name carries a hash of the compiler's
      # version and the build's arguments, so a build is a start only for
      # the compiler and flags that made it. Only a build that a dispatched
      # run of this workflow in this repository uploaded counts: a pull
      # request from a fork can upload an artifact of any name from ci.yml.
      # Nothing here fails the job: whatever goes wrong, the build starts
      # from the cache above.
      - name: Name the Build Directory Artifact
        id: build-artifact
        if: ${{ inputs.mode == 'release' }}
        run: |
          compiler=$(swift --version 2>&1)
          hash=$(printf '%s\n%s' "$RELEASE_SWIFT_TEST_ARGUMENTS" "$compiler" | sha256sum | cut -c1-16)
          test "${#hash}" -eq 16
          echo "name=verify-release-build-$hash" >> "$GITHUB_OUTPUT"
      - name: Find an Earlier Verify Run's Build
        id: earlier-build
        if: ${{ inputs.mode == 'release' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/github-script@v8
        env:
          ARTIFACT_NAME: ${{ steps.build-artifact.outputs.name }}
        with:
          script: |
            const { execFileSync } = require('child_process')
            const git = (...arguments_) => execFileSync('git', ['-c', `safe.directory=${process.env.GITHUB_WORKSPACE}`, ...arguments_], { cwd: process.env.GITHUB_WORKSPACE, stdio: ['ignore', 'pipe', 'ignore'] })
            const isAncestor = (ancestor, descendant) => {
              try {
                git('merge-base', '--is-ancestor', ancestor, descendant)
                return true
              } catch {
                return false
              }
            }
            // The newest commit of main this branch holds, or nothing when
            // git cannot say.
            let newestMainCommit = ''
            try {
              newestMainCommit = git('merge-base', 'HEAD', 'origin/main').toString().trim()
            } catch {
              core.info('No merge base with main.')
            }
            // Whether a file SwiftPM compiles differs between a commit and
            // this one. A failure counts as a difference, which keeps the
            // choice as it was.
            const changesWhatIsCompiled = (since) => {
              try {
                git('diff', '--quiet', since, 'HEAD', '--', 'Package.swift', 'Package.resolved', 'Sources', 'Plugins', 'Tests')
                return false
              } catch {
                return true
              }
            }
            const { data } = await github.rest.actions.listArtifactsForRepo({
              ...context.repo,
              name: process.env.ARTIFACT_NAME,
              per_page: 50,
            })
            const candidates = data.artifacts
              .filter(artifact => !artifact.expired && artifact.workflow_run && /^[0-9a-f]{40}$/.test(artifact.workflow_run.head_sha || ''))
              .sort((first, second) => Date.parse(second.created_at) - Date.parse(first.created_at))
            core.info(`${candidates.length} builds named ${process.env.ARTIFACT_NAME}.`)
            for (const artifact of candidates) {
              const commit = artifact.workflow_run.head_sha
              if (artifact.workflow_run.id === context.runId) { continue }
              if (!isAncestor(commit, 'HEAD')) { continue }
              if (isAncestor(commit, 'origin/main')) {
                core.info(`The build of ${commit} is of a commit on main; the cache is at least as new.`)
                break
              }
              // A build from before this branch last merged main lacks what
              // main changed since. When the branch itself changes nothing
              // that is compiled, main's cache already is this commit's
              // build, and such a build unpacked over it made the run compile
              // nearly everything again (run 44905423108).
              if (newestMainCommit !== '' && !isAncestor(newestMainCommit, commit) && !changesWhatIsCompiled(newestMainCommit) && changesWhatIsCompiled(commit)) {
                core.info(`The build of ${commit} is from before this branch last merged main, and nothing compiled differs from main; the cache is nearer.`)
                continue
              }
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: artifact.workflow_run.id })
              if (run.path !== '.github/workflows/verify.yml' || run.event !== 'workflow_dispatch' || !run.head_repository || run.head_repository.id !== run.repository.id) {
                core.info(`The build of ${commit} is not a dispatched Verify run's of this repository.`)
                continue
              }
              core.info(`Starting from the build of ${commit} (run ${run.id}, ${artifact.size_in_bytes} bytes).`)
              core.setOutput('run', String(run.id))
              core.setOutput('commit', commit)
              return
            }
            core.info('No earlier Verify run built an ancestor of this commit that is not on main.')
      - name: Download the Earlier Run's Build
        id: download-earlier-build
        if: ${{ inputs.mode == 'release' && steps.earlier-build.outputs.run != '' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.build-artifact.outputs.name }}
          run-id: ${{ steps.earlier-build.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/earlier-build
      # The cache's build goes only once the earlier run's has unpacked, so a
      # download cut short leaves the cache's.
      - name: Unpack the Earlier Run's Build
        if: ${{ inputs.mode == 'release' && steps.download-earlier-build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir "$RUNNER_TEMP/earlier-build/unpacked"
          tar -xzf "$RUNNER_TEMP/earlier-build/verify-release-build.tar.gz" -C "$RUNNER_TEMP/earlier-build/unpacked"
          test -d "$RUNNER_TEMP/earlier-build/unpacked/.build"
          rm -rf .build
          mv "$RUNNER_TEMP/earlier-build/unpacked/.build" .build
          rm -rf "$RUNNER_TEMP/earlier-build"
      # The key is the warming job's: a hit is never re-saved, so it holds
      # the build's arguments and the compiler's version. This job saves no
      # build: when the key hashed this workflow instead, each branch a run
      # was dispatched on that had changed the workflow saved a copy of
      # about 500 MB that only it could restore.
      - name: Hash Fast Build Arguments
        id: fast-build-arguments
        if: ${{ inputs.mode == 'fast' }}
        run: |
          compiler=$(swift --version 2>&1)
          arguments=$(printf '%s\n%s' "$FAST_SWIFT_TEST_ARGUMENTS" "$compiler" | sha256sum | cut -c1-16)
          test "${#arguments}" -eq 16
          echo "hash=$arguments" >> "$GITHUB_OUTPUT"
      - name: Restore Debug Build Directory
        if: ${{ inputs.mode == 'fast' }}
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: verify-debug-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-${{ steps.fast-build-arguments.outputs.hash }}
          restore-keys: |
            verify-debug-${{ runner.os }}-swift-6.2-
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: swift package resolve
      - name: Compute Compile Check Identity
        id: compile-check-identity
        run: |
          # shellcheck disable=SC2086 # The arguments are words to split.
          identity=$(.github/scripts/compile-check-identity.sh $SWIFT_TEST_ARGUMENTS)
          test "${#identity}" -eq 64
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      # From a stamped build of the same commit the step took about 10
      # seconds (run 43762598351), after a change to one test file about 2
      # minutes (43763818802), and from nothing 23 to 26 minutes (runs
      # 43772841709, 43774444496, 43774447047). The limit is twice the
      # slowest cold build.
      #
      # A `release` run with a filter builds here too and then runs the
      # bundle, as the split run's test jobs do. `swift test` does not reuse
      # what `swift build --build-tests` built with the same arguments: on
      # main, from the cache of the very commit it tested, a filtered run
      # compiled every target again, the dependencies included, for 12.8
      # minutes before its tests ran for 9.4 (run 44902486611).
      - name: Build Tests
        if: ${{ inputs.mode == 'release' }}
        timeout-minutes: 50
        run: |
          # shellcheck disable=SC2086 # The arguments are words to split.
          swift build --build-tests $SWIFT_TEST_ARGUMENTS
      # What "Check Every Verify Test Ran Once" compares the groups' counts
      # with. A listing ignores `--filter` and `--skip`, so a group cannot
      # list what it would run; it reports what it ran.
      - name: Count the Bundle's Tests
        id: count
        if: ${{ steps.split.outputs.split == 'true' }}
        env:
          LLVM_PROFILE_FILE: ${{ runner.temp }}/verify-list-%p.profraw
        run: |
          .build/x86_64-unknown-linux-gnu/release/SafeDIPackageTests.xctest --testing-library swift-testing --list-tests > verify-tests.txt
          tests=$(LC_ALL=C sort -u verify-tests.txt | wc -l)
          test "$tests" -gt 0
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "The bundle lists $tests tests."
      # What a test job needs of the build, as "Build Tests on Linux"
      # packages it for the graph fuzzer's shards: the bundle, SafeDITool and
      # the macro plugin (which compile checks run), SafeDI's module, and the
      # build's record of the dependency versions it resolved, which the key
      # of each compile check names (CompileCheckBuild).
      - name: Package Test Bundle
        if: ${{ steps.split.outputs.split == 'true' }}
        run: |
          products=.build/x86_64-unknown-linux-gnu/release
          tar -czf verify-test-bundle.tar.gz \
            "$products/SafeDIPackageTests.xctest" \
            "$products/SafeDITool" \
            "$products/SafeDIMacros-tool" \
            "$products/Modules/SafeDI.swiftmodule" \
            .build/workspace-state.json
      - name: Upload Test Bundle
        if: ${{ steps.split.outputs.split == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: verify-test-bundle
          path: verify-test-bundle.tar.gz
          retention-days: 1
          # A re-run of the job replaces what an earlier attempt uploaded.
          overwrite: true
      # The whole build directory, for "Find an Earlier Verify Run's Build"
      # of a later run. After the bundle, and never failing the job: the
      # tests wait on this job, not on a later run's start. The fastest
      # compression, since the runners' network is faster than gzip.
      - name: Package Build Directory for Later Runs
        id: package-build
        if: ${{ steps.split.outputs.split == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir "$RUNNER_TEMP/build-for-later-runs"
          tar --use-compress-program='gzip -1' -cf "$RUNNER_TEMP/build-for-later-runs/verify-release-build.tar.gz" .build
          ls -l "$RUNNER_TEMP/build-for-later-runs"
      - name: Upload Build Directory for Later Runs
        if: ${{ steps.split.outputs.split == 'true' && steps.package-build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build-artifact.outputs.name }}
          path: ${{ runner.temp }}/build-for-later-runs/verify-release-build.tar.gz
          # A stack is verified many times a day, so the newest build is
          # rarely a day old; two days span a night.
          retention-days: 2
          # The archive is compressed already.
          compression-level: 0
          # A re-run of the job replaces what an earlier attempt uploaded.
          overwrite: true
      - name: Restore Passed Compile Checks
        if: ${{ steps.split.outputs.split == 'false' }}
        uses: actions/cache/restore@v6
        with:
          path: .compile-check-cache
          key: compile-checks-v1-${{ runner.os }}-${{ steps.compile-check-identity.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compile-checks-v1-${{ runner.os }}-${{ steps.compile-check-identity.outputs.identity }}-
      # And the checks that passed in any other run of this repository, on
      # whatever branch, which this run's own cache cannot hold. Sharing only
      # saves compiles, so neither this step nor the upload after the tests
      # can fail the job.
      - name: Restore Shared Passed Compile Checks
        if: ${{ steps.split.outputs.split == 'false' }}
        continue-on-error: true
        # Twice the longest it can take: its script stops reading after 90
        # seconds, and read 30 artifacts in 11.5 and 15.2 seconds (Verify runs
        # 43952868099 and 43954840461), where it now reads at most 15.
        timeout-minutes: 3
        uses: ./.github/actions/restore-shared-compile-checks
        with:
          identity: ${{ steps.compile-check-identity.outputs.identity }}
      - name: Test
        id: tests
        if: ${{ steps.split.outputs.split == 'false' }}
        timeout-minutes: 60
        env:
          FILTER: ${{ inputs.filter }}
          MODE: ${{ inputs.mode }}
          SAFEDI_COMPILE_CHECK_PASSED_CACHE: ${{ github.workspace }}/.compile-check-cache/passed.txt
          # The release bundle is built for coverage; nothing reads a
          # filtered run's profile, so it goes to the runner's temporary
          # directory, not the checkout.
          LLVM_PROFILE_FILE: ${{ runner.temp }}/verify-filter-%p.profraw
        run: |
          # shellcheck disable=SC2086 # The arguments are words to split.
          if [ "$MODE" = release ]; then
            # A split run never reaches this step, so a release run here has
            # a filter. Every test is a swift-testing test, as in "Build and
            # Test on Linux", which runs the bundle the same way.
            .build/x86_64-unknown-linux-gnu/release/SafeDIPackageTests.xctest --testing-library swift-testing --filter "$FILTER"
          elif [ -n "$FILTER" ]; then
            swift test $SWIFT_TEST_ARGUMENTS --filter "$FILTER"
          else
            swift test $SWIFT_TEST_ARGUMENTS
          fi
      # A run keeps in its branch's cache only the value comparison outputs it
      # read or printed and those the newest artifacts of its identity hold,
      # since the restore adds other runs' outputs to the directory, and keeps
      # them all when its tests did not run to their end
      # (.github/scripts/keep-value-outputs-used-in-run.sh says why). The
      # cache only saves time, so this cannot fail the job.
      - name: Keep the Value Comparison Outputs This Run Used
        if: ${{ always() && steps.split.outputs.split == 'false' && hashFiles('.compile-check-cache/passed.txt') != '' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: .github/scripts/keep-value-outputs-used-in-run.sh .compile-check-cache "$GITHUB_RUN_ID" "$TEST_OUTCOME"
      - name: Save Passed Compile Checks
        if: ${{ always() && steps.split.outputs.split == 'false' && hashFiles('.compile-check-cache/passed.txt') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .compile-check-cache
          key: compile-checks-v1-${{ runner.os }}-${{ steps.compile-check-identity.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Passed Compile Checks to Share
        if: ${{ always() && steps.split.outputs.split == 'false' }}
        continue-on-error: true
        uses: ./.github/actions/upload-passed-compile-checks
        with:
          identity: ${{ steps.compile-check-identity.outputs.identity }}

  # The whole suite, one job per group of test targets, each running the
  # bundle "Verify on Linux" built, as the graph fuzzer's shards run the
  # bundle of "Build Tests on Linux". Linux runners are plentiful, and the
  # suite's time is mostly compile checks, which one runner's four cores were
  # the limit on: in one process the tests took 8 to 9 minutes when the
  # passed-check cache skipped the compiles and 15 to 20 when they all ran.
  # The four largest targets each get a job, and the graph fuzzer's smoke
  # tests two, since the compile-check cache does not cover the compiles
  # they make: with the four targets split off, the rest took 6.4 minutes,
  # 3.7 of them the smoke seeds and 6.3 the seam smoke seeds, which ran
  # beside each other on four cores (run 43763818802; the four targets took
  # 17 seconds to 2 minutes). The last job runs every test the others'
  # filters leave out, so a new swift-testing target or suite runs without
  # an edit here. As seven jobs, with every compile check compiling, the
  # tests took 5.5 minutes for the seams, 5.0 for the mocks, 3.4 for the seam
  # smoke seeds, 1.9 for the other smoke tests and 1.2 to 1.3 for each of the
  # other three (run 43766692766, 9.0 minutes from start to end).
  verify-tests:
    name: Verify Tests on Linux (${{ matrix.group }})
    needs: verify
    if: ${{ needs.verify.outputs.split == 'true' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    permissions:
      contents: read
      # To read the passed compile checks other runs uploaded.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: mocks
            selection: --filter ^SafeDIToolMockTests\.
          - group: seams
            selection: --filter ^SafeDIToolSeamTests\.
          - group: dependency-trees
            selection: --filter ^SafeDIToolDependencyTreeTests\.
          - group: tool
            selection: --filter ^SafeDIToolTests\.
          - group: fuzzer-seam-smoke
            selection: --filter ^SafeDIToolFuzzerTests\.SafeDIToolGraphFuzzerTests/seamSmokeSeeds
          - group: fuzzer-smoke
            selection: --filter ^SafeDIToolFuzzerTests\.SafeDIToolGraphFuzzerTests/ --skip ^SafeDIToolFuzzerTests\.SafeDIToolGraphFuzzerTests/seamSmokeSeeds
          - group: others
            selection: --skip ^SafeDIToolMockTests\. --skip ^SafeDIToolSeamTests\. --skip ^SafeDIToolDependencyTreeTests\. --skip ^SafeDIToolTests\. --skip ^SafeDIToolFuzzerTests\.SafeDIToolGraphFuzzerTests/
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Download Test Bundle
        uses: ./.github/actions/download-artifact
        with:
          name: verify-test-bundle
      - name: Unpack Test Bundle
        run: tar -xzf verify-test-bundle.tar.gz
      - name: Restore Passed Compile Checks
        uses: actions/cache/restore@v6
        with:
          path: .compile-check-cache
          key: compile-checks-v1-${{ runner.os }}-${{ needs.verify.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compile-checks-v1-${{ runner.os }}-${{ needs.verify.outputs.identity }}-
      - name: Restore Shared Passed Compile Checks
        continue-on-error: true
        # Twice the longest it can take: its script stops reading after 90
        # seconds, and read 30 artifacts in 11.5 and 15.2 seconds (Verify runs
        # 43952868099 and 43954840461), where it now reads at most 15.
        timeout-minutes: 3
        uses: ./.github/actions/restore-shared-compile-checks
        with:
          identity: ${{ needs.verify.outputs.identity }}
      # The bundle is built for coverage, and "Report Changed Lines No Verify
      # Test Executed on Linux" reads the profiles its processes write.
      # The limit is twice the slowest group's time with every compile check
      # compiling: the seam tests took 5.5 minutes, the mock tests 5.0, the
      # seam smoke seeds 3.4, the other smoke tests 1.9 and the other three
      # groups 1.2 to 1.3 (run 43766692766). The seam tests have since taken
      # 6.5 (run 44097575826), and on the 2.3.0 stack the fuzzer smoke tests
      # took 10.1 (run 44595917463), so the limit is twice that, rounded up.
      - name: Test
        id: tests
        timeout-minutes: 21
        shell: bash
        env:
          SELECTION: ${{ matrix.selection }}
          GROUP: ${{ matrix.group }}
          SAFEDI_COMPILE_CHECK_PASSED_CACHE: ${{ github.workspace }}/.compile-check-cache/passed.txt
          LLVM_PROFILE_FILE: ${{ runner.temp }}/verify-profiles/verify-tests-%p.profraw
        run: |
          set -o pipefail
          # shellcheck disable=SC2086 # The selection is words to split.
          .build/x86_64-unknown-linux-gnu/release/SafeDIPackageTests.xctest --testing-library swift-testing $SELECTION 2>&1 | tee "$RUNNER_TEMP/verify-test-output.txt"
          # The count of tests the run's last line reports, for "Check Every
          # Verify Test Ran Once".
          mkdir -p verify-test-count
          grep -oE 'Test run with [0-9]+ tests? in [0-9]+ suites?' "$RUNNER_TEMP/verify-test-output.txt" | tail -1 | grep -oE '[0-9]+' | head -1 > "verify-test-count/$GROUP.txt"
          test -s "verify-test-count/$GROUP.txt"
      - name: Upload the Group's Test Count
        uses: actions/upload-artifact@v7
        with:
          name: verify-test-count-${{ matrix.group }}
          path: verify-test-count
          retention-days: 1
          # A re-run of the job replaces what an earlier attempt uploaded.
          overwrite: true
      # The artifact always holds the group's outcome and, when its tests
      # wrote one, their profile, also when a test failed: a failing run's
      # coverage is still most of the answer, and the report names the group.
      - name: Merge the Group's Profile
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          mkdir -p verify-profile
          echo "$OUTCOME" > verify-profile/outcome.txt
          shopt -s nullglob
          profiles=("$RUNNER_TEMP"/verify-profiles/*.profraw)
          if [ ${#profiles[@]} -gt 0 ]; then
            llvm-profdata merge -sparse "${profiles[@]}" -o "verify-profile/$GROUP.profdata"
          else
            echo "The group's tests wrote no coverage profile."
          fi
      - name: Upload the Group's Profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: verify-profile-${{ matrix.group }}
          path: verify-profile/
          retention-days: 1
          # A re-run of the job replaces what an earlier attempt uploaded.
          overwrite: true
      # As in a job that saves its own cache: the group hands on only the
      # value comparison outputs it read or printed and those the newest
      # artifacts hold, or all of them when its tests did not run to their end.
      - name: Keep the Value Comparison Outputs the Group Used
        if: ${{ always() && hashFiles('.compile-check-cache/passed.txt') != '' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: .github/scripts/keep-value-outputs-used-in-run.sh .compile-check-cache "$GITHUB_RUN_ID" "$TEST_OUTCOME"
      - name: Upload Passed Compile Checks of the Group
        if: ${{ always() && hashFiles('.compile-check-cache/passed.txt') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: verify-passed-compile-checks-${{ matrix.group }}
          # Every check the group's cache holds and every value comparison
          # output it used, for this branch's cache, and the checks the group
          # itself passed and outputs it printed, for other branches.
          path: |
            .compile-check-cache/passed.txt
            .compile-check-cache/passed-in-run-${{ github.run_id }}.txt
            .compile-check-cache/value-outputs/
            .compile-check-cache/value-outputs-written-in-run-${{ github.run_id }}.txt
          retention-days: 1
          include-hidden-files: true
          # A re-run of the job replaces what an earlier attempt uploaded.
          overwrite: true

  # With `pins`, graph-fuzzer.yml's `coverage` jobs, in this run and from the
  # bundle "Verify on Linux" built: the corpora's shards beside the test
  # jobs, then the pins check and the coverage report. A separate dispatch of
  # that workflow builds the same commit again, 23 to 26 minutes after a
  # change to SafeDICore, with these arguments and from this cache. They are
  # 13 jobs (the unit suite, ten shards, the pins check and the report)
  # beside the seven test jobs, so when each starts depends on free runners:
  # the one such run took 46.9 minutes from a cold build (43774444496), 25.5
  # of them the build and about 10 the shards waiting for runners while
  # another run held some.
  fuzz:
    name: Fuzz
    needs: verify
    if: ${{ inputs.pins && needs.verify.outputs.split == 'true' }}
    # The most any job of graph-fuzzer.yml may ask for, not what its jobs
    # get: each asks for `contents: read` but its "Delete This Run's Scratch
    # Ref", which never runs when called from here. GitHub refuses to start
    # a run whose called workflow has a job asking for more than its caller
    # allows, whether or not that job would run (run 44023595701).
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/graph-fuzzer.yml
    with:
      coverage: true
      base: ${{ inputs.base }}
      bundle: verify-test-bundle

  # The changed lines under Sources/ and Plugins/ that none of the seven
  # groups' tests executed, in the run's summary, so that a change's coverage
  # is known from the Verify run that tests it and not first from a pull
  # request's "Check Line Coverage on Linux", which waits for both platforms'
  # full test jobs. It costs the run no build and no test: the bundle is
  # already built for coverage and the groups already write profiles.
  # It fails when it lists a line: left green, a run that listed lines let
  # a change reach a pull request with a line no test executed. It runs only
  # in a run of the whole suite in release mode (`split`), so a filtered run
  # is never failed for lines its filter left out. It runs when a group's
  # tests failed, and it reads Linux alone, so the check stays the gate
  # (.github/scripts/report-verify-coverage.sh says what it cannot see).
  # The job's limit is "Report Changed Lines No Fuzzer Graph Executed on
  # Linux"'s, which does the same work over more profiles; neither step that
  # can hang here has been measured in this job yet.
  verify-coverage:
    name: Report Changed Lines No Verify Test Executed on Linux
    needs: [verify, verify-tests]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.verify.outputs.split == 'true' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # Every branch's history, so any base is present.
          fetch-depth: 0
      - name: Download Test Bundle
        uses: ./.github/actions/download-artifact
        with:
          name: verify-test-bundle
      - name: Download the Groups' Profiles
        uses: ./.github/actions/download-artifact
        with:
          pattern: verify-profile-*
          path: verify-profiles
      # Retried for the reason "Install curl for Codecov" in ci.yml gives.
      - name: Install Python
        uses: ./.github/actions/retry
        with:
          command: command -v python3 >/dev/null || { apt-get update && apt-get install -y --no-install-recommends python3; }
      - name: Report
        env:
          BASE: ${{ inputs.base }}
          # The groups of "Verify Tests on Linux"'s matrix.
          EXPECTED_GROUPS: mocks seams dependency-trees tool fuzzer-seam-smoke fuzzer-smoke others
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tar -xzf verify-test-bundle.tar.gz
          mkdir -p verify-profiles
          if [ -z "$BASE" ]; then
            base=origin/main
          elif ! base=$(git rev-parse --verify --quiet "$BASE^{commit}" || git rev-parse --verify --quiet "origin/$BASE^{commit}"); then
            echo "::error::The base '$BASE' names no commit of this repository."
            exit 1
          fi
          .github/scripts/report-verify-coverage.sh \
            .build/x86_64-unknown-linux-gnu/release/SafeDIPackageTests.xctest verify-profiles \
            "$base" "$RUNNER_TEMP/verify-coverage" "$EXPECTED_GROUPS"
      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: verify-coverage
          path: ${{ runner.temp }}/verify-coverage/
          if-no-files-found: ignore
          retention-days: 3
          # A re-run of the job replaces what an earlier attempt uploaded.
          overwrite: true

  # Fails unless all seven groups reported and their test counts sum to the
  # bundle's, which any selection that drops or repeats tests breaks. It only
  # reads counts, so it needs no container.
  verify-test-partition:
    name: Check Every Verify Test Ran Once
    needs: [verify, verify-tests]
    if: ${{ needs.verify.outputs.split == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The download below is a local action, which needs its files checked out.
      - name: Checkout the Download Action
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/download-artifact
      - name: Download the Groups' Test Counts
        uses: ./.github/actions/download-artifact
        with:
          pattern: verify-test-count-*
          path: verify-test-counts
          merge-multiple: true
      - name: Compare the Groups' Tests With the Bundle's
        env:
          BUNDLE_TESTS: ${{ needs.verify.outputs.tests }}
          # The count of groups in "Verify Tests on Linux"'s matrix.
          EXPECTED_GROUPS: 7
        run: |
          groups=$(find verify-test-counts -name '*.txt' | wc -l)
          sum=0
          for count in verify-test-counts/*.txt; do
            echo "$(basename "$count" .txt): $(cat "$count") tests"
            sum=$((sum + $(cat "$count")))
          done
          echo "The $groups groups ran $sum tests; the bundle lists $BUNDLE_TESTS."
          test "$groups" -eq "$EXPECTED_GROUPS"
          test "$sum" -eq "$BUNDLE_TESTS"

  # Joins the groups' lists of passed compile checks into the one list this
  # run saves for its branch and uploads for "Share Passed Compile Checks",
  # as the one process did. In the test jobs' container, because a cache
  # restores only where the compression matches (gzip there). It cannot fail
  # the run's verdict on the tests: every step only saves compiles.
  verify-passed-compile-checks:
    name: Save Passed Compile Checks of Verify
    needs: [verify, verify-tests]
    if: ${{ always() && needs.verify.outputs.split == 'true' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      # The steps below move the groups' lists and their value comparison
      # outputs, 2,720 outputs and 109 MB uncompressed in a run that printed
      # them all, which the download, join, save and upload did in 2, 0, 3 and
      # 9 seconds (run 44637806385); the limits only stop a stalled transfer,
      # as in "Share Passed Compile Checks".
      - name: Download the Groups' Passed Compile Checks
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: verify-passed-compile-checks-*
          path: group-compile-checks
      - name: Join the Groups' Passed Compile Checks
        run: |
          mkdir -p .compile-check-cache
          groups=$(find group-compile-checks -name passed.txt 2>/dev/null | wc -l)
          if [ "$groups" -gt 0 ]; then
            find group-compile-checks -name passed.txt -exec cat {} + | LC_ALL=C sort -u > .compile-check-cache/passed.txt
            # The checks the groups themselves passed, which is all that
            # "Upload Passed Compile Checks to Share" uploads.
            find group-compile-checks -name "passed-in-run-$GITHUB_RUN_ID.txt" -exec cat {} + | LC_ALL=C sort -u > ".compile-check-cache/passed-in-run-$GITHUB_RUN_ID.txt"
            echo "Passed compile checks of $groups groups: $(wc -l < .compile-check-cache/passed.txt) together, $(wc -l < ".compile-check-cache/passed-in-run-$GITHUB_RUN_ID.txt") of them passed in this run."
            # The outputs each group used, which are what its cache would have
            # kept, and the list of those its processes printed, which is all
            # the upload below shares. Two groups that used one output hold
            # the same file, named by the program's key, which the script
            # keeps once.
            .github/scripts/join-value-outputs.sh group-compile-checks .compile-check-cache
            find group-compile-checks -name "value-outputs-written-in-run-$GITHUB_RUN_ID.txt" -exec cat {} + | LC_ALL=C sort -u > ".compile-check-cache/value-outputs-written-in-run-$GITHUB_RUN_ID.txt"
            echo "Value comparison outputs of $groups groups: $(find .compile-check-cache/value-outputs -type f | wc -l) used, $(wc -l < ".compile-check-cache/value-outputs-written-in-run-$GITHUB_RUN_ID.txt") of them printed in this run."
          else
            echo "No group uploaded passed compile checks."
          fi
          rm -rf group-compile-checks
      - name: Save Passed Compile Checks
        if: ${{ hashFiles('.compile-check-cache/passed.txt') != '' }}
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .compile-check-cache
          key: compile-checks-v1-${{ runner.os }}-${{ needs.verify.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Passed Compile Checks to Share
        continue-on-error: true
        uses: ./.github/actions/upload-passed-compile-checks
        with:
          identity: ${{ needs.verify.outputs.identity }}

  # Builds release mode's tests on every push to main, from the build of the
  # push before it, and saves the build directory under the commit, so that a
  # dispatched run on any branch starts from main's newest build. The sources
  # are stamped as the job above stamps them, which is what lets either build
  # skip a target whose files did not change. Dispatched with `mode=warm` it
  # does the same for the branch it is dispatched on, whose later `release`
  # runs then start from that build: a way to try a change to this workflow
  # before it lands, and to spare a long-lived branch its first full build.
  # A newer push cancels an older one's job, since only the newest build is
  # restored. Each saved build is about 480 MB, so "Delete Older Release
  # Verify Builds" below deletes the ref's older ones. It runs on Linux beside CI and slows none of CI's jobs,
  # reads the repository and nothing else, and saving a cache takes no token
  # permission. The step took 23.9 minutes from nothing (run 43772841709),
  # and the job above about 10 seconds from the same commit's build and 2
  # minutes after a change to one test file; its limit is twice the 25.5
  # minutes of the slowest full release build (43774444496).
  warm-release-cache:
    name: Warm the Release Verify Build Cache
    if: ${{ github.event_name == 'push' || inputs.mode == 'warm' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 60
    # A run that skips this job gets a group of its own, so that a
    # dispatched `release` or `fast` run never cancels a build being saved.
    concurrency:
      group: verify-warm-release-${{ github.ref }}-${{ (github.event_name == 'push' || inputs.mode == 'warm') && 'warm' || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Stamp Source Times
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          .github/scripts/stamp-source-times.sh
      - name: Restore Older Release Build Directory
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: verify-release-v1-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            verify-release-v1-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-${{ github.sha }}-
            verify-release-v1-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: swift package resolve
      - name: Build Tests
        timeout-minutes: 50
        run: |
          # shellcheck disable=SC2086 # The arguments are words to split.
          swift build --build-tests $RELEASE_SWIFT_TEST_ARGUMENTS
      # The run's attempt is in the key because a key is saved once: a second
      # attempt at one commit would otherwise fail to save. A run that
      # restored this commit's own build has nothing new to save.
      - name: Save Release Build Directory
        if: ${{ !contains(steps.restore.outputs.cache-matched-key, format('-{0}-', github.sha)) }}
        uses: actions/cache/save@v6
        with:
          path: .build
          key: verify-release-v1-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Deletes every release build "Warm the Release Verify Build Cache" saved
  # for this ref but the newest. A run restores only the newest, by the
  # key's prefix, and each push to main saved another of about 480 MB into
  # a repository whose caches GitHub evicts, least recently read first,
  # above 10 GB. On 2026-11-17 the repository stood at 9.9 GB, so each save
  # evicted about as much, and what went was whatever had been read least
  # recently: an older one of these, or a cache read less often, such as
  # the macOS build of a runner image few runs land on, whose absence cost
  # a run 9 minutes (ci.yml's "Build and Test on Xcode 26" has the runs).
  # Deleting the older build here leaves the rest alone. It keeps the newest by
  # creation time rather than this run's own, so an older run that finishes
  # late deletes nothing newer. Deleting a cache takes `actions: write`,
  # which only this job has; it checks nothing out and calls only GitHub's
  # API, so it needs no container. A failure warns and leaves the builds for
  # the next run or for eviction.
  prune-release-cache:
    name: Delete Older Release Verify Builds
    needs: warm-release-cache
    if: ${{ !cancelled() && needs.warm-release-cache.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete All but the Newest Build
        # A list and a delete for each older build, usually one. One minute
        # is the least the limit can be set to in whole minutes.
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          if ! older=$(gh api -X GET "repos/$REPOSITORY/actions/caches" -f key=verify-release-v1- -f ref="$REF" -f sort=created_at -f direction=desc -F per_page=100 --jq '.actions_caches[1:][] | "\(.id) \(.key)"' 2>&1); then
            echo "::warning::Listing $REF's release builds failed: $(printf '%s' "$older" | tr '\r\n' '  ')"
            exit 0
          fi
          if [ -z "$older" ]; then
            echo "$REF has no older release build."
            exit 0
          fi
          printf '%s\n' "$older" | while read -r id key; do
            if deleted=$(gh api -X DELETE "repos/$REPOSITORY/actions/caches/$id" 2>&1); then
              echo "Deleted $key."
            else
              echo "::warning::Deleting $key failed: $(printf '%s' "$deleted" | tr '\r\n' '  ')"
            fi
          done

  # Builds fast mode's tests on main, so that the dependencies' debug build
  # products (swift-syntax's, most of a cold build) are in a cache every branch
  # can restore. SafeDI's own targets rebuild in every run anyway: a checkout
  # gives each source a new modification time. The key changes only with
  # Package.resolved, the build's arguments or the compiler, so most pushes
  # find it and stop after the lookup. It runs on Linux beside CI and slows none of CI's jobs. Like
  # the job above it reads the repository and nothing else; saving a cache
  # takes no token permission.
  warm-fast-cache:
    name: Warm the Fast Verify Build Cache
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Hash Fast Build Arguments
        id: fast-build-arguments
        run: |
          compiler=$(swift --version 2>&1)
          arguments=$(printf '%s\n%s' "$FAST_SWIFT_TEST_ARGUMENTS" "$compiler" | sha256sum | cut -c1-16)
          test "${#arguments}" -eq 16
          echo "hash=$arguments" >> "$GITHUB_OUTPUT"
      - name: Look Up Debug Build Directory
        id: lookup
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: verify-debug-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-${{ steps.fast-build-arguments.outputs.hash }}
          lookup-only: true
      # A miss restores the newest older cache, and the build is incremental
      # from there.
      - name: Restore Older Debug Build Directory
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: verify-debug-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-${{ steps.fast-build-arguments.outputs.hash }}
          restore-keys: |
            verify-debug-${{ runner.os }}-swift-6.2-
      - name: Resolve Package Dependencies
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/retry
        with:
          command: swift package resolve
      - name: Build Tests
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        timeout-minutes: 40
        run: |
          # shellcheck disable=SC2086 # The arguments are words to split.
          swift build --build-tests $FAST_SWIFT_TEST_ARGUMENTS
      - name: Save Debug Build Directory
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .build
          key: verify-debug-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-${{ steps.fast-build-arguments.outputs.hash }}

  # ci.yml's "Check Function Compile Time on Linux" for one branch, by hand:
  # `gh workflow run verify.yml --ref <branch> -f mode=function-compile-time`.
  # That check fails a pull request when the compiler spends too long on one
  # function of SafeDICore, and it is the only place that says so: the limit
  # is about this container's Swift 6.2, and a newer compiler on a
  # contributor's machine type-checks the same function several times faster.
  # A stack of pull requests runs CI on its top only, so a slow function in a
  # lower one surfaced when the whole stack ran. This mode answers in the time
  # of one build of SafeDICore, with no test job and no cache.
  #
  # It always times, whatever the branch changed, since asking for it is the
  # reason to run it. Keep its container, its build command and its check in
  # step with ci.yml's job, whose comments hold the measurements: the build
  # took 537 to 733 s there, so the limit is the same 25 minutes.
  function-compile-time:
    name: Verify Function Compile Time on Linux
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'function-compile-time' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      # A filter or `pins` belongs to a mode that tests; a run that ignored
      # one would read as having tested.
      - name: Refuse Inputs This Mode Does Not Read
        env:
          FILTER: ${{ inputs.filter }}
          PINS: ${{ inputs.pins }}
        run: |
          if [ -n "$FILTER" ] || [ "$PINS" = true ]; then
            echo "::error::mode=function-compile-time runs no test, so it takes no filter and no pins."
            exit 1
          fi
      - name: Install Python
        uses: ./.github/actions/retry
        with:
          command: command -v python3 >/dev/null || { apt-get update && apt-get install -y --no-install-recommends python3; }
      - name: Check the Script
        run: python3 -I Scripts/function-compile-time-check.py --self-test "$RUNNER_TEMP/function-compile-time-self-test"
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: swift package resolve
      - name: Build SafeDICore with the Compiler's Timers
        timeout-minutes: 25
        run: |
          set -o pipefail
          swift build -c release --traits sourceBuild --target SafeDICore -v \
            -Xswiftc -Xfrontend -Xswiftc -debug-time-function-bodies \
            -Xswiftc -Xllvm -Xswiftc -sil-print-pass-time -Xswiftc -Xllvm -Xswiftc -sil-min-pass-time=20 \
            > "$RUNNER_TEMP/function-compile-time.log" 2>&1 || { tail -n 200 "$RUNNER_TEMP/function-compile-time.log"; exit 1; }
      - name: Check Each Function's Time
        run: python3 -I Scripts/function-compile-time-check.py --summary "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/function-compile-time.log"

  # Deletes the branch this run was dispatched on when it is a scratch ref:
  # one a tool pushed only to run this workflow on a commit, named
  # `verify/…`, `probe/…` or `coverage/…`. A tool that is killed never
  # deletes its ref, so the run does, and the tool's own delete is the
  # fallback for a run that never reaches this job. It needs every other job,
  # so it runs last, and `always()` has it run after a failure or a cancel.
  # A job added to this workflow goes into its `needs:` too, or the ref could
  # go while that job still has to check it out. It skips a `mode=warm`
  # run, which saves a build for the branch's next `release` run, whose own
  # delete then removes the branch (a warm run skipped it: 44036970175, on a
  # probe commit whose warm job stopped at once).
  #
  # It leaves the ref while another run on it has not finished. That run
  # deletes it when it ends if it is a run of verify.yml or graph-fuzzer.yml;
  # if it is another workflow's, or if two runs end within seconds and each
  # sees the other unfinished, the ref stays for the tool's own delete. The
  # delete is a push that names this run's commit as the value the ref must
  # still have, which GitHub checks as it deletes, so a ref a later push
  # moved is left, and one deleted during the run is found already gone.
  # GitHub starts no re-run of a run whose ref is gone. A run dispatched on
  # the ref just before this job lists the ref's runs can be missing from
  # the list and lose its ref; the tools push a new ref for each run they
  # dispatch, so that race is accepted. The ref's
  # name reaches the API as a request field and git as an argument, never
  # inside a URL. A failure to list the runs or to delete only warns, and
  # the step's `continue-on-error` keeps its timeout from failing the job, so
  # the delete never fails a run that passed nor puts a failed check on its
  # commit. The job's own keeps the run green on a failure outside the step,
  # such as a lost runner, though that job's check then shows the failure.
  #
  # It checks nothing out and runs no code of the ref's but this step, and is
  # the workflow's only job that can write: `contents: write` to delete the
  # ref, `actions: read` to list the ref's runs. It calls only GitHub's API
  # and git, so it needs no container.
  #
  # Probed by dispatches no tool deleted after: a Verify run with a filter
  # (44026679738) and one with `pins` (44030204927), after the jobs it calls,
  # deleted their refs. A Verify run that ended while a Graph Fuzzer run on
  # its ref had not (44028823431) logged that it left the ref, and the Graph
  # Fuzzer run deleted it when it ended (44026683066). A ref named
  # `probe/lane-delete&status=completed` was left while another run on it was
  # unfinished (44032859335) and then deleted (44032847773); a ref pushed
  # elsewhere during the run was left (44033034599), and one deleted while
  # its run was in progress was found already gone (44037696301). A run
  # cancelled while it built deleted its ref (44036973726), and a re-run of
  # it after that failed to start (its second attempt). On probe commits that
  # changed only the credentials or the step's length, a token the API
  # refuses (44031256021) and git credentials GitHub refuses (44031416560)
  # each warned and passed, and a step stopped by its limit left this job
  # and its check green (44036369586, and its re-run with the ref pushed
  # again).
  # graph-fuzzer.yml has the same job; keep the two steps the same.
  delete-scratch-ref:
    name: Delete This Run's Scratch Ref
    needs:
      - verify
      - verify-tests
      - fuzz
      - verify-test-partition
      - verify-passed-compile-checks
      - function-compile-time
      - warm-release-cache
      - prune-release-cache
      - warm-fast-cache
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode != 'warm' && github.ref_type == 'branch' && (startsWith(github.ref_name, 'verify/') || startsWith(github.ref_name, 'probe/') || startsWith(github.ref_name, 'coverage/')) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      actions: read
    steps:
      - name: Delete the Ref
        # 0 to 4 s in the probe runs above, deleting, leaving or finding the
        # ref already gone. One minute is the least the limit can be set to
        # in whole minutes; a step it stops leaves the ref for the tool and,
        # by `continue-on-error`, fails neither the job nor the run.
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          case "$REF_NAME" in
            verify/*|probe/*|coverage/*) ;;
            *) echo "$REF_NAME is not a scratch ref. Left."; exit 0 ;;
          esac
          left_for_the_tool() {
            # One line, since a warning annotation ends at the first line
            # break, and the API's error bodies end their lines in \r\n.
            echo "::warning::$REF_NAME is left for the tool that pushed it to delete: $(printf '%s' "$1" | tr '\r\n' '  ')"
            exit 0
          }
          if ! unfinished=$(gh api -X GET "repos/$REPOSITORY/actions/runs" -f branch="$REF_NAME" -F per_page=100 --jq "[.workflow_runs[] | select(.id != $RUN_ID and .status != \"completed\") | .id | tostring] | join(\" \")" 2>&1); then
            left_for_the_tool "listing its runs failed: $unfinished"
          fi
          if [ -n "$unfinished" ]; then
            echo "$REF_NAME is left: run(s) $unfinished on it have not finished."
            exit 0
          fi
          remote="https://github.com/$REPOSITORY.git"
          authorization="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          repository="$RUNNER_TEMP/delete-scratch-ref"
          git init -q "$repository"
          # Refused unless the ref still points at this run's commit.
          if pushed=$(git -C "$repository" -c http.extraHeader="$authorization" push --force-with-lease="refs/heads/$REF_NAME:$COMMIT" "$remote" ":refs/heads/$REF_NAME" 2>&1); then
            echo "Deleted $REF_NAME."
            exit 0
          fi
          if ! listed=$(git -C "$repository" -c http.extraHeader="$authorization" ls-remote "$remote" "refs/heads/$REF_NAME" 2>&1); then
            left_for_the_tool "the delete failed ($pushed), and so did reading the ref ($listed)"
          fi
          now=$(printf '%s\n' "$listed" | awk -v ref="refs/heads/$REF_NAME" '$2 == ref { print $1 }')
          if [ -z "$now" ]; then
            echo "$REF_NAME is already gone."
          elif [ "$now" != "$COMMIT" ]; then
            echo "$REF_NAME is left: it now points at $now, not this run's $COMMIT."
          else
            left_for_the_tool "the delete failed: $pushed"
          fi
