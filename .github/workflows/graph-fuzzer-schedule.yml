name: Graph Fuzzer Schedule

# Runs graph-fuzzer.yml weekly, unless main has not changed since the last
# scheduled run that fuzzed and passed. When the fuzzer fails, or this
# workflow cannot trust its own decision to skip, it opens (or comments on)
# an issue. Publish runs the fuzzer before every release regardless.
on:
  schedule:
    # Mondays at 07:23 UTC.
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  decide:
    name: Decide Whether to Fuzz
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should-fuzz: ${{ steps.decide.outputs.should-fuzz }}
    steps:
      - name: Compare main with the last fuzzed commit
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The last scheduled run whose fuzz job ran and passed: a run that
          # skipped also succeeds, but fuzzed nothing.
          last_sha=""
          last_date=""
          last_url=""
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/graph-fuzzer-schedule.yml/runs?branch=main&event=schedule&status=success&per_page=30" \
            --jq '.workflow_runs[] | [.id, .head_sha, .created_at, .html_url] | @tsv' 2>/dev/null) || runs=""
          while IFS=$'\t' read -r run_id head_sha created_at html_url; do
            [ -n "$run_id" ] || continue
            fuzzed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
              --jq '[.jobs[] | select((.name | contains("Fuzz Dependency Graphs")) and .conclusion == "success")] | length' 2>/dev/null) || fuzzed=0
            if [ "$fuzzed" -gt 0 ]; then
              last_sha=$head_sha
              last_date=$created_at
              last_url=$html_url
              break
            fi
          done <<< "$runs"

          if [ -z "$last_sha" ]; then
            should_fuzz=true
            reason="No earlier scheduled run fuzzed and passed (or the Actions API could not be read), so this run fuzzes."
          elif [ "$last_sha" != "$GITHUB_SHA" ]; then
            should_fuzz=true
            reason="main moved from $last_sha, fuzzed by [the last full run]($last_url), to $GITHUB_SHA."
          else
            should_fuzz=false
            reason="main is still at $GITHUB_SHA, which [the last full run]($last_url) fuzzed on $last_date."
            # Check the decision to skip against a second signal: main's head
            # commit cannot be newer than the run that fuzzed it. If it is, the
            # comparison above is broken, and skipping could go on forever.
            head_date=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.committer.date')
            if [[ "$head_date" > "$last_date" ]]; then
              echo "::error::The skip logic says main is unchanged since $last_date, but main's head commit is dated $head_date."
              {
                echo "### Graph fuzzer did not run"
                echo
                echo "The skip logic says main is unchanged since the last full run on $last_date, but main's head commit $GITHUB_SHA is dated $head_date, so the skip logic is broken."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          echo "should-fuzz=$should_fuzz" >> "$GITHUB_OUTPUT"
          {
            if [ "$should_fuzz" = true ]; then
              echo "### Fuzzing"
            else
              echo "### Skipped: main has not changed"
            fi
            echo
            echo "$reason"
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: Fuzz
    needs: decide
    if: ${{ needs.decide.outputs.should-fuzz == 'true' }}
    uses: ./.github/workflows/graph-fuzzer.yml
    permissions:
      # `actions: read` is for graph-fuzzer.yml's check that this schedule is enabled.
      actions: read
      contents: read

  # Fails when the decision and what the fuzz job did disagree, so a broken
  # decision output cannot skip the fuzzer without the run turning red. A
  # cancelled run is not checked.
  verify:
    name: Verify the Decision Was Followed
    needs: [decide, fuzz]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SHOULD_FUZZ: ${{ needs.decide.outputs.should-fuzz }}
      DECIDE_RESULT: ${{ needs.decide.result }}
      FUZZ_RESULT: ${{ needs.fuzz.result }}
    steps:
      - name: Compare the decision with the fuzz job's result
        run: |
          case "$DECIDE_RESULT/$SHOULD_FUZZ/$FUZZ_RESULT" in
            success/true/success | success/false/skipped)
              echo "Decided should-fuzz=$SHOULD_FUZZ; the fuzz job's result was $FUZZ_RESULT." ;;
            *)
              echo "::error::The decide job ($DECIDE_RESULT) decided should-fuzz='$SHOULD_FUZZ', but the fuzz job's result was $FUZZ_RESULT."
              exit 1 ;;
          esac

  report:
    name: Open or Update Issue
    needs: [decide, fuzz, verify]
    if: ${{ failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      ISSUE_TITLE: Graph fuzzer found a failure
    steps:
      - name: Download Report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: graph-fuzzer-report
          path: graph-fuzzer
      - name: Open or Update Issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/graph-fuzzer-issue.md"
          {
            echo "The [scheduled graph fuzzer run]($RUN_URL) failed on commit $GITHUB_SHA."
            echo
            if [ -s graph-fuzzer/summary.md ]; then
              cat graph-fuzzer/summary.md
            else
              echo "It produced no fuzzer summary: either the decision whether to fuzz failed, or the fuzz job stopped before it ran the long run. See the run's log."
            fi
          } > "$body"
          issue_number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$body"
          fi
