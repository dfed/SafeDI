name: Graph Fuzzer

# Runs SafeDI's random dependency-graph fuzzer by hand, from any starting
# seed and for any number of graphs, to explore graphs beyond the fixed
# corpora that ci.yml fuzzes on every pull request and push to main. Its
# default, `iterations: corpus`, is the selected corpus: seeds
# 0..<corpusSeedCount of the base corpus, 0..<seamCorpusSeedCount of the
# seam corpus when `features` is `generateDependencyTree`, or
# 0..<publicMockCorpusSeedCount of the public mock corpus when `features` is
# `generateMockPublic` (see SafeDIToolGraphFuzzerTests.swift). The graphs
# are split across `shards` jobs (SAFEDI_GRAPH_FUZZER_SHARD), each building
# the tests and uploading its report as `graph-fuzzer-report-<index>`, which
# .github/scripts/combine-graph-fuzzer-reports.py combines with the reports of
# the other corpora. A failure, a stale known issue, a problem with the run
# itself, a crash, or a run that checks no graphs fails the job and names the
# seeds in the job summary.
#
# With `coverage`, the run instead lists the generator lines a change adds or
# modifies that no corpus graph executed, the report ci.yml makes for a pull
# request, for any commit before it is pushed for review. It builds the
# commit the run is dispatched on for coverage as "Build Tests on Linux"
# does, runs the unit suite once for its coverage, fuzzes every corpus in the
# shards of ci.yml's graph-fuzzer job with each shard's profile kept, and
# reports the lines changed since `base`
# (.github/scripts/report-graph-fuzzer-coverage.sh). The report is in the
# report job's summary and its `fuzzer-coverage` artifact; see "Coverage of a
# change" in .claude/rules/fuzzer-corpora.md. It also checks the corpora's
# pins across the shards, as ci.yml's "Check Graph Fuzzer Corpus on Linux"
# does, so the run says which pins a change moved before a pull request's
# checks do. Inputs reach the shell through environment variables, never
# interpolated into a script.
#
# verify.yml calls this workflow with `coverage` and the name of the bundle
# its own build uploaded (`-f pins=true` there), so one run of one build
# tests a commit and fuzzes it; the build job below is then skipped.
#
# With `release_acceptance`, the run instead checks that every graph of the
# base, seam and public mock corpora that SafeDI 2.3.0 accepts still builds
# the same values, by calling
# release-acceptance.yml, which ci.yml also calls on every pull request and
# push to main; see .claude/rules/fuzzer-release-acceptance.md.
#
# A dispatched run caches under the ref it is dispatched on, which "Use
# workflow from" limits to a branch or tag of this repository, and every job
# builds or runs that ref's commit, `github.sha`, never one an input or
# another job's output names: a job that builds code can reach the cache
# service, so a commit an input named, perhaps a fork's, could write the
# caches of the branch the run is dispatched on, main's when dispatched on
# main.
on:
  workflow_dispatch:
    inputs:
      starting_seed:
        description: The first seed to run.
        required: false
        default: '0'
      features:
        description: The generator features to draw with, comma-separated (`generateDependencyTree` for the seam corpus, `generateMockPublic` for the public mock corpus), or empty for the base corpus.
        required: false
        default: ''
      iterations:
        description: The number of graphs to run, or `corpus` for every seed of the selected corpus (corpusSeedCount, seamCorpusSeedCount with the seam feature, or publicMockCorpusSeedCount with the public mock feature).
        required: false
        default: 'corpus'
      shards:
        description: The number of jobs to split the graphs across, or `auto` for four with the seam feature (`generateDependencyTree`), whose graphs cost the most, and one otherwise.
        type: choice
        options: ['auto', '1', '2', '3', '4']
        default: 'auto'
      coverage:
        description: Instead of the fuzzing above, list the generator lines the commit the run is dispatched on changed since `base` that no corpus graph executed, fuzzing every corpus as ci.yml does. The inputs above are ignored.
        type: boolean
        default: false
      base:
        description: With `coverage`, the commit or branch to list changes since, or empty for the merge base with main of the commit the run is dispatched on.
        required: false
        default: ''
      release_acceptance:
        description: Instead of the fuzzing above, check that every graph of the base, seam and public mock corpora that SafeDI 2.3.0 accepts still compiles and builds the same values. The inputs above are ignored.
        type: boolean
        default: false
      targeted:
        description: Instead of the fuzzing above, run the targeted fuzzer of a switch (.github/scripts/switch-attack/gate.sh) over the tools of two commits, `on_commit` and `off_commit`. The inputs above are ignored.
        type: boolean
        default: false
      on_commit:
        description: With `targeted`, the commit or branch of this repository whose SafeDITool has the switch on.
        required: false
        default: ''
      off_commit:
        description: With `targeted`, the commit or branch of this repository whose SafeDITool has the switch off.
        required: false
        default: ''
      first_seed:
        description: With `targeted`, the first seed.
        required: false
        default: '0'
      last_seed:
        description: With `targeted`, the last seed. Each seed is two graphs, one per declaration order, so the default is 100,000 graphs.
        required: false
        default: '49999'
      targeted_shards:
        description: With `targeted`, the number of jobs the seeds are split across.
        required: false
        default: '30'
      targeted_mocks:
        description: With `targeted`, compare mocks instead of production roots. `on_commit` is built with .github/scripts/switch-attack/lay-out-mocks.sh's two edits, gen2.py draws its mock-heavy graphs, approved differences are normalized by number and counted (normalize-mocks.py), and the base and public mock corpora's long runs run on the patched commit for the value oracles.
        type: boolean
        default: false
  # From verify.yml, in whose run the jobs below then run: they read the
  # bundle that run's build uploaded and build nothing.
  workflow_call:
    inputs:
      coverage:
        description: Always true from a caller, which has the `coverage` jobs run.
        type: boolean
        required: true
      base:
        description: The commit or branch to list changes since, or empty for the merge base with main.
        type: string
        required: false
        default: ''
      bundle:
        description: The artifact of the caller's run that holds the test bundle, a `<name>.tar.gz` of what "Build for Coverage on Linux" packages.
        type: string
        required: true

permissions: {}

env:
  # The artifact that holds the test bundle, and the archive in it less its
  # extension: this workflow's own, or the one a calling workflow names.
  TEST_BUNDLE: ${{ inputs.bundle || 'graph-fuzzer-test-bundle' }}

jobs:
  fuzz:
    # Nothing here needs macOS: it runs the tool and compiles its output with
    # `swiftc -emit-object`, so it uses the Linux test job's container.
    name: Fuzz Dependency Graphs on Linux (shard ${{ strategy.job-index }} of ${{ strategy.job-total }})
    if: ${{ !inputs.coverage && !inputs.release_acceptance && !inputs.targeted }}
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # One matrix entry per shard; each job reads its index and the count from `strategy`.
      # `auto` gives the seam corpus four. With two, shard 0 fuzzed for 61 to
      # 63 minutes after a 26-minute build, against the job's 90: run 340 of
      # this workflow was cancelled at the limit, and run 345 finished with
      # under a minute to spare. Four halve each shard's graphs, which should
      # leave a shard near 57 minutes; that is not measured yet.
      matrix:
        shard: ${{ fromJSON('{"1":[0],"2":[0,1],"3":[0,1,2],"4":[0,1,2,3]}')[(inputs.shards || 'auto') == 'auto' && (inputs.features == 'generateDependencyTree' && '4' || '1') || inputs.shards] }}
    defaults:
      run:
        shell: bash
    env:
      ITERATIONS: ${{ inputs.iterations || 'corpus' }}
      STARTING_SEED: ${{ inputs.starting_seed || '0' }}
      FEATURES: ${{ inputs.features || '' }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: swift package resolve
      - name: Name Report Files
        run: |
          mkdir -p "$RUNNER_TEMP/graph-fuzzer"
          echo "REPORT=$RUNNER_TEMP/graph-fuzzer/report.txt" >> "$GITHUB_ENV"
          echo "SUMMARY=$RUNNER_TEMP/graph-fuzzer/summary.md" >> "$GITHUB_ENV"
      # Release, as the Linux test job builds, so the tool's thousands of runs are fast.
      - name: Build
        run: swift build -c release -Xswiftc -enable-testing --traits sourceBuild --build-tests
      - name: Run Graph Fuzzer
        run: |
          SAFEDI_GRAPH_FUZZER_FEATURES="$FEATURES" \
          SAFEDI_GRAPH_FUZZER_ITERATIONS="$ITERATIONS" \
          SAFEDI_GRAPH_FUZZER_STARTING_SEED="$STARTING_SEED" \
          SAFEDI_GRAPH_FUZZER_SHARD="${{ strategy.job-index }}/${{ strategy.job-total }}" \
          SAFEDI_GRAPH_FUZZER_REPORT="$REPORT" \
            swift test -c release -Xswiftc -enable-testing --traits sourceBuild --skip-build --filter 'SafeDIToolGraphFuzzerTests/longRun'
      - name: Summarize
        if: ${{ !cancelled() }}
        run: .github/scripts/summarize-graph-fuzzer-report.sh "$REPORT" "$SUMMARY" "$STARTING_SEED" "$ITERATIONS" "$FEATURES"
      - name: Upload Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: graph-fuzzer-report-${{ strategy.job-index }}
          path: ${{ runner.temp }}/graph-fuzzer/
          if-no-files-found: ignore

  # The jobs below run only with `coverage`. This one builds the test bundle
  # with "Build Tests on Linux"'s arguments, which are also the arguments
  # of verify.yml's release build, so it starts from the build "Warm the
  # Release Verify Build Cache" there saved for the branch the run is
  # dispatched on, or else for main's newest commit: with the sources' times
  # stamped as that job stamps them, it compiles again only the targets whose
  # files differ and the targets that depend on them, which for a change to
  # the corpora's pins is the fuzzer's test target. It reads the cache and
  # never saves it. Keep the key and the arguments in step with verify.yml.
  coverage-build:
    name: Build for Coverage on Linux
    if: ${{ inputs.coverage && !inputs.bundle && !inputs.release_acceptance }}
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      SWIFT_BUILD_ARGUMENTS: -c release --enable-code-coverage -Xswiftc -enable-testing -Xswiftc -Xllvm -Xswiftc -instrprof-atomic-counter-update-all --traits sourceBuild
    steps:
      # This checks out `github.sha`, the commit the run is dispatched on, and
      # the other jobs name it, so a branch that moves during the run changes
      # nothing.
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Stamp Source Times
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          .github/scripts/stamp-source-times.sh
      # No cache has the key, which names a run: the newest build of this
      # commit, then of this branch or main.
      - name: Restore Build Directory
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: verify-release-v1-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            verify-release-v1-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-${{ github.sha }}-
            verify-release-v1-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: swift package resolve
      # From nothing the build has taken 23 to 26 minutes (runs 43772841709,
      # 43774444496, 43774447047), which is also what
      # a change to SafeDICore costs; from a saved build of the same commit it
      # took 15 seconds (run 43762600658, 13.2 minutes in all). The limit is
      # twice the slowest.
      - name: Build
        timeout-minutes: 50
        run: |
          # shellcheck disable=SC2086 # The arguments are words to split.
          swift build $SWIFT_BUILD_ARGUMENTS --build-tests
      # What ci.yml's "Build Tests on Linux" packages for the jobs that run it.
      - name: Package Test Bundle
        run: |
          products=.build/x86_64-unknown-linux-gnu/release
          tar -czf graph-fuzzer-test-bundle.tar.gz \
            "$products/SafeDIPackageTests.xctest" \
            "$products/SafeDITool" \
            "$products/SafeDIMacros-tool" \
            "$products/Modules/SafeDI.swiftmodule"
      - name: Upload Test Bundle
        uses: actions/upload-artifact@v7
        with:
          name: graph-fuzzer-test-bundle
          path: graph-fuzzer-test-bundle.tar.gz
          retention-days: 1
          # A re-run of the job replaces what an earlier attempt uploaded.
          overwrite: true

  # Runs the unit suite once, beside the shards, for the report's split
  # between lines a unit test reaches and lines nothing reaches. Compile checks
  # are off: they compile generated strings and change no count of a line
  # under Sources. A failing suite still writes its profile, and the report
  # says it failed; a crashed one writes none, and the report then makes no
  # split.
  coverage-unit-suite:
    name: Run the Unit Suite for Coverage on Linux
    needs: coverage-build
    if: ${{ !cancelled() && inputs.coverage && (needs.coverage-build.result == 'success' || inputs.bundle) }}
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 55
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Download Test Bundle
        uses: ./.github/actions/download-artifact
        with:
          name: ${{ env.TEST_BUNDLE }}
      - name: Unpack Test Bundle
        run: |
          tar -xzf "$TEST_BUNDLE.tar.gz"
          mkdir -p "$RUNNER_TEMP/unit-suite-profiles" unit-suite
      - name: Run Unit Suite
        id: suite
        # About twice the measured duration. The step took 24m05s on the
        # 2.3.1 trim (Verify run 44714429086, 2026-11-20), where the seam
        # smoke seeds alone ran 1,442 s; an added oracle that runs the tool
        # again on some graphs made every fuzzer test 8 to 12% slower and
        # passed the old limit of 25 minutes (run 44738763289).
        timeout-minutes: 50
        env:
          SAFEDI_SKIP_COMPILE_CHECK: 1
          LLVM_PROFILE_FILE: ${{ runner.temp }}/unit-suite-profiles/unit-suite-%p.profraw
        run: .build/x86_64-unknown-linux-gnu/release/SafeDIPackageTests.xctest --testing-library swift-testing
      # The artifact always holds the suite's outcome and, when the suite
      # wrote one, its profile, so the report job's download finds it.
      - name: Merge Profile
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.suite.outcome }}
        run: |
          echo "$OUTCOME" > unit-suite/outcome.txt
          shopt -s nullglob
          profiles=("$RUNNER_TEMP"/unit-suite-profiles/*.profraw)
          if [ ${#profiles[@]} -gt 0 ]; then
            llvm-profdata merge -sparse "${profiles[@]}" -o unit-suite/default.profdata
          else
            echo "The unit suite wrote no coverage profile."
          fi
      - name: Upload Profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-suite-profile
          path: unit-suite/
          retention-days: 1
          # A re-run of the job replaces what an earlier attempt uploaded.
          overwrite: true

  # ci.yml's graph-fuzzer shards; keep the matrix in step with that job's, and
  # coverage-report's EXPECTED_SHARDS with this matrix.
  # Each shard keeps its profile in its report folder, as ci.yml's shards do.
  coverage-fuzz:
    name: Fuzz for Coverage on Linux (${{ matrix.corpus }} seeds ${{ matrix.starting-seed }}+${{ matrix.iterations }})
    needs: coverage-build
    if: ${{ !cancelled() && inputs.coverage && (needs.coverage-build.result == 'success' || inputs.bundle) }}
    runs-on: ubuntu-latest
    container: swift:6.2
    # Above the fuzzer step's limit by more than the longest the job's other
    # steps have taken: one job ran 20.0 minutes, 11 of them initializing
    # its container (run 43879263598).
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {corpus: base, features: '', starting-seed: 0, iterations: 1250}
          - {corpus: base, features: '', starting-seed: 1250, iterations: 1250}
          - {corpus: base, features: '', starting-seed: 2500, iterations: 1250}
          - {corpus: base, features: '', starting-seed: 3750, iterations: 1250}
          - {corpus: generateDependencyTree, features: generateDependencyTree, starting-seed: 0, iterations: 125}
          - {corpus: generateDependencyTree, features: generateDependencyTree, starting-seed: 125, iterations: 125}
          - {corpus: generateDependencyTree, features: generateDependencyTree, starting-seed: 250, iterations: 125}
          - {corpus: generateDependencyTree, features: generateDependencyTree, starting-seed: 375, iterations: 125}
          - {corpus: generateDependencyTree, features: generateDependencyTree, starting-seed: 500, iterations: 125}
          - {corpus: generateDependencyTree, features: generateDependencyTree, starting-seed: 625, iterations: 125}
          - {corpus: generateDependencyTree, features: generateDependencyTree, starting-seed: 750, iterations: 125}
          - {corpus: generateDependencyTree, features: generateDependencyTree, starting-seed: 875, iterations: 125}
          - {corpus: generateDependencyTree, features: generateDependencyTree, starting-seed: 1000, iterations: 125}
          - {corpus: generateDependencyTree, features: generateDependencyTree, starting-seed: 1125, iterations: 125}
          - {corpus: generateDependencyTree, features: generateDependencyTree, starting-seed: 1250, iterations: 125}
          - {corpus: generateDependencyTree, features: generateDependencyTree, starting-seed: 1375, iterations: 125}
          - {corpus: generateDependencyTree, features: generateDependencyTree, starting-seed: 1500, iterations: 125}
          - {corpus: generateDependencyTree, features: generateDependencyTree, starting-seed: 1625, iterations: 125}
          - {corpus: generateDependencyTree, features: generateDependencyTree, starting-seed: 1750, iterations: 125}
          - {corpus: generateDependencyTree, features: generateDependencyTree, starting-seed: 1875, iterations: 125}
          - {corpus: generateMockPublic, features: generateMockPublic, starting-seed: 0, iterations: 500}
          - {corpus: generateMockPublic, features: generateMockPublic, starting-seed: 500, iterations: 500}
    defaults:
      run:
        shell: bash
    env:
      REPORT: ${{ github.workspace }}/graph-fuzzer/report.txt
      SUMMARY: ${{ github.workspace }}/graph-fuzzer/summary.md
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Download Test Bundle
        uses: ./.github/actions/download-artifact
        with:
          name: ${{ env.TEST_BUNDLE }}
      - name: Unpack Test Bundle
        run: |
          tar -xzf "$TEST_BUNDLE.tar.gz"
          mkdir -p graph-fuzzer "$RUNNER_TEMP/graph-fuzzer-profiles"
      # Only the fuzzer's own process writes to the profile folder: every
      # process it starts gets an LLVM_PROFILE_FILE of its own in the test's
      # temporary directory. A shard's fuzzer has taken up to 14.1 minutes over
      # five dispatches (run 43995669689, the seam corpus's seeds 250+250;
      # 13.95 in run 43945139805); the step's limit is twice that and under the
      # job's, so a shard that runs out of time still uploads what it has.
      - name: Run Graph Fuzzer
        timeout-minutes: 28
        env:
          SAFEDI_GRAPH_FUZZER_ITERATIONS: ${{ matrix.iterations }}
          SAFEDI_GRAPH_FUZZER_STARTING_SEED: ${{ matrix.starting-seed }}
          SAFEDI_GRAPH_FUZZER_FEATURES: ${{ matrix.features }}
          SAFEDI_GRAPH_FUZZER_REPORT: ${{ github.workspace }}/graph-fuzzer/report.txt
          LLVM_PROFILE_FILE: ${{ runner.temp }}/graph-fuzzer-profiles/graph-fuzzer-%p.profraw
        run: .build/x86_64-unknown-linux-gnu/release/SafeDIPackageTests.xctest --testing-library swift-testing --filter 'SafeDIToolGraphFuzzerTests/longRun'
      - name: Summarize
        if: ${{ !cancelled() }}
        run: .github/scripts/summarize-graph-fuzzer-report.sh "$REPORT" "$SUMMARY" ${{ matrix.starting-seed }} ${{ matrix.iterations }} "${{ matrix.features }}"
      - name: Merge Coverage Profile
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          profiles=("$RUNNER_TEMP"/graph-fuzzer-profiles/*.profraw)
          if [ ${#profiles[@]} -gt 0 ]; then
            llvm-profdata merge -sparse "${profiles[@]}" -o graph-fuzzer/coverage.profdata
          else
            echo "The fuzzer wrote no coverage profile."
          fi
      - name: Upload Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: graph-fuzzer-report-${{ matrix.corpus }}-${{ matrix.starting-seed }}
          path: graph-fuzzer/
          if-no-files-found: ignore
          # A re-run of the job replaces what an earlier attempt uploaded.
          overwrite: true

  # Advisory: it fails only when it cannot report. It names a shard that left
  # no profile or no report; EXPECTED_SHARDS names coverage-fuzz's matrix.
  coverage-report:
    name: Report Changed Lines No Fuzzer Graph Executed on Linux
    needs: [coverage-build, coverage-unit-suite, coverage-fuzz]
    if: ${{ !cancelled() && inputs.coverage && (needs.coverage-build.result == 'success' || inputs.bundle) }}
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # Every branch's history, so any base is present.
          fetch-depth: 0
      - name: Download Test Bundle
        uses: ./.github/actions/download-artifact
        with:
          name: ${{ env.TEST_BUNDLE }}
      - name: Download Unit Suite Profile
        uses: ./.github/actions/download-artifact
        with:
          name: unit-suite-profile
          path: unit-suite
      - name: Download Shard Reports
        uses: ./.github/actions/download-artifact
        with:
          pattern: graph-fuzzer-report-*
          path: reports
      # Retried for the reason "Install curl for Codecov" in ci.yml gives.
      - name: Install Python
        uses: ./.github/actions/retry
        with:
          command: command -v python3 >/dev/null || { apt-get update && apt-get install -y --no-install-recommends python3; }
      - name: Report
        env:
          BASE: ${{ inputs.base }}
          # coverage-fuzz's matrix, `<corpus>-<starting-seed>` per shard.
          EXPECTED_SHARDS: base-0 base-1250 base-2500 base-3750 generateDependencyTree-0 generateDependencyTree-125 generateDependencyTree-250 generateDependencyTree-375 generateDependencyTree-500 generateDependencyTree-625 generateDependencyTree-750 generateDependencyTree-875 generateDependencyTree-1000 generateDependencyTree-1125 generateDependencyTree-1250 generateDependencyTree-1375 generateDependencyTree-1500 generateDependencyTree-1625 generateDependencyTree-1750 generateDependencyTree-1875 generateMockPublic-0 generateMockPublic-500
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tar -xzf "$TEST_BUNDLE.tar.gz"
          if [ -z "$BASE" ]; then
            base=$(git merge-base origin/main HEAD)
          elif ! base=$(git rev-parse --verify --quiet "$BASE^{commit}" || git rev-parse --verify --quiet "origin/$BASE^{commit}"); then
            echo "::error::The base '$BASE' names no commit of this repository."
            exit 1
          fi
          .github/scripts/report-graph-fuzzer-coverage.sh \
            .build/x86_64-unknown-linux-gnu/release/SafeDIPackageTests.xctest reports unit-suite/default.profdata \
            "$base" "$RUNNER_TEMP/fuzzer-coverage" "$EXPECTED_SHARDS"
      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: fuzzer-coverage
          path: ${{ runner.temp }}/fuzzer-coverage/
          if-no-files-found: ignore
          retention-days: 3
          # A re-run of the job replaces what an earlier attempt uploaded.
          overwrite: true

  # ci.yml's "Check Graph Fuzzer Corpus on Linux", over the coverage shards'
  # reports: it fails when a corpus's shards do not add up to its pins and
  # names each count beside its pin, so a change's new pins can be read here
  # before its pull request's checks run. It only reads reports with Python,
  # so it needs no container.
  coverage-corpus:
    name: Check Graph Fuzzer Corpus for Coverage on Linux
    needs: [coverage-build, coverage-fuzz]
    if: ${{ !cancelled() && inputs.coverage && (needs.coverage-build.result == 'success' || inputs.bundle) }}
    runs-on: ubuntu-latest
    # The job took 8 and 14 seconds (runs 43774444496, 43774447047); the
    # limit only bounds a stuck download.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Download Shard Reports
        uses: ./.github/actions/download-artifact
        with:
          pattern: graph-fuzzer-report-*
          path: reports
      # `reports/report.txt` is where the one report lies when one shard alone
      # uploaded: a pattern that matches one artifact unpacks it into the path
      # itself. The script keeps the paths that exist, and names the shards
      # whose reports are absent.
      - name: Combine Shard Reports
        run: python3 .github/scripts/combine-graph-fuzzer-reports.py "$RUNNER_TEMP/graph-fuzzer-corpus.md" reports/*/report.txt reports/report.txt
      # Prints what the shards' reports say the pins should be, for a session
      # that cannot download this run's artifacts: the analysis's report, then
      # its pins.json as lines that
      # .claude/skills/apply-fuzzer-pins/apply-fuzzer-pins.py reads back from
      # a saved copy of this job's log. It runs when the step above fails,
      # which is when pins moved, and it never fails the job.
      - name: Print the Pins the Reports Derive
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/report-graph-fuzzer-pins.sh reports

  # With `release_acceptance`, release-acceptance.yml's jobs, in this run:
  # they build the older release and this commit and compare the two.
  release-acceptance:
    name: Release Acceptance
    if: ${{ inputs.release_acceptance }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-acceptance.yml

  # The jobs below run only with `targeted`: the targeted fuzzer of a switch,
  # which every change that moves generation onto a new path runs before it
  # is turned on. Two tools are compared over generated graphs: `on_commit`, the
  # commit with the switch on, and `off_commit`, the same code with it off; a graph
  # passes when both write the same bytes or both fail with the same errors
  # (.github/scripts/switch-attack/gate.sh, which draws its graphs with
  # gen2.py beside it). On runners rather than a contributor's machine
  # because 100,000 graphs are 200,000 pairs of tool runs, which thirty
  # runners finish while four cores are still at the first tenth.
  #
  # This job says which seeds each shard takes: the range split into
  # `targeted_shards` runs of whole seeds, the earlier ones one seed longer
  # when the range does not divide evenly.
  targeted-plan:
    name: Plan the Targeted Fuzzer's Shards
    if: ${{ inputs.targeted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Split the Seeds
        id: plan
        env:
          FIRST_SEED: ${{ inputs.first_seed }}
          LAST_SEED: ${{ inputs.last_seed }}
          SHARDS: ${{ inputs.targeted_shards }}
          ON: ${{ inputs.on_commit }}
          OFF: ${{ inputs.off_commit }}
        run: |
          for value in "$FIRST_SEED" "$LAST_SEED" "$SHARDS"; do
            case "$value" in ''|*[!0-9]*) echo "::error::first_seed, last_seed and targeted_shards are whole numbers; got '$value'."; exit 1 ;; esac
          done
          if [ -z "$ON" ] || [ -z "$OFF" ]; then echo "::error::targeted needs both on_commit and off_commit."; exit 1; fi
          seeds=$(( LAST_SEED - FIRST_SEED + 1 ))
          if [ "$seeds" -lt 1 ] || [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 40 ]; then
            echo "::error::last_seed is not before first_seed, and targeted_shards is 1 to 40 (the Linux runners one run may hold)."; exit 1
          fi
          if [ "$SHARDS" -gt "$seeds" ]; then SHARDS=$seeds; fi
          shards="["; first=$FIRST_SEED; index=0
          while [ "$index" -lt "$SHARDS" ]; do
            count=$(( seeds / SHARDS )); if [ "$index" -lt $(( seeds % SHARDS )) ]; then count=$(( count + 1 )); fi
            last=$(( first + count - 1 ))
            if [ "$index" -gt 0 ]; then shards="$shards,"; fi
            shards="$shards{\"index\":$index,\"first\":$first,\"last\":$last}"
            first=$(( last + 1 )); index=$(( index + 1 ))
          done
          echo "shards=$shards]" >> "$GITHUB_OUTPUT"
          echo "$seeds seeds in $SHARDS shards: $shards]"

  # Builds each of the two tools once, in release as the tool ships, linked
  # with the Swift runtime so the shards run it without a Swift container.
  # It builds a commit an input names, which the jobs above never do, so it
  # restores and saves no cache, takes the commit only from this repository,
  # and has no permission beyond reading it: nothing it runs can write a
  # branch's caches. The switch-attack scripts come from the commit the run
  # is dispatched on, never from the commits under test.
  targeted-build:
    name: Build the Targeted Fuzzer's SafeDITool on Linux (${{ matrix.side }})
    needs: targeted-plan
    runs-on: ubuntu-latest
    container: swift:6.2
    # Not yet measured here; ci.yml's "Build Release SafeDITool on Linux"
    # takes 17 to 18 minutes with one more build of every target.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        side: ['on', 'off']
    defaults:
      run:
        shell: bash
    env:
      COMMITISH: ${{ matrix.side == 'on' && inputs.on_commit || inputs.off_commit }}
    steps:
      - name: Checkout the Commit Under Test
        uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMITISH }}
      - name: Record the Commit
        run: |
          git config --global --add safe.directory "$PWD"
          git rev-parse HEAD | tee commit.txt
      # The patch comes from the commit the run is dispatched on, as the scripts do.
      - name: Checkout the Mock Layout Patch
        if: ${{ inputs.targeted_mocks && matrix.side == 'on' }}
        uses: actions/checkout@v7
        with:
          path: dispatch
          sparse-checkout: .github/scripts/switch-attack
      - name: Lay Mocks Out From Node Records
        if: ${{ inputs.targeted_mocks && matrix.side == 'on' }}
        run: |
          dispatch/.github/scripts/switch-attack/lay-out-mocks.sh .
          rm -rf dispatch
          echo "with lay-out-mocks.sh" >> commit.txt
      - name: Build SafeDITool
        run: swift build -c release --product SafeDITool --static-swift-stdlib
      - name: Package the Tool
        run: |
          mkdir tool
          cp .build/release/SafeDITool commit.txt tool/
          tool/SafeDITool --version
      - name: Upload the Tool
        uses: actions/upload-artifact@v7
        with:
          name: targeted-tool-${{ matrix.side }}
          path: tool/
          if-no-files-found: error
          retention-days: 3

  # One shard: its seeds, both declaration orders, through both tools, one
  # worker per core. No container: the tools carry their runtime and the
  # scripts need only bash and python3, which the runner image has.
  targeted-fuzz:
    name: Fuzz a Switch on Linux (seeds ${{ matrix.shard.first }}...${{ matrix.shard.last }})
    needs: [targeted-plan, targeted-build]
    runs-on: ubuntu-latest
    # Not yet measured; set to twice the slowest shard after the first runs.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.targeted-plan.outputs.shards) }}
    env:
      FIRST: ${{ matrix.shard.first }}
      LAST: ${{ matrix.shard.last }}
      GATE_MODE: ${{ inputs.targeted_mocks && 'mocks' || 'production' }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Download the Tools
        uses: ./.github/actions/download-artifact
        with:
          pattern: targeted-tool-*
          path: ${{ runner.temp }}/tools
      - name: Run the Targeted Fuzzer
        run: |
          chmod +x "$RUNNER_TEMP/tools/targeted-tool-on/SafeDITool" "$RUNNER_TEMP/tools/targeted-tool-off/SafeDITool"
          status=0
          .github/scripts/switch-attack/gate.sh "$RUNNER_TEMP/tools/targeted-tool-on/SafeDITool" "$RUNNER_TEMP/tools/targeted-tool-off/SafeDITool" \
            "$FIRST" "$LAST" "$(nproc)" "$RUNNER_TEMP/targeted" | tee "$RUNNER_TEMP/targeted-result.txt" || status=$?
          {
            echo "### Seeds $FIRST...$LAST"
            echo '```'
            cat "$RUNNER_TEMP/targeted-result.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/targeted-report"
          cp "$RUNNER_TEMP/targeted/all.log" "$RUNNER_TEMP/targeted-report/all.log"
          cp "$RUNNER_TEMP/targeted-result.txt" "$RUNNER_TEMP/targeted-report/result.txt"
          if [ -d "$RUNNER_TEMP/targeted/keep" ]; then cp -R "$RUNNER_TEMP/targeted/keep" "$RUNNER_TEMP/targeted-report/keep"; fi
          exit "$status"
      - name: Upload the Shard's Log and Differing Graphs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: targeted-report-${{ matrix.shard.index }}
          path: ${{ runner.temp }}/targeted-report/
          if-no-files-found: error

  # With `targeted_mocks`, the value oracles: the base and public mock
  # corpora's long runs over the patched on commit, so that every mock the
  # tests generate is laid out from node records and executed against
  # production's values (the base corpus's mock value oracle and mirror model,
  # the public mock corpus's value differential). A shard builds the commit's
  # tests itself, in its own container, restoring and saving no cache, as the
  # tool's build does; it reports the failures' headlines in its summary.
  targeted-values:
    name: Value Oracles With Mocks Laid Out on Linux (${{ matrix.corpus }} ${{ matrix.starting-seed }})
    needs: targeted-plan
    if: ${{ inputs.targeted && inputs.targeted_mocks }}
    runs-on: ubuntu-latest
    container: swift:6.2
    # Not yet measured: a debug test build (about 25 minutes on a hosted
    # runner) and a quarter of the base corpus (5 to 8 minutes in ci.yml's
    # shards) or half the public mock corpus (about 10).
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { corpus: base, features: "", starting-seed: 0, iterations: 1250 }
          - { corpus: base, features: "", starting-seed: 1250, iterations: 1250 }
          - { corpus: base, features: "", starting-seed: 2500, iterations: 1250 }
          - { corpus: base, features: "", starting-seed: 3750, iterations: 1250 }
          - { corpus: generateMockPublic, features: generateMockPublic, starting-seed: 0, iterations: 500 }
          - { corpus: generateMockPublic, features: generateMockPublic, starting-seed: 500, iterations: 500 }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the Commit Under Test
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.on_commit }}
      - name: Checkout the Mock Layout Patch
        uses: actions/checkout@v7
        with:
          path: dispatch
          sparse-checkout: .github/scripts/switch-attack
      - name: Lay Mocks Out From Node Records
        run: |
          git config --global --add safe.directory "$PWD"
          dispatch/.github/scripts/switch-attack/lay-out-mocks.sh .
          rm -rf dispatch
          git rev-parse HEAD
      - name: Build the Tests
        run: swift build --traits sourceBuild --build-tests
      - name: Run the Corpus
        env:
          SAFEDI_GRAPH_FUZZER_FEATURES: ${{ matrix.features }}
          SAFEDI_GRAPH_FUZZER_STARTING_SEED: ${{ matrix.starting-seed }}
          SAFEDI_GRAPH_FUZZER_ITERATIONS: ${{ matrix.iterations }}
        run: |
          mkdir -p "$RUNNER_TEMP/swifttmp"
          status=0
          TMPDIR="$RUNNER_TEMP/swifttmp" swift test --skip-build --traits sourceBuild --filter 'SafeDIToolGraphFuzzerTests/longRun' > "$RUNNER_TEMP/long-run.txt" 2>&1 || status=$?
          {
            echo "### ${{ matrix.corpus }} seeds ${{ matrix.starting-seed }} + ${{ matrix.iterations }}, mocks laid out from node records"
            echo '```'
            # A seed's line follows the line that records its issue: a known issue's says "recorded a known issue", so
            # only the others are failures the run did not expect, which are listed apart from the known ones.
            awk '/^↳ Graph fuzzer seed/ { kind = (previous ~ /recorded a known issue/) ? "known" : "NEW" } /^↳ Graph fuzzer seed/ { line = $0; sub(/^↳ Graph fuzzer seed /, "", line); seed = line; sub(/:.*/, "", seed); sub(/^[0-9]*: /, "", line); key = kind " " line; seeds[key] = seeds[key] " " seed; count[key]++ } { previous = $0 } END { for (k in count) printf "%4d %s:%s\n", count[k], k, seeds[k] }' "$RUNNER_TEMP/long-run.txt" | sort -k2,2r -k1,1rn
            grep -c 'no longer fails' "$RUNNER_TEMP/long-run.txt" | sed 's/^/stale known issues: /'
            tail -3 "$RUNNER_TEMP/long-run.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload the Long Run's Output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: targeted-values-${{ matrix.corpus }}-${{ matrix.starting-seed }}
          path: ${{ runner.temp }}/long-run.txt
          retention-days: 7

  # Adds the shards up: the run passes only when every shard ran every one
  # of its graphs and no graph differed.
  targeted-report:
    name: Report the Targeted Fuzzer's Result
    needs: [targeted-plan, targeted-build, targeted-fuzz]
    if: ${{ always() && inputs.targeted }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FIRST_SEED: ${{ inputs.first_seed }}
      LAST_SEED: ${{ inputs.last_seed }}
      FUZZ_RESULT: ${{ needs.targeted-fuzz.result }}
      TARGETED_MOCKS: ${{ inputs.targeted_mocks }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Download the Shards' Reports
        uses: ./.github/actions/download-artifact
        with:
          pattern: targeted-report-*
          path: ${{ runner.temp }}/reports
      - name: Download the Tools' Commits
        uses: ./.github/actions/download-artifact
        with:
          pattern: targeted-tool-*
          path: ${{ runner.temp }}/tools
      - name: Add the Shards Up
        run: |
          cat "$RUNNER_TEMP"/reports/*/all.log > "$RUNNER_TEMP/all.log"
          count() { grep -c " $1 " "$RUNNER_TEMP/all.log" || true; }
          graphs=$(wc -l < "$RUNNER_TEMP/all.log" | tr -d ' ')
          expected=$(( (LAST_SEED - FIRST_SEED + 1) * 2 ))
          different=$(( $(count DIFF) + $(count EXITDIFF) + $(count ERRDIFF) ))
          {
            echo "## Targeted fuzzer"
            echo "on: $(cat "$RUNNER_TEMP/tools/targeted-tool-on/commit.txt"), off: $(cat "$RUNNER_TEMP/tools/targeted-tool-off/commit.txt")"
            echo
            echo "$graphs of $expected graphs ran (seeds $FIRST_SEED...$LAST_SEED, two declaration orders)."
            echo
            echo "| Result | Graphs |"
            echo "|---|---|"
            for result in SAME APPROVED ERRSAME DIFF EXITDIFF ERRDIFF; do echo "| $result | $(count "$result") |"; done
            echo
            if [ "$(count APPROVED)" -gt 0 ]; then
              echo "Approved mock differences by number (approved-byte-differences.md): sites, and graphs that show it:"
              echo '```'
              grep -o ' [1-6]=[0-9]*' "$RUNNER_TEMP/all.log" | awk -F= '{ sum[$1] += $2; graphs[$1]++ } END { for (k in sum) printf "%s: %d sites in %d graphs\n", k, sum[k], graphs[k] }' | sort
              echo '```'
            fi
            echo "Accepted graphs by what kept a root off the switch's path (\`[none;]\` is every root on it):"
            echo '```'
            grep " SAME " "$RUNNER_TEMP/all.log" | sed 's/^[^[]*//' | sort | uniq -c | sort -rn
            echo '```'
            if [ "$different" -gt 0 ]; then
              echo "Differing graphs, kept in the shards' artifacts under keep/:"
              echo '```'
              grep -E " (DIFF|EXITDIFF|ERRDIFF) " "$RUNNER_TEMP/all.log" | head -100
              echo '```'
              echo "By reason:"
              echo '```'
              grep -E " (DIFF|EXITDIFF|ERRDIFF) " "$RUNNER_TEMP/all.log" | awk '{ print $2 }' | sort | uniq -c
              grep ' DIFF ' "$RUNNER_TEMP/all.log" | sed 's/.*\] //' | cut -d' ' -f1-2 | sort | uniq -c | sort -rn | head -30
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$graphs" != "$expected" ]; then echo "::error::$graphs of $expected graphs ran."; exit 1; fi
          if [ "$different" -gt 0 ]; then echo "::error::$different graphs differ between the two tools."; exit 1; fi
          if [ "$TARGETED_MOCKS" = "true" ] && [ "$(count APPROVED)" = 0 ]; then echo "::error::No graph's mocks were laid out from node records: the patch did not take."; exit 1; fi
          if [ "$FUZZ_RESULT" != "success" ]; then echo "::error::A shard did not pass ($FUZZ_RESULT)."; exit 1; fi
          echo "Clean: $graphs graphs, none differing."

  # Deletes the branch this run was dispatched on when it is a scratch ref:
  # one a tool pushed only to run this workflow on a commit, named
  # `verify/…`, `probe/…` or `coverage/…`. A tool that is killed never
  # deletes its ref, so the run does, and the tool's own delete is the
  # fallback for a run that never reaches this job. It needs every other job,
  # so it runs last, and `always()` has it run after a failure or a cancel.
  # A job added to this workflow goes into its `needs:` too, or the ref could
  # go while that job still has to check it out.
  #
  # It leaves the ref while another run on it has not finished. That run
  # deletes it when it ends if it is a run of verify.yml or graph-fuzzer.yml;
  # if it is another workflow's, or if two runs end within seconds and each
  # sees the other unfinished, the ref stays for the tool's own delete. The
  # delete is a push that names this run's commit as the value the ref must
  # still have, which GitHub checks as it deletes, so a ref a later push
  # moved is left, and one deleted during the run is found already gone.
  # GitHub starts no re-run of a run whose ref is gone. A run dispatched on
  # the ref just before this job lists the ref's runs can be missing from
  # the list and lose its ref; the tools push a new ref for each run they
  # dispatch, so that race is accepted. The ref's
  # name reaches the API as a request field and git as an argument, never
  # inside a URL. A failure to list the runs or to delete only warns, and
  # the step's `continue-on-error` keeps its timeout from failing the job, so
  # the delete never fails a run that passed nor puts a failed check on its
  # commit. The job's own keeps the run green on a failure outside the step,
  # such as a lost runner, though that job's check then shows the failure.
  #
  # It checks nothing out and runs no code of the ref's but this step, and is
  # the workflow's only job that can write: `contents: write` to delete the
  # ref, `actions: read` to list the ref's runs. It calls only GitHub's API
  # and git, so it needs no container.
  #
  # Probed by dispatches no tool deleted after: a Verify run with a filter
  # (44026679738) and one with `pins` (44030204927), after the jobs it calls,
  # deleted their refs. A Verify run that ended while a Graph Fuzzer run on
  # its ref had not (44028823431) logged that it left the ref, and the Graph
  # Fuzzer run deleted it when it ended (44026683066). A ref named
  # `probe/lane-delete&status=completed` was left while another run on it was
  # unfinished (44032859335) and then deleted (44032847773); a ref pushed
  # elsewhere during the run was left (44033034599), and one deleted while
  # its run was in progress was found already gone (44037696301). A run
  # cancelled while it built deleted its ref (44036973726), and a re-run of
  # it after that failed to start (its second attempt). On probe commits that
  # changed only the credentials or the step's length, a token the API
  # refuses (44031256021) and git credentials GitHub refuses (44031416560)
  # each warned and passed, and a step stopped by its limit left this job
  # and its check green (44036369586, and its re-run with the ref pushed
  # again).
  # verify.yml has the same job; keep the two steps the same.
  delete-scratch-ref:
    name: Delete This Run's Scratch Ref
    needs:
      - fuzz
      - coverage-build
      - coverage-unit-suite
      - coverage-fuzz
      - coverage-report
      - coverage-corpus
      - release-acceptance
      - targeted-report
    if: ${{ always() && github.event_name == 'workflow_dispatch' && !inputs.bundle && github.ref_type == 'branch' && (startsWith(github.ref_name, 'verify/') || startsWith(github.ref_name, 'probe/') || startsWith(github.ref_name, 'coverage/')) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      actions: read
    steps:
      - name: Delete the Ref
        # 0 to 4 s in the probe runs above, deleting, leaving or finding the
        # ref already gone. One minute is the least the limit can be set to
        # in whole minutes; a step it stops leaves the ref for the tool and,
        # by `continue-on-error`, fails neither the job nor the run.
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          case "$REF_NAME" in
            verify/*|probe/*|coverage/*) ;;
            *) echo "$REF_NAME is not a scratch ref. Left."; exit 0 ;;
          esac
          left_for_the_tool() {
            # One line, since a warning annotation ends at the first line
            # break, and the API's error bodies end their lines in \r\n.
            echo "::warning::$REF_NAME is left for the tool that pushed it to delete: $(printf '%s' "$1" | tr '\r\n' '  ')"
            exit 0
          }
          if ! unfinished=$(gh api -X GET "repos/$REPOSITORY/actions/runs" -f branch="$REF_NAME" -F per_page=100 --jq "[.workflow_runs[] | select(.id != $RUN_ID and .status != \"completed\") | .id | tostring] | join(\" \")" 2>&1); then
            left_for_the_tool "listing its runs failed: $unfinished"
          fi
          if [ -n "$unfinished" ]; then
            echo "$REF_NAME is left: run(s) $unfinished on it have not finished."
            exit 0
          fi
          remote="https://github.com/$REPOSITORY.git"
          authorization="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          repository="$RUNNER_TEMP/delete-scratch-ref"
          git init -q "$repository"
          # Refused unless the ref still points at this run's commit.
          if pushed=$(git -C "$repository" -c http.extraHeader="$authorization" push --force-with-lease="refs/heads/$REF_NAME:$COMMIT" "$remote" ":refs/heads/$REF_NAME" 2>&1); then
            echo "Deleted $REF_NAME."
            exit 0
          fi
          if ! listed=$(git -C "$repository" -c http.extraHeader="$authorization" ls-remote "$remote" "refs/heads/$REF_NAME" 2>&1); then
            left_for_the_tool "the delete failed ($pushed), and so did reading the ref ($listed)"
          fi
          now=$(printf '%s\n' "$listed" | awk -v ref="refs/heads/$REF_NAME" '$2 == ref { print $1 }')
          if [ -z "$now" ]; then
            echo "$REF_NAME is already gone."
          elif [ "$now" != "$COMMIT" ]; then
            echo "$REF_NAME is left: it now points at $now, not this run's $COMMIT."
          else
            left_for_the_tool "the delete failed: $pushed"
          fi
