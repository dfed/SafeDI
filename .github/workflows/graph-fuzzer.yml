name: Graph Fuzzer

# Runs SafeDI's random dependency-graph fuzzer by hand, from any starting
# seed and for any number of graphs, to explore graphs beyond the fixed
# corpus that ci.yml fuzzes on every pull request and push to main. Its
# default, `iterations: scheduled`, is that corpus: seeds
# 0..<scheduledSeedCount (see SafeDIToolGraphFuzzerTests.swift). A failure,
# a stale known issue, a problem with the run itself, a crash, or a run that
# checks no graphs fails the job and names the seeds in the job summary.
on:
  workflow_dispatch:
    inputs:
      starting_seed:
        description: The first seed to run.
        required: false
        default: '0'
      iterations:
        description: The number of graphs to run, or `scheduled` for scheduledSeedCount graphs.
        required: false
        default: 'scheduled'

permissions: {}

jobs:
  fuzz:
    # Nothing here needs macOS: it runs the tool and compiles its output with
    # `swiftc -emit-object`, so it uses the Linux test job's container.
    name: Fuzz Dependency Graphs on Linux
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      ITERATIONS: ${{ inputs.iterations || 'scheduled' }}
      STARTING_SEED: ${{ inputs.starting_seed || '0' }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: swift package resolve
      - name: Name Report Files
        run: |
          mkdir -p "$RUNNER_TEMP/graph-fuzzer"
          echo "REPORT=$RUNNER_TEMP/graph-fuzzer/report.txt" >> "$GITHUB_ENV"
          echo "SUMMARY=$RUNNER_TEMP/graph-fuzzer/summary.md" >> "$GITHUB_ENV"
      # Release, as the Linux test job builds, so the tool's thousands of runs are fast.
      - name: Build
        run: swift build -c release -Xswiftc -enable-testing --traits sourceBuild --build-tests
      - name: Run Graph Fuzzer
        run: |
          SAFEDI_GRAPH_FUZZER_ITERATIONS="$ITERATIONS" \
          SAFEDI_GRAPH_FUZZER_STARTING_SEED="$STARTING_SEED" \
          SAFEDI_GRAPH_FUZZER_REPORT="$REPORT" \
            swift test -c release -Xswiftc -enable-testing --traits sourceBuild --skip-build --filter 'SafeDIToolGraphFuzzerTests/longRun'
      - name: Summarize
        if: ${{ !cancelled() }}
        # Fails when a graph failed, a known issue went stale, the run reported
        # a problem with itself, the long run checked no graphs (it was skipped,
        # renamed, or never built), or the process crashed, so the fuzzer
        # cannot go quiet without the job turning red.
        run: |
          reproduce() {
            echo "SAFEDI_GRAPH_FUZZER_STARTING_SEED=$1 SAFEDI_GRAPH_FUZZER_ITERATIONS=1 swift test --traits sourceBuild --filter SafeDIToolGraphFuzzerTests/longRun"
          }
          touch "$REPORT"
          graph_count=$(grep -c '^seed ' "$REPORT" || true)
          graph_count=${graph_count:-0}
          has_problems=false
          if grep -q '^problem ' "$REPORT"; then
            has_problems=true
          fi
          {
            echo "### Graph fuzzer"
            echo
            echo "Started $graph_count graphs ($ITERATIONS requested) from seed $STARTING_SEED on $(git -c safe.directory="$PWD" rev-parse HEAD)."
            echo
            # Under `bash -e -o pipefail`, a grep that finds nothing must not end the script.
            { grep '^problem ' "$REPORT" || true; } | sed 's/^problem /- **Problem:** /'
            if [ "$graph_count" -eq 0 ] && [ "$has_problems" = false ]; then
              echo "**It ran zero graphs.** If the build succeeded, check that \`longRun_findsNoUnknownFailures_whenEnabledByEnvironment\` still exists and reads \`SAFEDI_GRAPH_FUZZER_ITERATIONS\`."
            elif ! grep -q '^completed ' "$REPORT" && [ "$has_problems" = false ]; then
              crashed_seed=$(grep '^seed ' "$REPORT" | tail -n 1 | cut -d ' ' -f 2)
              echo "**The test process stopped while SafeDITool ran seed $crashed_seed**, which suggests the tool crashed. Reproduce with \`$(reproduce "$crashed_seed")\`"
            elif grep -q '^completed ' "$REPORT"; then
              echo "Completed $(grep '^completed ' "$REPORT" | sed 's/^completed //')."
            fi
            echo
            { grep -E '^(failure|stale) ' "$REPORT" || true; } | while read -r kind seed reason; do
              if [ "$kind" = failure ]; then
                echo "- **Seed $seed**: $reason. Reproduce with \`$(reproduce "$seed")\`"
              else
                echo "- **Seed $seed** is a known issue ($reason) that no longer fails. Remove it from \`knownIssues\`. Reproduce with \`$(reproduce "$seed")\`"
              fi
            done
            echo
            echo "The test log holds each failing graph's fixture and compiler output. Every failure becomes a hand-written regression test before its fix; see \"Graph fuzzer\" in CLAUDE.md."
          } > "$SUMMARY"
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          if [ "$graph_count" -eq 0 ] || ! grep -q '^completed ' "$REPORT" || grep -qE '^(failure|stale|problem) ' "$REPORT"; then
            exit 1
          fi
      - name: Upload Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: graph-fuzzer-report
          path: ${{ runner.temp }}/graph-fuzzer/
          if-no-files-found: ignore
