name: Spike Seam Nested

# Runs the hand-written seam builder spike under Spikes/seam-nested, and the design probes under
# Spikes/seam-nested-design, on Swift 6.2. It lives on this branch only.
on:
  push:
    branches: [dfed--claude/spike-nested-seam-builders]

jobs:
  spike:
    name: Seam Builder Spike on Linux
    runs-on: ubuntu-latest
    container: swift:6.2
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Run Spike
        run: |
          {
            echo '```'
            bash Spikes/seam-nested/run.sh
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run Design Probes
        if: ${{ !cancelled() }}
        # bash for pipefail: run.sh exits nonzero when a required probe fails, and that status must outlive the pipe to tee.
        shell: bash
        run: |
          {
            echo '## Design probes'
            echo
            echo '```'
            status=0
            bash Spikes/seam-nested-design/run.sh || status=$?
            echo '```'
            exit "$status"
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
