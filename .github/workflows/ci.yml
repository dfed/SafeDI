name: CI

on:
  push:
    branches:
    - main
  schedule:
    # Runs at 00:00 UTC every Monday to ensure that CI does not bitrot.
    - cron: '0 0 * * 1'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# DO NOT MERGE: a throwaway that times the graph fuzzer with a cold cache and four shards.
jobs:
  changes:
    name: Detect Changed Files
    # Every build and test job below depends on this one and skips
    # itself when the push or pull request touched only Markdown. A
    # job skipped by its `if:` reports "Success", so required status
    # checks are satisfied without allocating a runner. Anything that
    # isn't Markdown (sources, workflows, lockfiles, project files)
    # counts as a source change. DocC articles are Markdown but feed
    # the DocC build, so they're tracked separately. The link checker
    # always runs: Markdown is its input, and the two coverage jobs run
    # on every push to main so the README badge's report is never an
    # empty one. When in doubt (a scheduled run, or a diff that can't
    # be computed) the answer is "everything changed", and the gates
    # below treat a missing answer the same way.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source: ${{ steps.classify.outputs.source }}
      docc: ${{ steps.classify.outputs.docc }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # Full history so both ends of the diff are present.
          fetch-depth: 0
      - name: Classify Changed Files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          source=false
          docc=false
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "push" ]; then
            echo "Event '$EVENT_NAME' has no diff to classify; treating everything as changed."
            source=true
            docc=true
          elif ! changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "Could not diff $BASE_SHA...$HEAD_SHA; treating everything as changed."
            source=true
            docc=true
          else
            echo "Changed files:"
            echo "$changed"
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                *.docc/*) docc=true ;;
              esac
              case "$file" in
                *.md) ;;
                *) source=true ;;
              esac
            done <<< "$changed"
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "docc=$docc" >> "$GITHUB_OUTPUT"
          echo "source=$source docc=$docc"

  linux:
    name: Build and Test on Linux
    needs: changes
    # Also runs on every push to main, Markdown-only or not, so the
    # Codecov report behind the README badge always comes from a real
    # test run.
    if: ${{ !cancelled() && (needs.changes.outputs.source != 'false' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    container: swift:6.2
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      # Same idea as the macOS test job: reuse dependency build products
      # between runs. Keyed on the container's Swift version.
      - name: Cache Build Directory
        uses: actions/cache@v6
        with:
          path: .build
          key: graph-fuzzer-timing-cold-${{ github.run_id }}
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: swift package resolve
      - name: Build and Test Framework
        run: swift test -c release --enable-code-coverage -Xswiftc -enable-testing --traits sourceBuild
      # The graph fuzzer's shards run this job's test bundle rather than
      # building their own: the bundle, SafeDITool and the macro plugin (which
      # the fuzzer's compiler runs use), and SafeDI's module.
      - name: Package Test Bundle for the Graph Fuzzer
        run: |
          products=.build/x86_64-unknown-linux-gnu/release
          tar -czf graph-fuzzer-test-bundle.tar.gz \
            "$products/SafeDIPackageTests.xctest" \
            "$products/SafeDITool" \
            "$products/SafeDIMacros-tool" \
            "$products/Modules/SafeDI.swiftmodule"
      - name: Upload Test Bundle for the Graph Fuzzer
        uses: actions/upload-artifact@v7
        with:
          name: graph-fuzzer-test-bundle
          path: graph-fuzzer-test-bundle.tar.gz
          retention-days: 1

  graph-fuzzer:
    name: Fuzz Dependency Graphs on Linux (seeds ${{ matrix.starting-seed }}+${{ matrix.iterations }})
    needs: [changes, linux]
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - starting-seed: 0
            iterations: 1250
          - starting-seed: 1250
            iterations: 1250
          - starting-seed: 2500
            iterations: 1250
          - starting-seed: 3750
            iterations: 1250
    defaults:
      run:
        shell: bash
    env:
      REPORT: ${{ github.workspace }}/graph-fuzzer/report.txt
      SUMMARY: ${{ github.workspace }}/graph-fuzzer/summary.md
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Download Test Bundle
        uses: actions/download-artifact@v8
        with:
          name: graph-fuzzer-test-bundle
      - name: Unpack Test Bundle
        run: |
          tar -xzf graph-fuzzer-test-bundle.tar.gz
          mkdir -p graph-fuzzer
      - name: Run Graph Fuzzer
        env:
          SAFEDI_GRAPH_FUZZER_ITERATIONS: ${{ matrix.iterations }}
          SAFEDI_GRAPH_FUZZER_STARTING_SEED: ${{ matrix.starting-seed }}
          SAFEDI_GRAPH_FUZZER_REPORT: ${{ github.workspace }}/graph-fuzzer/report.txt
          # The bundle is built for coverage; keep its profiles out of the way.
          LLVM_PROFILE_FILE: ${{ runner.temp }}/graph-fuzzer-%p.profraw
        run: .build/x86_64-unknown-linux-gnu/release/SafeDIPackageTests.xctest --testing-library swift-testing --filter 'SafeDIToolGraphFuzzerTests/longRun'
      - name: Summarize
        if: ${{ !cancelled() }}
        run: .github/scripts/summarize-graph-fuzzer-report.sh "$REPORT" "$SUMMARY" ${{ matrix.starting-seed }} ${{ matrix.iterations }}
      - name: Upload Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: graph-fuzzer-report-${{ matrix.starting-seed }}
          path: graph-fuzzer/
          if-no-files-found: ignore

  # Checks the pins over the whole corpus, which no one shard sees: that the
  # shards covered it exactly once, and that together they accepted exactly
  # the pinned set of seeds. This is the one check to require for the fuzzer.
  graph-fuzzer-corpus:
    name: Check Graph Fuzzer Corpus on Linux
    needs: [changes, graph-fuzzer]
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Download Shard Reports
        uses: actions/download-artifact@v8
        with:
          pattern: graph-fuzzer-report-*
          path: reports
      - name: Combine Shard Reports
        run: python3 .github/scripts/combine-graph-fuzzer-reports.py "$RUNNER_TEMP/graph-fuzzer-corpus.md" reports/*/report.txt

