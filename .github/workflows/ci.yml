name: CI

on:
  push:
    branches:
    - main
  schedule:
    # Runs at 00:00 UTC every Monday to ensure that CI does not bitrot.
    - cron: '0 0 * * 1'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Files
    # Every build and test job below depends on this one and skips
    # itself when the push or pull request touched only Markdown. A
    # job skipped by its `if:` reports "Success", so required status
    # checks are satisfied without allocating a runner. Anything that
    # isn't Markdown (sources, workflows, lockfiles, project files)
    # counts as a source change. DocC articles are Markdown but feed
    # the DocC build, so they're tracked separately. The link checker
    # always runs: Markdown is its input, and the two coverage jobs run
    # on every push to main so the README badge's report is never an
    # empty one. When in doubt (a scheduled run, or a diff that can't
    # be computed) the answer is "everything changed", and the gates
    # below treat a missing answer the same way.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source: ${{ steps.classify.outputs.source }}
      docc: ${{ steps.classify.outputs.docc }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # Full history so both ends of the diff are present.
          fetch-depth: 0
      - name: Classify Changed Files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          source=false
          docc=false
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "push" ]; then
            echo "Event '$EVENT_NAME' has no diff to classify; treating everything as changed."
            source=true
            docc=true
          elif ! changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "Could not diff $BASE_SHA...$HEAD_SHA; treating everything as changed."
            source=true
            docc=true
          else
            echo "Changed files:"
            echo "$changed"
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                *.docc/*) docc=true ;;
              esac
              case "$file" in
                *.md) ;;
                *) source=true ;;
              esac
            done <<< "$changed"
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "docc=$docc" >> "$GITHUB_OUTPUT"
          echo "source=$source docc=$docc"

  update-version-check:
    name: Update Version Script Check
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    # The script uses portable `sed -i.bak`, so this needn't take one of
    # the five concurrent macOS slots. The publish workflow still runs
    # it on macOS.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Run update-version script
        run: ./Scripts/update-version.sh 99.99.99-test abc123testchecksum456
      - name: Verify URL was updated
        run: grep -q 'releases/download/99.99.99-test/SafeDITool.artifactbundle.zip' Package.swift
      - name: Verify checksum was updated
        run: grep -q 'checksum:.*abc123testchecksum456' Package.swift
      - name: Verify Plugins/Shared.swift safeDIVersion was updated
        # Match the literal within 3 lines after the `safeDIVersion`
        # getter declaration so a future test-string in an unrelated
        # spot can't satisfy a bare file-wide grep. Block scalar because
        # an unquoted inline `{` trips the YAML parser.
        run: |
          grep -A 2 'var safeDIVersion: String {' Plugins/Shared.swift | grep -q '"99.99.99-test"'
      - name: Verify MODULE.bazel version was updated
        # Scope to the top-level module() block so bazel_dep lines that
        # also carry `version = "X"` can't false-positive.
        run: |
          awk '/^module\(/,/^\)/' MODULE.bazel | grep -q 'version = "99.99.99-test"'

  xcodebuild:
    # The job name spells out the matrix value so the check names stay
    # exactly as branch protection lists them.
    name: Build with xcodebuild on Xcode 26 (${{ matrix.platforms }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    runs-on: macos-26
    strategy:
      matrix:
        # Why the non-macOS destinations build with Xcode 26.2 while
        # everything else in this workflow stays on the 26.0 floor:
        # GitHub's macos-26 image ships the simulator runtimes for
        # Xcode 26.2 and newer, dyld caches prebuilt, but not 26.0's.
        # With 26.0 each of these jobs had to download an 8 GB runtime
        # and then build its dyld shared cache in the background, which
        # slowed every xcodebuild action on the runner 2-5x for several
        # minutes (resolve took ~175 s against ~10 s on the macOS job).
        # The 26.0 floor is still exercised by the macOS destination
        # here, by the test job, and by the example jobs; what moves
        # to 26.2 is compiling SafeDI's library sources against the
        # iOS, tvOS, watchOS, and visionOS SDKs. If the image stops
        # shipping a runtime, "Ensure Platform Is Installed" downloads
        # it: slower, not broken.
        include:
          - platforms: platform=macOS
            xcode: /Applications/Xcode_26.0.app
          - platforms: generic/platform=ios
            xcode: /Applications/Xcode_26.2.app
            runtime: iOS
            sdk: iphonesimulator
          - platforms: generic/platform=tvos
            xcode: /Applications/Xcode_26.2.app
            runtime: tvOS
            sdk: appletvsimulator
          - platforms: generic/platform=watchos
            xcode: /Applications/Xcode_26.2.app
            runtime: watchOS
            sdk: watchsimulator
          - platforms: generic/platform=visionos
            xcode: /Applications/Xcode_26.2.app
            runtime: visionOS
            sdk: xrsimulator
      fail-fast: false
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Select Xcode Version
        run: sudo xcode-select --switch ${{ matrix.xcode }}/Contents/Developer
      # xcodebuild otherwise clones every package dependency from
      # scratch on each run (swift-syntax is the large one). Keeping the
      # clones in a fixed directory lets actions/cache restore them. The
      # clones are plain git checkouts, so the key needn't name the
      # Xcode version.
      - name: Cache Cloned Source Packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/xcode-packages
          key: xcode-packages-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
      # Resolving needs no platform, so it comes before any download
      # the next step might have to do, while the runner is quiet.
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: xcrun xcodebuild -resolvePackageDependencies -skipPackagePluginValidation -skipMacroValidation -scheme SafeDI-Package -clonedSourcePackagesDirPath "$RUNNER_TEMP/xcode-packages"
      # Normally a no-op: the selected Xcode's SDK version has a matching
      # runtime on the image. The download is the fallback, with a
      # deadline and one retry because a download that sits in
      # "Preparing to download" has held a runner for an hour. The
      # image has already run `-runFirstLaunch` for every Xcode, so it
      # is only repeated when Xcode reports work pending. `ps` rather
      # than `kill -0` for liveness: the child runs as root under sudo,
      # so `kill -0` from the runner user would report EPERM instead of
      # "alive".
      - name: Ensure Platform Is Installed
        if: ${{ matrix.runtime }}
        env:
          RUNTIME: ${{ matrix.runtime }}
          SDK: ${{ matrix.sdk }}
          DEADLINE_SECONDS: '900'
        run: |
          version=$(xcrun --sdk "$SDK" --show-sdk-version)
          if xcrun simctl list runtimes | grep -q "^$RUNTIME $version "; then
            echo "$RUNTIME $version runtime is installed on this image."
            exit 0
          fi
          echo "::warning::$RUNTIME $version runtime is not on this image; downloading it. The job still passes, just more slowly."
          if ! xcrun xcodebuild -checkFirstLaunchStatus > /dev/null 2>&1; then
            sudo xcodebuild -runFirstLaunch
          fi
          download() {
            sudo xcodebuild -downloadPlatform "$RUNTIME" &
            local pid=$!
            local waited=0
            while ps -p "$pid" > /dev/null 2>&1; do
              if [ "$waited" -ge "$DEADLINE_SECONDS" ]; then
                echo "::warning::$RUNTIME download exceeded ${DEADLINE_SECONDS}s; stopping it"
                sudo kill "$pid" 2> /dev/null || true
                wait "$pid" 2> /dev/null || true
                return 1
              fi
              sleep 15
              waited=$((waited + 15))
            done
            wait "$pid"
          }
          download || download
      - name: Build Framework
        run: xcrun xcodebuild -skipMacroValidation -skipPackagePluginValidation build -scheme SafeDI-Package -destination ${{ matrix.platforms }} -clonedSourcePackagesDirPath "$RUNNER_TEMP/xcode-packages"

  docc:
    name: Build DocC on Xcode 26
    needs: changes
    # DocC articles under `*.docc/` are Markdown, so this job also runs
    # when only those changed.
    if: ${{ !cancelled() && (needs.changes.outputs.source != 'false' || needs.changes.outputs.docc == 'true') }}
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Select Xcode Version
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
      # `swift-docc-plugin`'s `--warnings-as-errors` scopes to a single
      # target, so swift-syntax's internal DocC noise stays out of our
      # strict build. That scoping isn't available via `xcodebuild
      # docbuild`, which analyzes the whole target graph.
      # `generate-documentation` builds the target in debug; reuse the
      # dependency build products between runs.
      - name: Cache Build Directory
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-xcode-26.0-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-debug-${{ runner.os }}-xcode-26.0-
      - name: Build DocC
        uses: ./.github/actions/retry
        with:
          command: swift package generate-documentation --target SafeDI --warnings-as-errors

  # Example jobs that declare package traits in their .xcodeproj
  # (`traits = (…)`) need Xcode 26.4 — the first Xcode that
  # surfaces traits in the project file. Other examples run on the
  # same baseline as the SafeDI-core jobs above.

  spm-package-integration:
    name: Build Package Integration on Xcode 26
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Select Xcode Version
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: xcrun swift package resolve --package-path "Examples/Example Package Integration"
      # `EventLogger.swift` in RootModule declares a different `@Instantiable`
      # under `#if DEBUG` and `#else`. If the plugin did not report `DEBUG`,
      # SafeDI would wire `DisabledEventLogger` and the generated compile-time
      # assertion would fail this build; the grep makes the check explicit.
      - name: Build Package Integration (swift build)
        run: |
          xcrun swift build --package-path "Examples/Example Package Integration"
          grep -q "ConsoleEventLogger()" "$(find "Examples/Example Package Integration/.build/plugins/outputs" -path "*/RootModule/*/SafeDIOutput/Root+SafeDI.swift")"
      # Also build via xcodebuild — it exercises the plugin's in-process
      # PluginScanner fallback, which `swift build` doesn't. A bug in that
      # path would make Xcode IDE builds fail while the swift build above
      # still passes.
      - name: Build Package Integration (xcodebuild)
        run: pushd "Examples/Example Package Integration"; xcrun xcodebuild build -skipPackagePluginValidation -skipMacroValidation -scheme ExamplePackageIntegration -destination "platform=macOS"; popd
      # Release-configuration builds prove the plugin stops reporting `DEBUG`
      # when the configuration does not define it: the generated file must
      # wire `DisabledEventLogger`. Optimization is turned off because only
      # the configuration matters here, and an optimized build of swift-syntax
      # takes several times longer.
      - name: Build Package Integration in release configuration (swift build)
        run: |
          xcrun swift build -c release -Xswiftc -Onone --package-path "Examples/Example Package Integration"
          grep -q "DisabledEventLogger()" "$(find "Examples/Example Package Integration/.build/plugins/outputs" -path "*/RootModule/*/SafeDIOutput/Root+SafeDI.swift")"
      # Xcode evaluates a package's `.when(configuration:)` defines as for a
      # debug build whatever configuration it compiles, so it hands the plugin
      # `DEBUG` in Release too and SafeDI scans the debug clause. The generated
      # assertion must then stop the Release build. This step fails if the
      # build succeeds (Xcode started reporting configuration-specific
      # defines: update the Manual's Swift package plugin row) or if it fails
      # for any other reason.
      - name: Build Package Integration in release configuration (xcodebuild, expects the assertion)
        run: |
          pushd "Examples/Example Package Integration"
          if xcrun xcodebuild build -skipPackagePluginValidation -skipMacroValidation -scheme ExamplePackageIntegration -configuration Release -destination "platform=macOS" -derivedDataPath DerivedData SWIFT_OPTIMIZATION_LEVEL=-Onone SWIFT_COMPILATION_MODE=singlefile GCC_OPTIMIZATION_LEVEL=0 ONLY_ACTIVE_ARCH=YES > xcodebuild-release.log 2>&1; then
            echo "Expected the Release build to stop at SafeDI's compile-time assertion, but it succeeded." >&2
            exit 1
          fi
          grep -q 'SafeDI scanned this module assuming `#if DEBUG` was active, but it is inactive in this compilation' xcodebuild-release.log || { cat xcodebuild-release.log; exit 1; }
          popd

  spm-project-integration:
    name: Build Project Integration on Xcode 26
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    # Pinned to 26.4 — project file declares package traits.
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Select Xcode Version
        run: sudo xcode-select --switch /Applications/Xcode_26.4.app/Contents/Developer
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: pushd Examples/ExampleProjectIntegration && xcrun xcodebuild -resolvePackageDependencies -skipPackagePluginValidation -skipMacroValidation -scheme ExampleProjectIntegration && popd
      - name: Build Project Integration
        run: pushd Examples/ExampleProjectIntegration; xcrun xcodebuild build -skipPackagePluginValidation -skipMacroValidation -scheme ExampleProjectIntegration; popd

  spm-multi-project-integration:
    name: Build Multi Project Integration on Xcode 26
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    # Pinned to 26.4 — project file declares package traits.
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Select Xcode Version
        run: sudo xcode-select --switch /Applications/Xcode_26.4.app/Contents/Developer
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: pushd Examples/ExampleMultiProjectIntegration && xcrun xcodebuild -resolvePackageDependencies -skipPackagePluginValidation -skipMacroValidation -scheme ExampleMultiProjectIntegration && popd
      - name: Build Project Integration
        run: pushd Examples/ExampleMultiProjectIntegration; xcrun xcodebuild build -skipPackagePluginValidation -skipMacroValidation -scheme ExampleMultiProjectIntegration; popd

  spm-tuist-integration:
    name: Build Tuist Integration on Xcode 26
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    runs-on: macos-26
    permissions:
      contents: read
    # Required so mise / tuist install don't hit anonymous GitHub API
    # rate limits when resolving release tags and artifact bundles.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Select Xcode Version
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
      - name: Install Tuist via mise
        # Keep the pinned Tuist version here in sync with the README.
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mise" install -y tuist@4.183.0
          "$HOME/.local/bin/mise" use -g tuist@4.183.0
      - name: Tuist Install
        run: pushd Examples/ExampleTuistIntegration && tuist install && popd
      - name: Tuist Generate
        run: pushd Examples/ExampleTuistIntegration && tuist generate --no-open && popd
      # `EventLogger.swift` in the app target declares a different
      # `@Instantiable` under `#if DEBUG` and `#else`. If the plugin did not
      # forward `SWIFT_ACTIVE_COMPILATION_CONDITIONS`, SafeDI would wire
      # `DisabledEventLogger` and the generated compile-time assertion would
      # fail this build; the grep makes the check explicit.
      - name: Build Tuist Integration
        run: |
          pushd Examples/ExampleTuistIntegration
          xcrun xcodebuild build -skipPackagePluginValidation -skipMacroValidation -workspace ExampleTuistIntegration.xcworkspace -scheme ExampleTuistIntegration -derivedDataPath DerivedData
          grep -q "ConsoleEventLogger()" "$(find DerivedData/Build/Intermediates.noindex -path "*/Debug/ExampleTuistIntegration.build/DerivedSources/SafeDIGenerated.swift")"
          popd
      # The Release configuration does not define `DEBUG`, so the generated
      # file must wire `DisabledEventLogger`. Optimization is turned off and
      # only the active architecture is built because only the configuration
      # matters here.
      - name: Build Tuist Integration in release configuration
        run: |
          pushd Examples/ExampleTuistIntegration
          xcrun xcodebuild build -skipPackagePluginValidation -skipMacroValidation -workspace ExampleTuistIntegration.xcworkspace -scheme ExampleTuistIntegration -configuration Release -derivedDataPath DerivedData SWIFT_OPTIMIZATION_LEVEL=-Onone SWIFT_COMPILATION_MODE=singlefile GCC_OPTIMIZATION_LEVEL=0 ONLY_ACTIVE_ARCH=YES
          grep -q "DisabledEventLogger()" "$(find DerivedData/Build/Intermediates.noindex -path "*/Release/ExampleTuistIntegration.build/DerivedSources/SafeDIGenerated.swift")"
          popd

  spm:
    name: Build and Test on Xcode 26
    needs: changes
    # Also runs on every push to main, Markdown-only or not, so the
    # Codecov report behind the README badge always comes from a real
    # test run.
    if: ${{ !cancelled() && (needs.changes.outputs.source != 'false' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Select Xcode Version
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
      # Restoring `.build` carries swift-syntax's release-mode objects
      # over between runs; SafeDI's own targets and tests still rebuild
      # from the current sources. The key pins the Xcode version because
      # build products aren't portable across toolchains. The
      # restore-keys prefix reuses the most recent cache when
      # Package.resolved changes, and the incremental build takes it
      # from there.
      - name: Cache Build Directory
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-release-${{ runner.os }}-xcode-26.0-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-release-${{ runner.os }}-xcode-26.0-
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: xcrun swift package resolve
      # Run tests a few times to ensure code-gen is stable. The repeat
      # passes exist to catch output that differs between processes
      # (per-process hash seeds), and every pass still compares generated
      # output against the expected strings. Compile verification runs
      # only on the first pass: it typechecks each generated output with
      # swiftc, and re-typechecking a string the later passes have already
      # proven identical adds nothing except ~90% of the pass's runtime.
      - name: Build and Test Framework
        run: |
          xcrun swift test -c release --enable-code-coverage -Xswiftc -enable-testing --traits sourceBuild
          for _ in {1..4}; do
            SAFEDI_SKIP_COMPILE_CHECK=1 xcrun swift test -c release --enable-code-coverage -Xswiftc -enable-testing --traits sourceBuild
          done
      - name: Prepare Coverage Reports
        run: ./Scripts/prepare-coverage-reports.sh
      - name: Upload Coverage Reports
        if: success()
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          verbose: true
          os: macos
          flags: macos

  linux:
    name: Build and Test on Linux
    needs: changes
    # Also runs on every push to main, Markdown-only or not, so the
    # Codecov report behind the README badge always comes from a real
    # test run.
    if: ${{ !cancelled() && (needs.changes.outputs.source != 'false' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    container: swift:6.2
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      # Same idea as the macOS test job: reuse dependency build products
      # between runs. Keyed on the container's Swift version.
      - name: Cache Build Directory
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-release-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-release-${{ runner.os }}-swift-6.2-
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: swift package resolve
      - name: Build and Test Framework
        run: swift test -c release --enable-code-coverage -Xswiftc -enable-testing --traits sourceBuild
      - name: Install curl for Codecov
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
      - name: Prepare Coverage Reports
        run: |
          llvm-cov export -format="lcov" .build/x86_64-unknown-linux-gnu/release/SafeDIPackageTests.xctest -instr-profile .build/x86_64-unknown-linux-gnu/release/codecov/default.profdata > coverage.lcov
      - name: Upload Coverage Reports
        if: success()
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          verbose: true
          os: linux
          flags: linux

  linux-latest-swift:
    name: Build and Test on Latest Swift
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    # `swift:latest` floats to the newest Swift release so this job
    # catches toolchain changes (e.g. SwiftPM's `swiftbuild` build
    # system and its new `.build` layout) before anyone pins to them.
    # Runs on Linux rather than macOS to save runner minutes. Coverage
    # is deliberately not collected or uploaded here: the pinned `spm`
    # and `linux` jobs own the Codecov report, and a second upload
    # from a different toolchain would skew it.
    container: swift:latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Print Swift Version
        id: swift
        run: |
          swift --version
          echo "version=$(swift --version 2>&1 | grep -m1 -oE 'Swift version [0-9.]+' | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      # The toolchain floats, so the key carries the version printed
      # above: a new release starts from an empty cache.
      - name: Cache Build Directory
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-swift-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-debug-${{ runner.os }}-swift-${{ steps.swift.outputs.version }}-
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: swift package resolve
      - name: Build and Test Framework
        run: swift test --traits sourceBuild

  bazel:
    name: Bazel Build on macOS
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    # General bazel sanity check on every PR. We can't perfectly
    # mirror BCR's presubmit (https://registry.bazel.build/modules/safedi):
    # BazelCI's BuildKite infrastructure is closed to non-`bazelbuild`
    # projects (https://github.com/bazelbuild/continuous-integration/blob/main/.github/ISSUE_TEMPLATE/adding-your-project-to-bazel-ci.md),
    # and any GH Actions runner we pick differs from BCR's image in
    # ways we can't fully control (CC toolchain auto-detection,
    # SDK-vs-runner-OS gap, exact Bazel point release). So treat BCR
    # as the canonical macOS-on-older-OS check; this job catches
    # general regressions before we publish.
    #
    # Keep `build_targets` aligned with `.bcr/presubmit.yml` so a
    # divergence is visible in review. If you change BCR's task list,
    # update this job too.
    #
    # Pinned to Xcode 26.0 — matches BCR's `macos_arm64` runner
    # platform defined at https://github.com/bazelbuild/continuous-integration/blob/master/buildkite/bazelci.py
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Select Xcode Version
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
      # Bazel's disk and repository caches are content-addressed, so
      # restoring them reuses the outputs of identical actions (above
      # all the swift-syntax compiles) without changing what gets built.
      # Both builds below point at the same caches, so the downstream
      # example's exec-config swift-syntax is a hit even on a run where
      # nothing was restored. The flags live on the command lines rather
      # than in `.bazelrc` so BCR's presubmit keeps building with
      # SafeDI's committed defaults.
      - name: Cache Bazel
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repository
          key: bazel-${{ runner.os }}-xcode-26.0-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'Package.resolved', 'Examples/ExampleBazelIntegration/MODULE.bazel', 'Examples/ExampleBazelIntegration/MODULE.bazel.lock') }}
          restore-keys: |
            bazel-${{ runner.os }}-xcode-26.0-
      # Wrapping `bazelisk build` in retry — not just dependency
      # resolution, like the SPM jobs above — because Bazel resolves
      # external repos lazily during the build itself. There's no
      # equivalent to `swift package resolve` we could isolate; a
      # transient HTTP failure (e.g. on a `rules_swift` transitive
      # like `MobileNativeFoundation/index-import`) surfaces as a
      # build failure. Bazel caches successful downloads, so a retry
      # after a flake is cheap.
      #
      # Each command runs in a subshell so a `cd` for the example
      # build doesn't leak its cwd change into subsequent retries.
      - name: Build SafeDI targets (mirrors BCR `verify_safedi_build`)
        uses: ./.github/actions/retry
        with:
          # Kept on one line — the retry composite action splices
          # `${{ inputs.command }}` directly into a bash `for` loop
          # and tacks ` && break` onto the same source line, so a
          # multi-line YAML command leaves `&& break` orphaned.
          command: bazelisk build --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repository" //Sources/SafeDI:SafeDI //Sources/SafeDICore:SafeDICore //Sources/SafeDIMacros:SafeDIMacros //Sources/SafeDITool:SafeDITool
      - name: Build downstream example (mirrors BCR `bcr_test_module.build_example`)
        uses: ./.github/actions/retry
        with:
          command: (cd Examples/ExampleBazelIntegration && bazelisk build --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repository" //Subproject:Subproject //ExampleBazelIntegration:ExampleBazelIntegration)
      # Optimized builds define no `DEBUG`, so the rule must withhold it and SafeDI
      # must wire the example's `#else` logger. The `_safedi` target is listed so
      # Bazel writes its output to bazel-bin even when every action is a cache hit.
      - name: Build downstream example in opt mode
        uses: ./.github/actions/retry
        with:
          command: (cd Examples/ExampleBazelIntegration && bazelisk build --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repository" -c opt //ExampleBazelIntegration:ExampleBazelIntegration //ExampleBazelIntegration:ExampleBazelIntegration_safedi)
      # Kept out of the retry wrapper: a missing logger is deterministic, not a flake.
      - name: Verify opt mode wired the `#else` logger
        run: grep -q "DisabledEventLogger()" Examples/ExampleBazelIntegration/bazel-bin/ExampleBazelIntegration/ExampleBazelIntegration_safedi.swift

  codecov-empty-upload:
    name: Codecov Status for Markdown-only Changes
    needs: changes
    # With the test jobs skipped, no coverage report reaches Codecov and
    # its required `codecov/project` status would never be posted.
    # `empty-upload` tells Codecov the commit changed nothing it
    # measures, and Codecov posts passing statuses instead. Pull
    # requests only: on main the coverage jobs run regardless.
    if: ${{ needs.changes.outputs.source == 'false' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Send Empty Upload
        uses: codecov/codecov-action@v7
        with:
          run_command: empty-upload
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  readme-validation:
    name: Check Markdown links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Link Checker
        uses: AlexanderDokuchaev/md-dead-link-check@5b5641a92ec95d13a5b04927e0e11de5c3405298 # v1.3.0

  lint-swift:
    name: Lint Swift
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    container: swift:6.3
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      # `swift run` otherwise compiles SwiftFormat from source on every
      # run. Keyed on the container's Swift version.
      - name: Cache SwiftFormat Build
        uses: actions/cache@v6
        with:
          path: CLI/.build
          key: swiftformat-${{ runner.os }}-swift-6.3-${{ hashFiles('CLI/Package.resolved') }}
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: swift package resolve --package-path CLI
      - name: Lint Swift
        run: swift run --package-path CLI swiftformat . --lint
