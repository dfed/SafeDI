name: CI

on:
  push:
    branches:
    - main
  schedule:
    # Runs at 00:00 UTC every Monday to ensure that CI does not bitrot.
    - cron: '0 0 * * 1'
  pull_request:

# Keyed on the pull request, not its branch's name: pull requests from two forks often share a branch name
# (`main`, `patch-1`), and would cancel each other's runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Files
    # Every build and test job below depends on this one and skips
    # itself when the push or pull request touched only Markdown. A
    # job skipped by its `if:` reports "Success", so required status
    # checks are satisfied without allocating a runner. A skipped
    # matrix job is the exception: it reports one check under its
    # unexpanded name, so a required check that a matrix job reports
    # needs a stand-in that reports the same names. Anything that
    # isn't Markdown (sources, workflows, lockfiles, project files)
    # counts as a source change. DocC articles are Markdown but feed
    # the DocC build, so they're tracked separately. The link checker
    # and the update-version check always run: Markdown is an input to
    # both, and the two coverage jobs run
    # on every push to main so the README badge's report is never an
    # empty one. When in doubt (a scheduled run, or a diff that can't
    # be computed) the answer is "everything changed", and the gates
    # below treat a missing answer the same way.
    #
    # Two paths are classified by who reads them, not by their extension.
    # `Documentation/Manual.md` is a source change: three tests take their
    # fixtures and expected output from its code blocks. A file under
    # `.claude/` is not: no source, test or build reads one, and the
    # scripts there have their fixture self-tests in "Check Agent Skill
    # Scripts on Linux", which always runs. A path joins this list only
    # when no job that would skip reads it.
    #
    # `integrations` is false when every changed file is Markdown or
    # under `Tests/` or `.claude/`. The two macOS jobs that build SafeDI
    # for Apple platforms and build the examples compile only products
    # and the examples, never a test target or an agent skill, so such a
    # change cannot alter what they build, and they skip. Together they
    # took 49 of a run's 80 to 88 macOS runner minutes (runs 44672257156
    # and 44678862998), and a run waits on the account's five macOS
    # slots longer than on anything else. Any other path, a workflow
    # among them, counts as feeding them.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source: ${{ steps.classify.outputs.source }}
      docc: ${{ steps.classify.outputs.docc }}
      integrations: ${{ steps.classify.outputs.integrations }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # Full history so both ends of the diff are present.
          fetch-depth: 0
      - name: Classify Changed Files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          source=false
          docc=false
          integrations=false
          # A stacked pull request's base is the branch below it, and CI
          # runs on the top pull request only, so a Markdown-only top
          # would skip the tests of every change beneath it. A pull
          # request is therefore classified against the default branch:
          # the diff below starts from the merge base either way.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="origin/$DEFAULT_BRANCH"
          fi
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "push" ]; then
            echo "Event '$EVENT_NAME' has no diff to classify; treating everything as changed."
            source=true
            docc=true
            integrations=true
          elif ! changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "Could not diff $BASE_SHA...$HEAD_SHA; treating everything as changed."
            source=true
            docc=true
            integrations=true
          else
            echo "Changed files:"
            echo "$changed"
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                *.docc/*) docc=true ;;
              esac
              case "$file" in
                Documentation/Manual.md) source=true ;;
                *.md | .claude/*) ;;
                *) source=true ;;
              esac
              case "$file" in
                *.md | Tests/* | .claude/*) ;;
                *) integrations=true ;;
              esac
            done <<< "$changed"
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "docc=$docc" >> "$GITHUB_OUTPUT"
          echo "integrations=$integrations" >> "$GITHUB_OUTPUT"
          echo "source=$source docc=$docc integrations=$integrations"

  # A stack of pull requests is checked at its top: the top's merge holds every branch below it, so the heavy jobs
  # of a branch another open pull request is based on repeat work the top's run does. Those runs were cancelled
  # by hand, when someone got to them: 423 Linux and 65 macOS runner hours went to runs later cancelled between
  # 2026-11-21 and 2026-11-25. So a pull request's run asks two things: whether another open pull request of this
  # repository names its branch as base, and whether its own base is a branch other than the default one. When
  # both hold, it is in the middle of a stack, this job's output names the pull requests above it, and every job
  # that builds or tests is skipped: each has `needs.stack-position.outputs.stacked-under == ''` in its `if:`.
  # The quick jobs (the version checks, the Markdown and skill script checks, lint) run as always.
  #
  # One build still runs in the middle of a stack: "Build for Apple Platforms, DocC and Xcode Projects on Xcode
  # 26" resolves the package and runs its "Build Framework (platform=macOS)" step alone, so a branch whose
  # sources Xcode 26's compiler rejects, though Linux's accepts them, says so on its own pull request and not
  # only in the top's run, which cannot say which branch beneath it broke the build. Its other steps have the
  # condition the other jobs have.
  #
  # A pull request into the default branch always runs everything, whatever is based on it: when the row below
  # lands, the next one takes main as its base and is pushed ("retarget first, then push"), and that run is
  # complete. So a stack costs two full runs, its top and its bottom, where it cost one per branch.
  #
  # A skipped job satisfies a required check, and a skipped matrix job reports only its unexpanded name, so a
  # required check a matrix reports stays unreported. Neither matters here and no stand-in is needed: required
  # checks protect only the default branch, and no pull request into it is skipped. Whoever lands a stack still
  # requires a green run, with nothing skipped but for a Markdown-only change, on the head being landed.
  #
  # A pull request labelled `run-all-checks` runs everything wherever it is in a stack, for a check in the
  # middle. The label and the base are read as they are now, not as the event carried them, so label first, then
  # push.
  #
  # A pull request labelled `clean-build` builds from nothing: every restore of a build SwiftPM or xcodebuild made is
  # skipped ("Restore Build Directory" in each job that has one, the DocC build's, and the Package example's
  # scratch directories and DerivedData); Bazel's cache, which is keyed by content, stays.
  # It is for a run whose result a restored build could have made, red or green: a re-run restores the same
  # build, so only a build from nothing tells the two apart. Read as it is now too, so label first, then re-run.
  # The test build takes 10 to 17 minutes on Linux from nothing, and about 24 on macOS.
  #
  # Any doubt runs everything: a pull request from a fork, or one whose pull requests cannot be listed, gets an
  # empty output. On a push to main and on the schedule the job is skipped, its output is empty, and every job
  # runs. A full run pays for it with the seconds a Linux runner takes to start and answer; the macOS build jobs
  # already wait that long for "Bazel Source Archive Check". No container, since it only calls GitHub.
  stack-position:
    name: Decide Whether This Pull Request Runs the Heavy Jobs
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      # To list the open pull requests based on this one's branch, and to read this one's labels and base.
      pull-requests: read
    outputs:
      stacked-under: ${{ steps.find.outputs.stacked-under }}
      clean-build: ${{ steps.find.outputs.clean-build }}
    steps:
      # Twice the longest it should take, and then some: the two kinds of call "Find Builds a Pull Request Passed
      # on This Tree" makes took 1 second. Not yet measured on a runner; set it from the first runs.
      - name: Find the Pull Requests Based on This Branch
        id: find
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/github-script@v8
        with:
          script: |
            const pullRequest = context.payload.pull_request
            if (pullRequest.head.repo.id !== pullRequest.base.repo.id) {
              core.info('A pull request from a fork: every job runs.')
              return
            }
            let above
            try {
              const { data: live } = await github.rest.pulls.get({ ...context.repo, pull_number: pullRequest.number })
              if (live.labels.some(label => label.name === 'clean-build')) {
                core.info('Labelled clean-build: no job restores a build directory.')
                core.setOutput('clean-build', 'true')
              }
              if (live.labels.some(label => label.name === 'run-all-checks')) {
                core.info('Labelled run-all-checks: every job runs.')
                return
              }
              if (live.base.ref === context.payload.repository.default_branch) {
                core.info(`Based on ${live.base.ref}: every job runs.`)
                return
              }
              const open = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open', base: pullRequest.head.ref, per_page: 100 })
              above = open.filter(other => other.number !== pullRequest.number && other.base.repo.id === pullRequest.base.repo.id).map(other => `#${other.number}`)
            } catch (error) {
              core.warning(`Could not tell whether a pull request is based on this branch (${error.message}): every job runs.`)
              return
            }
            if (above.length === 0) {
              core.info('No open pull request is based on this branch: every job runs.')
              return
            }
            const message = `Skipped: stacked under ${above.join(', ')}; checks run on the top of the stack and on the pull request into ${context.payload.repository.default_branch}.`
            core.notice(message)
            await core.summary.addRaw(message).write()
            core.setOutput('stacked-under', above.join(', '))

  version-consistency-check:
    name: Version Consistency Check
    # Checks that each SwiftPM dependency Package.resolved pins has the
    # same version in MODULE.bazel (or is listed as SwiftPM only), and
    # that SafeDI's own version agrees across the files the publish
    # workflow stamps. Runs on every change, as the job below does: it
    # takes seconds. It reads text files with portable shell tools, so it
    # runs on Linux with no container.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Check version consistency
        run: ./Scripts/check-version-consistency.sh

  update-version-check:
    name: Update Version Script Check
    # Runs on every change, Markdown-only ones included: the script
    # edits the install snippets in the documentation, and the last
    # step fails when a Markdown file states a SafeDI version the
    # script does not update. The script uses portable `sed -i.bak`, so
    # this needn't take one of the five concurrent macOS slots. The
    # publish workflow still runs it on macOS.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Make stand-in macOS binaries
        # Outside the checkout, so the file-list checks below see only
        # what the script edits.
        run: |
          printf 'stand-in arm64 SafeDITool' > "$RUNNER_TEMP/SafeDITool-macos-arm64"
          printf 'stand-in x86_64 SafeDITool' > "$RUNNER_TEMP/SafeDITool-macos-x86_64"
      - name: Run update-version script for a prerelease
        run: ./Scripts/update-version.sh 99.99.99-test abc123testchecksum456 "$RUNNER_TEMP/SafeDITool-macos-arm64" "$RUNNER_TEMP/SafeDITool-macos-x86_64"
      - name: Verify URL was updated
        run: grep -q 'releases/download/99.99.99-test/SafeDITool.artifactbundle.zip' Package.swift
      - name: Verify checksum was updated
        run: grep -q 'checksum:.*abc123testchecksum456' Package.swift
      - name: Verify Plugins/Shared.swift safeDIVersion was updated
        # Match the literal within 3 lines after the `safeDIVersion`
        # getter declaration so a future test-string in an unrelated
        # spot can't satisfy a bare file-wide grep. Block scalar because
        # an unquoted inline `{` trips the YAML parser.
        run: |
          grep -A 2 'var safeDIVersion: String {' Plugins/Shared.swift | grep -q '"99.99.99-test"'
      - name: Verify Plugins/Shared.swift macOS binary hashes were updated
        # Each digest must be the stand-in's, inside its own getter.
        run: |
          arm64=$(sha256sum "$RUNNER_TEMP/SafeDITool-macos-arm64" | cut -d ' ' -f 1)
          x86_64=$(sha256sum "$RUNNER_TEMP/SafeDITool-macos-x86_64" | cut -d ' ' -f 1)
          grep -A 2 'var safeDIToolMacOSArm64SHA256: String {' Plugins/Shared.swift | grep -q "\"$arm64\""
          grep -A 2 'var safeDIToolMacOSX86_64SHA256: String {' Plugins/Shared.swift | grep -q "\"$x86_64\""
      - name: Verify MODULE.bazel version was updated
        # Scope to the top-level module() block so bazel_dep lines that
        # also carry `version = "X"` can't false-positive.
        run: |
          awk '/^module\(/,/^\)/' MODULE.bazel | grep -q 'version = "99.99.99-test"'
      - name: Check version consistency after a prerelease
        run: ./Scripts/check-version-consistency.sh
      - name: Verify a prerelease leaves the install snippets unchanged
        run: |
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' MODULE.bazel Package.swift Plugins/Shared.swift | sort)
          if [ "$changed" != "$expected" ]; then
            echo "::error::A prerelease should change exactly these files:"
            echo "$expected"
            echo "It changed:"
            echo "$changed"
            exit 1
          fi
      - name: Run update-version script for a stable release
        run: ./Scripts/update-version.sh 99.99.99 abc123testchecksum456 "$RUNNER_TEMP/SafeDITool-macos-arm64" "$RUNNER_TEMP/SafeDITool-macos-x86_64"
      - name: Check version consistency after a stable release
        run: ./Scripts/check-version-consistency.sh
      - name: Verify a stable release changes the expected files
        # Keep this list in step with DOCUMENTATION_FILES in the script
        # and with the files publish.yml's Commit step adds.
        run: |
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            MODULE.bazel \
            Package.swift \
            Plugins/Shared.swift \
            README.md \
            Documentation/Manual.md \
            Documentation/QuickStart.md \
            Sources/SafeDI/SafeDI.docc/SafeDI.md \
            Examples/ExampleTuistIntegration/README.md | sort)
          if [ "$changed" != "$expected" ]; then
            echo "::error::A stable release should change exactly these files:"
            echo "$expected"
            echo "It changed:"
            echo "$changed"
            exit 1
          fi
      - name: Verify every install snippet was updated
        # Every Markdown line that states a SafeDI version in one of the
        # snippet shapes must now name the scratch version. A snippet in
        # a file the script does not list fails here: add the file to
        # DOCUMENTATION_FILES in the script, to the list in the step
        # above, and to publish.yml's Commit step.
        run: |
          snippets=$(git grep -n -E 'SafeDI\.git", from: "[0-9]|bazel_dep\(name = "safedi", version = "[0-9]|SafeDI dependency to .from: "[0-9]' -- '*.md')
          echo "$snippets"
          if [ -z "$snippets" ]; then
            echo "::error::Found no install snippets; the patterns in this step are out of date."
            exit 1
          fi
          if stale=$(grep -v '"99\.99\.99"' <<< "$snippets"); then
            echo "::error::Scripts/update-version.sh did not update these install snippets:"
            echo "$stale"
            exit 1
          fi

  bazel-source-archive-check:
    name: Bazel Source Archive Check
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    # The publish workflow builds the source archive the BCR entry points
    # at with Scripts/create-bazel-source-archive.sh, which writes the
    # sha256 of each prebuilt SafeDITool into it. Run the script on
    # stand-in binaries on every change, so it cannot rot unnoticed
    # between releases, and check that the repository itself names no
    # prebuilt SafeDITool: a checkout must build SafeDITool from source.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: 99.99.99-test
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Verify the repository names no prebuilt SafeDITool
        run: |
          grep -qx 'SAFEDITOOL_RELEASE = None' bazel/private/prebuilt_safeditool.bzl
          grep -qx 'SAFEDITOOL_SHA256 = {}' bazel/private/prebuilt_safeditool.bzl
      - name: Create a source archive from stand-in binaries
        run: |
          mkdir "$RUNNER_TEMP/binaries"
          for platform in linux-arm64 linux-x86_64 macos-arm64 macos-x86_64; do
            echo "Stand-in for SafeDITool-$platform" > "$RUNNER_TEMP/binaries/SafeDITool-$platform"
          done
          ./Scripts/create-bazel-source-archive.sh "$VERSION" "$RUNNER_TEMP/binaries" HEAD
      - name: Verify the archive names the stand-in binaries
        run: |
          {
            echo "SAFEDITOOL_RELEASE = \"$VERSION\""
            echo "SAFEDITOOL_SHA256 = {"
            for platform in linux-arm64 linux-x86_64 macos-arm64 macos-x86_64; do
              echo "    \"$platform\": \"$(sha256sum "$RUNNER_TEMP/binaries/SafeDITool-$platform" | cut -d ' ' -f 1)\","
            done
            echo "}"
          } > "$RUNNER_TEMP/expected-values"
          tar -xzOf "SafeDI-$VERSION.tar.gz" "SafeDI-$VERSION/bazel/private/prebuilt_safeditool.bzl" | grep -E '^(SAFEDITOOL_|    "|})' > "$RUNNER_TEMP/actual-values"
          diff "$RUNNER_TEMP/expected-values" "$RUNNER_TEMP/actual-values"
      - name: Verify the archive is git archive with only that file changed
        # Same paths, modes, owners, modification times, and symbolic
        # links as `git archive` writes, and the same content in every
        # other file.
        run: |
          diff \
            <(git archive --format=tar --prefix="SafeDI-$VERSION/" HEAD | tar -tvf - | grep -v ' SafeDI-[^ ]*/bazel/private/prebuilt_safeditool\.bzl$') \
            <(tar -tvzf "SafeDI-$VERSION.tar.gz" | grep -v ' SafeDI-[^ ]*/bazel/private/prebuilt_safeditool\.bzl$')
          mkdir "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/expected"
          tar -xzf "SafeDI-$VERSION.tar.gz" -C "$RUNNER_TEMP/actual"
          if diff -r "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual/SafeDI-$VERSION" > "$RUNNER_TEMP/differences"; then
            echo "::error::The archive's bazel/private/prebuilt_safeditool.bzl is the repository's."
            exit 1
          fi
          cat "$RUNNER_TEMP/differences"
          if grep -E '^(Only in|diff -r)' "$RUNNER_TEMP/differences" | grep -v -x "diff -r $RUNNER_TEMP/expected/bazel/private/prebuilt_safeditool.bzl $RUNNER_TEMP/actual/SafeDI-$VERSION/bazel/private/prebuilt_safeditool.bzl"; then
            echo "::error::The archive differs from git archive in more than bazel/private/prebuilt_safeditool.bzl."
            exit 1
          fi

  passed-on-this-tree:
    # Main's run after a merge builds the tree a pull request's run has usually just built: a pull request is
    # merged when its head holds main's tip, so the commit its checks ran on and the commit the merge leaves on
    # main have the same tree. The two macOS jobs below that only build (SafeDI for the Apple platforms, DocC,
    # and the examples) took 49 of a run's 80 to 88 macOS runner minutes (runs 44672257156 and 44678862998), and
    # the account's five macOS slots are what every run queues on. So each of the two, when it passes in a pull
    # request's run with its caches current, uploads a record named for the tree it built ("Record That This
    # Tree Passed" at its end), and this job tells a push to main whether such a record exists for the pushed
    # commit's tree. When one does, main skips that job. "Build and Test on Xcode 26" always runs on main: it
    # makes the coverage report behind the README badge.
    #
    # Only a record that a pull request's run of this workflow in this repository uploaded, whose job of that
    # name concluded in success, counts: a pull request from a fork can upload an artifact of any name. A record
    # is uploaded only when every cache the job restores was an exact hit, so a run whose caches were stale
    # leaves no record, main's job then runs, and it saves the caches as before. The job names below are the two
    # jobs' `name:`; when one is renamed and this is not, no record is found and main runs the job.
    #
    # The same holds for the Linux checks that only judge the tree and save nothing a later run restores: the
    # fuzzer's shards and "Check Graph Fuzzer Corpus on Linux", the four repeat passes, Release Acceptance, "Build
    # Release SafeDITool on Linux" and "Check Function Compile Time on Linux". They took 370 of the 519 Linux
    # runner minutes of a push to main (the mean of 41 runs, 2026-11-21 to 2026-11-25), on a tree the pull
    # request's run had passed minutes before. "Record the Linux Checks That Passed on This Tree" uploads one
    # record for each of them that passed in a pull request's run, and a push to main skips each one this job
    # finds a record for. A record counts only when every job of its check concluded in success in the run that
    # uploaded it: for a matrix, every job whose name starts as the matrix's does, and at least one.
    #
    # What a record proves: it is named for the tree of the commit the pull request's run checked out (the merge
    # of the pull request with its base, which is what the merge leaves on main when the head held main's tip),
    # and the workflow files, the scripts and Package.resolved are part of that tree, so the same tree means the
    # same jobs, matrices and dependencies. What it does not prove is that the runner image or the container has
    # not moved in between, which is why a record lasts three days and the weekly scheduled run skips nothing.
    #
    # Every job that saves a cache another run restores, or makes a coverage report, still runs on every push to
    # main: "Build Tests on Linux", "Build and Test on Linux" (the build cache, the passed compile checks, and
    # with "Build and Test on Xcode 26" the coverage behind the README badge), "Check Generate Time on Linux"
    # (the tool the next change is measured against) and "Build and Test on Latest Swift". So main's run still
    # builds and tests every commit, and its badge still says so.
    #
    # Nothing here fails a run: whatever goes wrong, the outputs are empty and every job runs. It runs on every
    # event, in seconds, so that a pull request exercises it; only a push to main reads its answers. No
    # container, since it only reads, as "Check Line Coverage on Linux" does.
    name: Find Builds a Pull Request Passed on This Tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To list the records and the runs that uploaded them.
      actions: read
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      apple-platforms: ${{ steps.find.outputs.apple-platforms }}
      example-integrations: ${{ steps.find.outputs.example-integrations }}
      graph-fuzzer: ${{ steps.find.outputs.graph-fuzzer }}
      linux-repeat: ${{ steps.find.outputs.linux-repeat }}
      release-acceptance: ${{ steps.find.outputs.release-acceptance }}
      linux-release-build: ${{ steps.find.outputs.linux-release-build }}
      function-compile-time: ${{ steps.find.outputs.function-compile-time }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Read This Commit's Tree
        id: tree
        continue-on-error: true
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          test "${#tree}" -eq 40
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      # Twice the longest it should take, and then some: the same two kinds of call took 1 second in Verify's
      # "Find an Earlier Verify Run's Build" (runs 44672166443 and 44677598332).
      - name: Find the Records
        id: find
        if: ${{ steps.tree.outputs.tree != '' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/github-script@v8
        env:
          TREE: ${{ steps.tree.outputs.tree }}
        with:
          script: |
            // For each check: the jobs that must have concluded in success in the run that uploaded the record,
            // by whole name, and by the start of a matrix's or a called workflow's names (at least one such job,
            // and every one of them in success). A job named under `skipped` is one the called workflow never
            // runs when this workflow calls it, so its "skipped" counts as nothing.
            const checks = {
              'apple-platforms': { names: ['Build for Apple Platforms, DocC and Xcode Projects on Xcode 26'], prefixes: [] },
              'example-integrations': { names: ['Build Package, Tuist and Bazel Integrations on Xcode 26'], prefixes: [] },
              'graph-fuzzer': { names: ['Check Graph Fuzzer Corpus on Linux'], prefixes: ['Fuzz Dependency Graphs on Linux ('] },
              'linux-repeat': { names: ['Repeat Tests on Linux'], prefixes: ['Repeat Tests on Linux (pass '] },
              'release-acceptance': { names: ['Release Acceptance / Check Release Acceptance on Linux'], prefixes: ['Release Acceptance / '], skipped: ['Release Acceptance / Build for Release Acceptance on Linux'] },
              'linux-release-build': { names: ['Build Release SafeDITool on Linux'], prefixes: [] },
              'function-compile-time': { names: ['Check Function Compile Time on Linux'], prefixes: [] },
            }
            const runsById = new Map()
            const jobsByRunId = new Map()
            for (const [key, check] of Object.entries(checks)) {
              const name = `passed-${key}-${process.env.TREE}`
              let passed = false
              try {
                const { data } = await github.rest.actions.listArtifactsForRepo({ ...context.repo, name, per_page: 20 })
                for (const artifact of data.artifacts) {
                  if (artifact.expired || !artifact.workflow_run) { continue }
                  const runId = artifact.workflow_run.id
                  if (!runsById.has(runId)) {
                    runsById.set(runId, (await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: runId })).data)
                  }
                  const run = runsById.get(runId)
                  if (run.path !== '.github/workflows/ci.yml' || run.event !== 'pull_request' || !run.head_repository || run.head_repository.id !== run.repository.id) {
                    core.info(`${name}: run ${run.id} is not a pull request's run of this workflow in this repository.`)
                    continue
                  }
                  if (!jobsByRunId.has(runId)) {
                    jobsByRunId.set(runId, await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...context.repo, run_id: runId, filter: 'latest', per_page: 100 }))
                  }
                  const jobs = jobsByRunId.get(runId)
                  const missing = check.names.find(jobName => !jobs.some(job => job.name === jobName && job.conclusion === 'success'))
                  if (missing !== undefined) {
                    core.info(`${name}: "${missing}" did not conclude in success in run ${run.id}.`)
                    continue
                  }
                  const incomplete = check.prefixes.find(prefix => {
                    const matching = jobs.filter(job => job.name.startsWith(prefix) && !(job.conclusion === 'skipped' && (check.skipped || []).includes(job.name)))
                    return matching.length === 0 || matching.some(job => job.conclusion !== 'success')
                  })
                  if (incomplete !== undefined) {
                    core.info(`${name}: not every "${incomplete}…" job concluded in success in run ${run.id}.`)
                    continue
                  }
                  core.info(`${name}: passed in run ${run.id}.`)
                  passed = true
                  break
                }
              } catch (error) {
                core.info(`${name}: could not be looked up (${error.message}); the check runs.`)
                passed = false
              }
              if (!passed) { core.info(`${name}: no record.`) }
              core.setOutput(key, String(passed))
            }

  apple-platforms:
    # One job builds SafeDI for the five Apple platforms, builds its DocC and builds the two Xcode project
    # examples, where eight jobs did: a pull request waits for a macOS runner once instead of eight times, and
    # the account's few macOS runners are what a run queues on. Each build is a step of its own. A platform's
    # build and DocC run whatever the steps before them did, and a step of an example runs only when that
    # example's step before it passed, so a failure names what failed and hides nothing else. A job without a
    # matrix reports its own name when a Markdown-only change skips it, so it needs no stand-in.
    #
    # On macOS because it runs xcodebuild against Apple platform SDKs, builds DocC with Xcode's toolchain, and
    # builds Xcode projects.
    #
    # Each build's timeout is about twice the longest it took in two runs (43970600091 and 43956636767), in
    # seconds: the macOS build 158; a platform's build 219 to 395; Project Integration 158 and 198 in release;
    # Multi Project Integration 187. A step the retry action runs gets more, because the action waits up to 465
    # seconds between its six attempts: a resolve took 39 to 55 and gets 15 minutes; DocC took 45 with its build
    # directory restored and builds swift-syntax when the cache misses, about 8 minutes, and gets 25. "Ensure
    # Platforms Are Installed" took 5 to 42 per platform and gets 35 minutes, which lets one missing runtime
    # download and be tried again.
    #
    # The price of one job: a step that fails on a flake is run again by running the whole job again, 30 to 40
    # minutes, where its own job took about 1 to 8.
    name: Build for Apple Platforms, DocC and Xcode Projects on Xcode 26
    # Every macOS job but "Build and Test on Xcode 26" also waits for a Linux job that takes seconds, so that the
    # run's longest job queues for the few macOS runners first and the run ends when it does, not 30 minutes later.
    needs: &after-the-long-macos-job-queues [changes, bazel-source-archive-check, passed-on-this-tree, stack-position]
    # DocC articles under `*.docc/` are Markdown, so this job also runs
    # when only those changed, and then only its DocC steps do. It skips
    # when the change feeds nothing it builds ("Detect Changed Files"), and
    # on main when a pull request's run passed it on the same tree ("Find
    # Builds a Pull Request Passed on This Tree").
    #
    # In the middle of a stack it runs for the macOS build alone ("Decide Whether This Pull Request Runs the
    # Heavy Jobs" says why), so not for a change to DocC articles only: every step but the checkout, the Xcode
    # selection, the package resolve and "Build Framework (platform=macOS)" then skips, the record that the tree
    # passed among them.
    if: ${{ !cancelled() && !(github.event_name == 'push' && needs.passed-on-this-tree.outputs.apple-platforms == 'true') && ((needs.changes.outputs.source != 'false' && needs.changes.outputs.integrations != 'false') || (needs.changes.outputs.docc == 'true' && needs.stack-position.outputs.stacked-under == '')) }}
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Select Xcode Version
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
      # GitHub's macOS images export ImageVersion (for example
      # 20261102.0473.1) from ~/.bashrc; it is not in the `env` context, so
      # a step reads it for the cache key below. The OS build stands in if
      # an image ever stops exporting it.
      - name: Read Runner Image Version
        id: runner-image
        run: echo "version=${ImageVersion:-$(sw_vers -buildVersion)}" >> "$GITHUB_OUTPUT"
      # `swift-docc-plugin`'s `--warnings-as-errors` scopes to a single
      # target, so swift-syntax's internal DocC noise stays out of our
      # strict build. That scoping isn't available via `xcodebuild
      # docbuild`, which analyzes the whole target graph.
      # `generate-documentation` builds the target in debug; reuse the
      # dependency build products between runs.
      # The key names the runner image for the reason "Build and Test on
      # Xcode 26" gives at its own cache key.
      - name: Cache Build Directory
        id: docc-cache
        if: ${{ needs.stack-position.outputs.stacked-under == '' && needs.stack-position.outputs.clean-build != 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-xcode-26.0-${{ steps.runner-image.outputs.version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-debug-${{ runner.os }}-xcode-26.0-${{ steps.runner-image.outputs.version }}-
            spm-debug-${{ runner.os }}-xcode-26.0-
      - name: Build DocC
        id: docc
        if: ${{ needs.stack-position.outputs.stacked-under == '' }}
        timeout-minutes: 25
        uses: ./.github/actions/retry
        with:
          command: swift package generate-documentation --target SafeDI --warnings-as-errors
      # Saved here, not when the job ends, so that an unrelated step that fails later loses no cache.
      # Only from main, for the reason "Build and Test on Xcode 26" gives
      # at its own cache.
      - name: Save Build Directory Cache
        if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && github.ref == 'refs/heads/main' && steps.docc-cache.outputs.cache-hit != 'true' && steps.docc.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.docc-cache.outputs.cache-primary-key }}
      # xcodebuild otherwise clones every package dependency from
      # scratch on each run (swift-syntax is the large one). Keeping the
      # clones in a fixed directory lets actions/cache restore them. The
      # clones are plain git checkouts, so the key needn't name the
      # Xcode version.
      - name: Cache Cloned Source Packages
        id: packages-cache
        if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/xcode-packages
          key: xcode-packages-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
      # Resolving needs no platform, so it comes before any download
      # the next step might have to do, while the runner is quiet.
      - name: Resolve Package Dependencies
        timeout-minutes: 15
        id: resolve-packages
        if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
        uses: ./.github/actions/retry
        with:
          command: xcrun xcodebuild -resolvePackageDependencies -skipPackagePluginValidation -skipMacroValidation -scheme SafeDI-Package -clonedSourcePackagesDirPath "$RUNNER_TEMP/xcode-packages"
      # Saved here, not when the job ends, so that an unrelated step that fails later loses no cache.
      - name: Save Cloned Source Packages Cache
        if: ${{ !cancelled() && steps.packages-cache.outputs.cache-hit != 'true' && steps.resolve-packages.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/xcode-packages
          key: ${{ steps.packages-cache.outputs.cache-primary-key }}
      - name: Build Framework (platform=macOS)
        if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
        timeout-minutes: 6
        run: xcrun xcodebuild -skipMacroValidation -skipPackagePluginValidation build -scheme SafeDI-Package -destination platform=macOS -clonedSourcePackagesDirPath "$RUNNER_TEMP/xcode-packages" -derivedDataPath "$RUNNER_TEMP/framework-xcode-26.0"
      - name: Report Free Disk Space
        if: ${{ !cancelled() }}
        run: df -h /
      # Why the non-macOS destinations build with Xcode 26.2 while
      # everything else in this workflow stays on the 26.0 floor:
      # GitHub's macos-26 image ships the simulator runtimes for
      # Xcode 26.2 and newer, dyld caches prebuilt, but not 26.0's.
      # With 26.0 each of these builds had to download an 8 GB runtime
      # and then build its dyld shared cache in the background, which
      # slowed every xcodebuild action on the runner 2-5x for several
      # minutes (resolve took ~175 s against ~10 s on the macOS build).
      # The 26.0 floor is still exercised by the macOS destination
      # here, by the test job, and by the example job; what moves
      # to 26.2 is compiling SafeDI's library sources against the
      # iOS, tvOS, watchOS, and visionOS SDKs. If the image stops
      # shipping a runtime, "Ensure Platforms Are Installed" downloads
      # it: slower, not broken.
      # Each Xcode builds into a DerivedData directory of its own: products of one compiler are not read by another.
      - name: Select Xcode 26.2
        id: xcode-26-2
        if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && needs.changes.outputs.source != 'false' }}
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
      - name: Resolve Package Dependencies with Xcode 26.2
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.xcode-26-2.outcome == 'success' }}
        uses: ./.github/actions/retry
        with:
          command: xcrun xcodebuild -resolvePackageDependencies -skipPackagePluginValidation -skipMacroValidation -scheme SafeDI-Package -clonedSourcePackagesDirPath "$RUNNER_TEMP/xcode-packages"
      # Normally a no-op: the selected Xcode's SDK version has a matching
      # runtime on the image. The download is the fallback, with a
      # deadline and one retry because a download that sits in
      # "Preparing to download" has held a runner for an hour. The
      # image has already run `-runFirstLaunch` for every Xcode, so it
      # is only repeated when Xcode reports work pending. `ps` rather
      # than `kill -0` for liveness: the child runs as root under sudo,
      # so `kill -0` from the runner user would report EPERM instead of
      # "alive".
      - name: Ensure Platforms Are Installed
        timeout-minutes: 35
        if: ${{ !cancelled() && steps.xcode-26-2.outcome == 'success' }}
        env:
          DEADLINE_SECONDS: '900'
        run: |
          download() {
            sudo xcodebuild -downloadPlatform "$1" &
            local pid=$!
            local waited=0
            while ps -p "$pid" > /dev/null 2>&1; do
              if [ "$waited" -ge "$DEADLINE_SECONDS" ]; then
                echo "::warning::$1 download exceeded ${DEADLINE_SECONDS}s; stopping it"
                sudo kill "$pid" 2> /dev/null || true
                wait "$pid" 2> /dev/null || true
                return 1
              fi
              sleep 15
              waited=$((waited + 15))
            done
            wait "$pid"
          }
          # A runtime that cannot be installed fails only its own platform's build below.
          for pair in iOS:iphonesimulator tvOS:appletvsimulator watchOS:watchsimulator visionOS:xrsimulator; do
            runtime=${pair%%:*}
            version=$(xcrun --sdk "${pair##*:}" --show-sdk-version)
            if xcrun simctl list runtimes | grep -q "^$runtime $version "; then
              echo "$runtime $version runtime is installed on this image."
              continue
            fi
            echo "::warning::$runtime $version runtime is not on this image; downloading it. The job still passes, just more slowly."
            if ! xcrun xcodebuild -checkFirstLaunchStatus > /dev/null 2>&1; then
              sudo xcodebuild -runFirstLaunch
            fi
            download "$runtime" || download "$runtime" || echo "::warning::$runtime $version could not be downloaded."
          done
      - name: Build Framework (generic/platform=ios)
        if: ${{ !cancelled() && steps.xcode-26-2.outcome == 'success' }}
        timeout-minutes: 14
        run: xcrun xcodebuild -skipMacroValidation -skipPackagePluginValidation build -scheme SafeDI-Package -destination generic/platform=ios -clonedSourcePackagesDirPath "$RUNNER_TEMP/xcode-packages" -derivedDataPath "$RUNNER_TEMP/framework-xcode-26.2"
      # Reuses the host tools and macros the iOS step built (2.3 minutes at
      # most over ten runs); after an iOS failure it builds them itself, as
      # long as iOS's 4.7, so the limit is about twice that.
      - name: Build Framework (generic/platform=tvos)
        if: ${{ !cancelled() && steps.xcode-26-2.outcome == 'success' }}
        timeout-minutes: 10
        run: xcrun xcodebuild -skipMacroValidation -skipPackagePluginValidation build -scheme SafeDI-Package -destination generic/platform=tvos -clonedSourcePackagesDirPath "$RUNNER_TEMP/xcode-packages" -derivedDataPath "$RUNNER_TEMP/framework-xcode-26.2"
      - name: Build Framework (generic/platform=watchos)
        if: ${{ !cancelled() && steps.xcode-26-2.outcome == 'success' }}
        timeout-minutes: 14
        run: xcrun xcodebuild -skipMacroValidation -skipPackagePluginValidation build -scheme SafeDI-Package -destination generic/platform=watchos -clonedSourcePackagesDirPath "$RUNNER_TEMP/xcode-packages" -derivedDataPath "$RUNNER_TEMP/framework-xcode-26.2"
      # Reuses the host tools and macros the iOS step built (2.3 minutes at
      # most over ten runs); after an iOS failure it builds them itself, as
      # long as iOS's 4.7, so the limit is about twice that.
      - name: Build Framework (generic/platform=visionos)
        if: ${{ !cancelled() && steps.xcode-26-2.outcome == 'success' }}
        timeout-minutes: 10
        run: xcrun xcodebuild -skipMacroValidation -skipPackagePluginValidation build -scheme SafeDI-Package -destination generic/platform=visionos -clonedSourcePackagesDirPath "$RUNNER_TEMP/xcode-packages" -derivedDataPath "$RUNNER_TEMP/framework-xcode-26.2"
      - name: Report Free Disk Space
        if: ${{ !cancelled() }}
        run: df -h /
      # The Xcode project examples declare package traits in their .xcodeproj (`traits = (…)`), which needs Xcode
      # 26.4, the first Xcode that surfaces traits in the project file, so their steps select it and come last.
      - name: Select Xcode 26.4
        id: xcode-26-4
        if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && needs.changes.outputs.source != 'false' }}
        run: sudo xcode-select --switch /Applications/Xcode_26.4.app/Contents/Developer
      - name: Resolve Project Integration Package Dependencies
        timeout-minutes: 15
        id: project-1
        if: ${{ !cancelled() && steps.xcode-26-4.outcome == 'success' }}
        uses: ./.github/actions/retry
        with:
          command: (cd Examples/ExampleProjectIntegration && xcrun xcodebuild -resolvePackageDependencies -skipPackagePluginValidation -skipMacroValidation -scheme ExampleProjectIntegration)
      # `EventLogger.swift` declares a different `@Instantiable` under
      # `#if DEBUG` and `#else`. Xcode runs the plugin's command through a
      # shell script that expands the target's
      # `SWIFT_ACTIVE_COMPILATION_CONDITIONS`, which defines `DEBUG` only in
      # the Debug configuration, so the generated file must wire
      # `ConsoleEventLogger` in Debug and `DisabledEventLogger` in Release.
      # Each configuration builds into its own DerivedData directory, so
      # neither grep can read the other build's generated file.
      - name: Build Project Integration
        timeout-minutes: 6
        id: project-2
        if: ${{ !cancelled() && steps.project-1.outcome == 'success' }}
        run: |
          pushd Examples/ExampleProjectIntegration
          xcrun xcodebuild build -skipPackagePluginValidation -skipMacroValidation -scheme ExampleProjectIntegration -derivedDataPath "$RUNNER_TEMP/project-debug"
          popd
          grep -q "ConsoleEventLogger()" "$(find "$RUNNER_TEMP/project-debug/Build/Intermediates.noindex/BuildToolPluginIntermediates" -path "*/SafeDIOutput/NotesApp+SafeDI.swift")"
      - name: Build Project Integration in release configuration
        timeout-minutes: 7
        id: project-3
        if: ${{ !cancelled() && steps.project-2.outcome == 'success' }}
        run: |
          pushd Examples/ExampleProjectIntegration
          xcrun xcodebuild build -skipPackagePluginValidation -skipMacroValidation -scheme ExampleProjectIntegration -configuration Release -derivedDataPath "$RUNNER_TEMP/project-release" SWIFT_OPTIMIZATION_LEVEL=-Onone SWIFT_COMPILATION_MODE=singlefile GCC_OPTIMIZATION_LEVEL=0 ONLY_ACTIVE_ARCH=YES
          popd
          grep -q "DisabledEventLogger()" "$(find "$RUNNER_TEMP/project-release/Build/Intermediates.noindex/BuildToolPluginIntermediates" -path "*/SafeDIOutput/NotesApp+SafeDI.swift")"
      - name: Resolve Multi Project Package Dependencies
        timeout-minutes: 15
        id: multi-project-1
        if: ${{ !cancelled() && steps.xcode-26-4.outcome == 'success' }}
        uses: ./.github/actions/retry
        with:
          command: (cd Examples/ExampleMultiProjectIntegration && xcrun xcodebuild -resolvePackageDependencies -skipPackagePluginValidation -skipMacroValidation -scheme ExampleMultiProjectIntegration)
      - name: Build Multi Project Integration
        timeout-minutes: 7
        id: multi-project-2
        if: ${{ !cancelled() && steps.multi-project-1.outcome == 'success' }}
        run: pushd Examples/ExampleMultiProjectIntegration; xcrun xcodebuild build -skipPackagePluginValidation -skipMacroValidation -scheme ExampleMultiProjectIntegration; popd
      # For main's run after the merge, which skips this job when it finds the record ("Find Builds a Pull Request
      # Passed on This Tree"). Only when every step passed and every cache restored was an exact hit, so that a
      # run with a stale cache leaves main to run the job and save it. A one-line file: uploads of files this
      # small took 1 and 2 seconds in run 44678862998, a minute is the shortest limit, and neither step can
      # fail the job.
      - name: Record That This Tree Passed
        id: passed-record
        if: ${{ success() && needs.stack-position.outputs.stacked-under == '' && github.event_name == 'pull_request' && needs.passed-on-this-tree.outputs.tree != '' && needs.changes.outputs.source != 'false' && steps.docc-cache.outputs.cache-hit == 'true' && steps.packages-cache.outputs.cache-hit == 'true' }}
        continue-on-error: true
        env:
          TREE: ${{ needs.passed-on-this-tree.outputs.tree }}
        run: printf '%s\n' "$TREE" > "$RUNNER_TEMP/passed-tree.txt"
      - name: Upload the Record That This Tree Passed
        if: ${{ success() && steps.passed-record.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: passed-apple-platforms-${{ needs.passed-on-this-tree.outputs.tree }}
          path: ${{ runner.temp }}/passed-tree.txt
          retention-days: 3
          overwrite: true

  example-integrations:
    # One job builds the Package, Tuist and Bazel examples, where three jobs did, for the reason "Build for Apple
    # Platforms, DocC and Xcode Projects on Xcode 26" gives. Each example is a group of steps. A group's first
    # step runs whatever the groups before it did, and each later step of the Tuist and Bazel groups runs only
    # when the step before it passed, so a failure names its example and hides no other example.
    #
    # On macOS because the examples build with Xcode's toolchain and xcodebuild, Tuist generates an Xcode
    # workspace, and the Bazel build mirrors BCR's macOS presubmit.
    #
    # Each build's timeout is about twice the longest it took in two runs (43970600091 and 43956636767), in
    # seconds: Package Integration's seven builds 198, 220, 158, 145, 185, 125 and 219; Tuist's builds 130 and
    # 92. A step the retry action runs gets more, because the action waits up to 465 seconds between its six
    # attempts: Package Integration's resolve took 31, and Tuist's two installs under 15 and 40, and each gets
    # 15 minutes; Bazel's two builds took 153 and 359 with its caches restored and build swift-syntax when the
    # cache misses, and get 30; its build in opt mode took under 15 and gets 20. Bazel's other steps took under
    # 15.
    #
    # The price of one job: a step that fails on a flake is run again by running the whole job again, about 35
    # minutes, where its own job took 5 to 21.
    name: Build Package, Tuist and Bazel Integrations on Xcode 26
    needs: *after-the-long-macos-job-queues
    # Skips when the change feeds nothing it builds ("Detect Changed Files"), and on main when a pull request's
    # run passed it on the same tree ("Find Builds a Pull Request Passed on This Tree").
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && !(github.event_name == 'push' && needs.passed-on-this-tree.outputs.example-integrations == 'true') && needs.changes.outputs.source != 'false' && needs.changes.outputs.integrations != 'false' }}
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Select Xcode Version
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
      # For the reason "Build and Test on Xcode 26" gives: the three native
      # builds below start from scratch directories an earlier run on main
      # saved, and reuse only what was built from files with the same times.
      - name: Stamp Source Times
        run: .github/scripts/stamp-source-times.sh
      - name: Read Runner Image Version
        id: runner-image
        run: echo "version=${ImageVersion:-$(sw_vers -buildVersion)}" >> "$GITHUB_OUTPUT"
      # Package Integration.
      - name: Resolve Package Dependencies
        timeout-minutes: 15
        uses: ./.github/actions/retry
        with:
          command: xcrun swift package resolve --package-path "Examples/Example Package Integration"
      # `EventLogger.swift` in RootModule declares a different `@Instantiable`
      # under `#if DEBUG` and `#else`, so each build below greps the generated
      # file for the logger its configuration must wire. SafeDI learns whether
      # `DEBUG` is active in one of two ways. A build system that expands the
      # build-setting references the plugin puts in its command's arguments
      # hands SafeDITool the conditions the compiler receives. Otherwise
      # SafeDITool falls back to the conditions the plugin reads from
      # Package.swift, which is why the example declares
      # `.define("DEBUG", .when(configuration: .debug))`. Builds that matter
      # for that question run verbosely, and
      # `.github/scripts/report-build-setting-arguments.sh` prints the generate
      # command from the log, which SafeDITool it ran, and whether the
      # arguments arrived expanded or unexpanded; it fails the step when the
      # command does not carry them at all. Every build uses its own scratch or
      # DerivedData directory, so no step can read a file a previous step
      # generated, and every step runs even when an earlier one failed, so one
      # broken expectation does not hide the others. The three builds with
      # SwiftPM's native backend start from the scratch directories a run on
      # main saved ("Restore the Native Builds' Scratch Directories" below),
      # because each otherwise compiles swift-syntax and SafeDI from nothing,
      # and the native backend plans a build the same way from a restored
      # directory as from an empty one. Each of the three deletes the
      # restored directory's plugin outputs first, so that the generate
      # command runs in this build and the file its `grep` reads is one this
      # build generated. The two xcodebuild builds start from restored
      # DerivedData the same way: Xcode plans a package's build with the
      # plugin's in-process fallback whether DerivedData is empty or not. The
      # Swift Build builds start empty: Swift Build runs the plugin's
      # fallback only on a build from nothing. Release builds turn
      # optimization off because only the configuration matters here, and an
      # optimized build of swift-syntax takes several times longer.
      # One entry for the three directories, keyed without the commit and
      # saved only by a run on main that restored none: what a build reuses
      # from it is mostly swift-syntax, which changes with Package.resolved,
      # and a build of SafeDI's own targets from an older commit costs only
      # the targets whose files differ. That cost grows with every change to
      # SafeDI's sources until the key changes, so a build that is slower in
      # an entry's second week is the entry's age, not a broken cache. The
      # key names the runner image for the reason "Build and Test on Xcode
      # 26" gives; "Delete Older Build Directories" deletes the entry of the
      # image or Package.resolved before.
      - name: Restore the Native Builds' Scratch Directories
        id: native-scratch
        if: ${{ needs.stack-position.outputs.clean-build != 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/native-debug
            ${{ runner.temp }}/native-release
            ${{ runner.temp }}/native-without-define
          key: example-native-scratch-v1-macOS-xcode-26.0-${{ steps.runner-image.outputs.version }}-${{ hashFiles('Package.resolved', 'Examples/Example Package Integration/Package.resolved', 'Examples/Example Package Integration/Package.swift') }}
      # As the entry above, for the two xcodebuild builds, which took 141
      # seconds from nothing and 12 from DerivedData kept through a fresh
      # stamped checkout and a tar round trip (run 44203313851).
      - name: Restore the xcodebuild Builds' DerivedData
        id: xcodebuild-derived-data
        if: ${{ needs.stack-position.outputs.clean-build != 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/xcodebuild-debug
            ${{ runner.temp }}/xcodebuild-release
          key: example-xcodebuild-derived-data-v1-macOS-xcode-26.0-${{ steps.runner-image.outputs.version }}-${{ hashFiles('Package.resolved', 'Examples/Example Package Integration/Package.resolved', 'Examples/Example Package Integration/Package.swift') }}
      - name: Report swift build Backends
        id: backends
        run: |
          xcrun swift build --help | grep -A 3 -- '--build-system'
          if xcrun swift build --help | grep -q 'swiftbuild'; then
            echo "swiftbuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "swiftbuild=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This toolchain's swift build offers no swiftbuild backend; only the native backend is built."
          fi
          if xcrun swift build --help | grep -Eq 'default: swiftbuild|swiftbuild .*\(default\)'; then
            echo "swiftbuild_is_default=true" >> "$GITHUB_OUTPUT"
          else
            echo "swiftbuild_is_default=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Package Integration (swift build, native backend)
        id: native-debug
        timeout-minutes: 7
        if: ${{ !cancelled() }}
        run: |
          rm -rf "$RUNNER_TEMP/native-debug/plugins/outputs"
          xcrun swift build --build-system native --scratch-path "$RUNNER_TEMP/native-debug" --package-path "Examples/Example Package Integration"
          grep -q "ConsoleEventLogger()" "$(find "$RUNNER_TEMP/native-debug/plugins/outputs" -path "*/RootModule/*/SafeDIOutput/Root+SafeDI.swift")"
      # Twice the longest of ten runs, 5.5 minutes (run 44034763455; the
      # median was 3.9).
      - name: Build Package Integration in release configuration (swift build, native backend)
        id: native-release
        timeout-minutes: 11
        if: ${{ !cancelled() }}
        run: |
          rm -rf "$RUNNER_TEMP/native-release/plugins/outputs"
          xcrun swift build --build-system native -c release -Xswiftc -Onone --scratch-path "$RUNNER_TEMP/native-release" --package-path "Examples/Example Package Integration"
          grep -q "DisabledEventLogger()" "$(find "$RUNNER_TEMP/native-release/plugins/outputs" -path "*/RootModule/*/SafeDIOutput/Root+SafeDI.swift")"
      # Xcode builds a package's source-built SafeDITool under a path with
      # unexpanded build settings, so the plugin cannot run it while planning
      # and uses its in-process PluginScanner fallback, which `swift build`
      # doesn't. Xcode must expand the build-setting arguments: in Release, the
      # plugin reads `DEBUG` from Package.swift anyway, because Xcode evaluates
      # a package's `.when(configuration:)` defines as for a debug build, and
      # only the build settings let SafeDITool wire `DisabledEventLogger`.
      # The limit is twice the longest of ten runs, 3.6 minutes (run
      # 44041978606).
      - name: Build Package Integration (xcodebuild)
        id: xcodebuild-debug
        timeout-minutes: 8
        if: ${{ !cancelled() }}
        run: |
          log="$RUNNER_TEMP/xcodebuild-debug.log"
          status=0
          rm -rf "$RUNNER_TEMP/xcodebuild-debug/Build/Intermediates.noindex/BuildToolPluginIntermediates"
          pushd "Examples/Example Package Integration"
          xcrun xcodebuild build -skipPackagePluginValidation -skipMacroValidation -scheme ExamplePackageIntegration -destination "platform=macOS" -derivedDataPath "$RUNNER_TEMP/xcodebuild-debug" > "$log" 2>&1 || status=$?
          popd
          arguments=$(.github/scripts/report-build-setting-arguments.sh "$log")
          echo "Build-setting arguments: $arguments; build exit status: $status"
          [ "$status" -eq 0 ] || { tail -n 100 "$log"; exit 1; }
          [ "$arguments" = expanded ]
          grep -q "ConsoleEventLogger()" "$(find "$RUNNER_TEMP/xcodebuild-debug/Build/Intermediates.noindex/BuildToolPluginIntermediates" -path "*/RootModule/SafeDIGenerator/SafeDIOutput/Root+SafeDI.swift")"
      # Twice the longest of ten runs, 3.4 minutes (run 44041978606; the
      # median was 2.4).
      - name: Build Package Integration in release configuration (xcodebuild)
        id: xcodebuild-release
        timeout-minutes: 7
        if: ${{ !cancelled() }}
        run: |
          log="$RUNNER_TEMP/xcodebuild-release.log"
          status=0
          rm -rf "$RUNNER_TEMP/xcodebuild-release/Build/Intermediates.noindex/BuildToolPluginIntermediates"
          pushd "Examples/Example Package Integration"
          xcrun xcodebuild build -skipPackagePluginValidation -skipMacroValidation -scheme ExamplePackageIntegration -configuration Release -destination "platform=macOS" -derivedDataPath "$RUNNER_TEMP/xcodebuild-release" SWIFT_OPTIMIZATION_LEVEL=-Onone SWIFT_COMPILATION_MODE=singlefile GCC_OPTIMIZATION_LEVEL=0 ONLY_ACTIVE_ARCH=YES > "$log" 2>&1 || status=$?
          popd
          arguments=$(.github/scripts/report-build-setting-arguments.sh "$log")
          echo "Build-setting arguments: $arguments; build exit status: $status"
          [ "$status" -eq 0 ] || { tail -n 100 "$log"; exit 1; }
          [ "$arguments" = expanded ]
          grep -q "DisabledEventLogger()" "$(find "$RUNNER_TEMP/xcodebuild-release/Build/Intermediates.noindex/BuildToolPluginIntermediates" -path "*/RootModule/SafeDIGenerator/SafeDIOutput/Root+SafeDI.swift")"
      - name: Save the xcodebuild Builds' DerivedData
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.xcodebuild-derived-data.outputs.cache-hit != 'true' && steps.xcodebuild-debug.outcome == 'success' && steps.xcodebuild-release.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/xcodebuild-debug
            ${{ runner.temp }}/xcodebuild-release
          key: ${{ steps.xcodebuild-derived-data.outputs.cache-primary-key }}
      # A copy of the example without its `DEBUG` define shows which builds
      # read the conditions from the build settings: those must still wire
      # the right logger, and a build that passes the arguments through
      # unexpanded must stop at SafeDI's compile-time assertion, as the
      # Manual documents. The copy keeps the checkout's stamped times (`-p`),
      # and its rewritten manifest gets a fixed one, so that the native
      # build of the copy reuses a restored scratch directory too.
      - name: Prepare Package Integration without the DEBUG define
        id: prepare
        if: ${{ !cancelled() }}
        run: |
          copy="$RUNNER_TEMP/PackageIntegrationWithoutDebugDefine"
          rm -rf "$copy"
          cp -Rp "Examples/Example Package Integration" "$copy"
          rm -rf "$copy/.build"
          sed -i '' \
            -e "s|\.package(path: \"\.\./\.\./\"|.package(path: \"$GITHUB_WORKSPACE\"|" \
            -e '/\.define("DEBUG", \.when(configuration: \.debug)),/d' \
            "$copy/Package.swift"
          TZ=UTC touch -t 200001010000.00 "$copy/Package.swift"
          grep -q "package(path: \"$GITHUB_WORKSPACE\"" "$copy/Package.swift"
          if grep -q '\.define("DEBUG"' "$copy/Package.swift"; then
            echo "The DEBUG define is still in $copy/Package.swift." >&2
            exit 1
          fi
      - name: Build Package Integration without the DEBUG define (swift build, native backend, expects the assertion)
        id: native-without-define
        timeout-minutes: 7
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          log="$RUNNER_TEMP/native-without-define.log"
          rm -rf "$RUNNER_TEMP/native-without-define/plugins/outputs"
          if xcrun swift build --build-system native -v --scratch-path "$RUNNER_TEMP/native-without-define" --package-path "$RUNNER_TEMP/PackageIntegrationWithoutDebugDefine" > "$log" 2>&1; then
            echo "Expected the native backend to stop at SafeDI's compile-time assertion without the DEBUG define, but the build succeeded." >&2
            exit 1
          fi
          arguments=$(.github/scripts/report-build-setting-arguments.sh "$log")
          echo "Build-setting arguments: $arguments"
          [ "$arguments" = unexpanded ] || { echo "::error::Expected the native backend to pass the build-setting arguments through unexpanded." >&2; exit 1; }
          grep -q 'SafeDI scanned this module assuming `#if DEBUG` was inactive, but it is active in this compilation' "$log" || { tail -n 100 "$log"; exit 1; }
      # Saved only when all three builds went as expected, so that the entry
      # every later run starts from holds three whole builds.
      - name: Save the Native Builds' Scratch Directories
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.native-scratch.outputs.cache-hit != 'true' && steps.native-debug.outcome == 'success' && steps.native-release.outcome == 'success' && steps.native-without-define.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/native-debug
            ${{ runner.temp }}/native-release
            ${{ runner.temp }}/native-without-define
          key: ${{ steps.native-scratch.outputs.cache-primary-key }}
      # The debug build's expectation follows what the log shows. Expanded
      # arguments must wire `ConsoleEventLogger`. Arguments that arrive
      # unexpanded must fall back to the assertion, as on the native backend,
      # and a toolchain whose default backend is swiftbuild must expand them.
      # Swift 6.2 sometimes hands the plugin the prebuilt binary from the
      # artifact bundle despite the `sourceBuild` trait; that release accepts
      # the arguments too, so the expectations hold whichever binary ran, and
      # the report names it.
      - name: Build Package Integration without the DEBUG define (swift build, Swift Build backend)
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.backends.outputs.swiftbuild == 'true' }}
        env:
          SWIFTBUILD_IS_DEFAULT: ${{ steps.backends.outputs.swiftbuild_is_default }}
        run: |
          log="$RUNNER_TEMP/swiftbuild-debug.log"
          status=0
          xcrun swift build --build-system swiftbuild -v --scratch-path "$RUNNER_TEMP/swiftbuild-debug" --package-path "$RUNNER_TEMP/PackageIntegrationWithoutDebugDefine" > "$log" 2>&1 || status=$?
          arguments=$(.github/scripts/report-build-setting-arguments.sh "$log")
          echo "Build-setting arguments: $arguments; build exit status: $status"
          case "$arguments" in
            expanded)
              [ "$status" -eq 0 ] || { tail -n 100 "$log"; exit 1; }
              grep -q "ConsoleEventLogger()" "$(find "$RUNNER_TEMP/swiftbuild-debug/plugins/outputs" -path "*/RootModule/*/SafeDIOutput/Root+SafeDI.swift")"
              ;;
            unexpanded)
              if [ "$SWIFTBUILD_IS_DEFAULT" = true ]; then
                echo "::error::This toolchain's default swiftbuild backend passed the build-setting arguments through unexpanded." >&2
                exit 1
              else
                echo "::notice::This toolchain's opt-in swiftbuild backend passes build tool plugin arguments through unexpanded, so SafeDITool falls back as on the native backend."
              fi
              [ "$status" -ne 0 ] || { echo "Expected the fallback to stop at SafeDI's compile-time assertion, but the build succeeded." >&2; exit 1; }
              grep -q 'SafeDI scanned this module assuming `#if DEBUG` was inactive, but it is active in this compilation' "$log" || { tail -n 100 "$log"; exit 1; }
              ;;
          esac
      - name: Build Package Integration without the DEBUG define in release configuration (swift build, Swift Build backend)
        timeout-minutes: 8
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.backends.outputs.swiftbuild == 'true' }}
        env:
          SWIFTBUILD_IS_DEFAULT: ${{ steps.backends.outputs.swiftbuild_is_default }}
        run: |
          log="$RUNNER_TEMP/swiftbuild-release.log"
          xcrun swift build --build-system swiftbuild -v -c release -Xswiftc -Onone --scratch-path "$RUNNER_TEMP/swiftbuild-release" --package-path "$RUNNER_TEMP/PackageIntegrationWithoutDebugDefine" > "$log" 2>&1 || { tail -n 100 "$log"; exit 1; }
          arguments=$(.github/scripts/report-build-setting-arguments.sh "$log")
          echo "Build-setting arguments: $arguments"
          if [ "$SWIFTBUILD_IS_DEFAULT" = true ] && [ "$arguments" != expanded ]; then
            echo "::error::This toolchain's default swiftbuild backend passed the build-setting arguments through unexpanded." >&2
            exit 1
          fi
          grep -q "DisabledEventLogger()" "$(find "$RUNNER_TEMP/swiftbuild-release/plugins/outputs" -path "*/RootModule/*/SafeDIOutput/Root+SafeDI.swift")"
      - name: Report Free Disk Space
        if: ${{ !cancelled() }}
        run: df -h /
      # Tuist Integration. Its first three steps read the token so that mise and tuist install don't hit
      # anonymous GitHub API rate limits when resolving release tags and artifact bundles.
      - name: Install Tuist via mise
        timeout-minutes: 15
        id: tuist-1
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Keep the pinned Tuist version here in sync with the README. In the retry wrapper because it
        # downloads mise and Tuist; kept on one line, as the retry action needs. The two paths are added
        # after the installs pass, so a retry adds them once.
        uses: ./.github/actions/retry
        with:
          command: curl -fsSL https://mise.run | sh && "$HOME/.local/bin/mise" install -y tuist@4.183.0 && "$HOME/.local/bin/mise" use -g tuist@4.183.0 && echo "$HOME/.local/bin" >> "$GITHUB_PATH" && echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
      - name: Tuist Install
        timeout-minutes: 15
        id: tuist-2
        if: ${{ !cancelled() && steps.tuist-1.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # In the retry wrapper because it downloads the workspace's packages. In a subshell so that the
        # `cd` does not carry into a retry.
        uses: ./.github/actions/retry
        with:
          command: (cd Examples/ExampleTuistIntegration && tuist install)
      - name: Tuist Generate
        timeout-minutes: 3
        id: tuist-3
        if: ${{ !cancelled() && steps.tuist-2.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pushd Examples/ExampleTuistIntegration && tuist generate --no-open && popd
      # The `Subproject` framework's project is in `Projects/Subproject`, a
      # subdirectory of the workspace, so the plugin's script must find
      # `SafeDITool` above its `$SRCROOT`, in the directory that holds
      # `Tuist/Package.swift`, or the build below fails at the framework.
      #
      # `EventLogger.swift` in the app target declares a different
      # `@Instantiable` under `#if DEBUG` and `#else`. If the plugin did not
      # forward the target's build settings, SafeDI would wire
      # `DisabledEventLogger` and the generated compile-time assertion would
      # fail this build; the grep makes the check explicit.
      - name: Build Tuist Integration
        timeout-minutes: 5
        id: tuist-4
        if: ${{ !cancelled() && steps.tuist-3.outcome == 'success' }}
        run: |
          pushd Examples/ExampleTuistIntegration
          xcrun xcodebuild build -skipPackagePluginValidation -skipMacroValidation -workspace ExampleTuistIntegration.xcworkspace -scheme ExampleTuistIntegration -derivedDataPath DerivedData
          grep -q "ConsoleEventLogger()" "$(find DerivedData/Build/Intermediates.noindex -path "*/Debug/ExampleTuistIntegration.build/DerivedSources/SafeDIGenerated.swift")"
          popd
      # The Release configuration does not define `DEBUG`, so the generated
      # file must wire `DisabledEventLogger`. Optimization is turned off and
      # only the active architecture is built because only the configuration
      # matters here.
      - name: Build Tuist Integration in release configuration
        timeout-minutes: 4
        id: tuist-5
        if: ${{ !cancelled() && steps.tuist-4.outcome == 'success' }}
        run: |
          pushd Examples/ExampleTuistIntegration
          xcrun xcodebuild build -skipPackagePluginValidation -skipMacroValidation -workspace ExampleTuistIntegration.xcworkspace -scheme ExampleTuistIntegration -configuration Release -derivedDataPath DerivedData SWIFT_OPTIMIZATION_LEVEL=-Onone SWIFT_COMPILATION_MODE=singlefile GCC_OPTIMIZATION_LEVEL=0 ONLY_ACTIVE_ARCH=YES
          grep -q "DisabledEventLogger()" "$(find DerivedData/Build/Intermediates.noindex -path "*/Release/ExampleTuistIntegration.build/DerivedSources/SafeDIGenerated.swift")"
          popd
      - name: Report Free Disk Space
        if: ${{ !cancelled() }}
        run: df -h /
      # Bazel.
      # General bazel sanity check on every PR. We can't perfectly
      # mirror BCR's presubmit (https://registry.bazel.build/modules/safedi):
      # BazelCI's BuildKite infrastructure is closed to non-`bazelbuild`
      # projects (https://github.com/bazelbuild/continuous-integration/blob/main/.github/ISSUE_TEMPLATE/adding-your-project-to-bazel-ci.md),
      # and any GH Actions runner we pick differs from BCR's image in
      # ways we can't fully control (CC toolchain auto-detection,
      # SDK-vs-runner-OS gap, exact Bazel point release). So treat BCR
      # as the canonical macOS-on-older-OS check; this job catches
      # general regressions before we publish.
      #
      # Keep `build_targets` aligned with `.bcr/presubmit.yml` so a
      # divergence is visible in review. If you change BCR's task list,
      # update this job too. BCR builds the example against the published
      # source archive with `prefer_prebuilt_safeditool` both true and
      # false; this job builds it against the checkout, which has no
      # prebuilt toolchain, so it runs SafeDITool built from source.
      #
      # Pinned to Xcode 26.0 — matches BCR's `macos_arm64` runner
      # platform defined at https://github.com/bazelbuild/continuous-integration/blob/master/buildkite/bazelci.py
      # Bazel's disk and repository caches are content-addressed, so
      # restoring them reuses the outputs of identical actions (above
      # all the swift-syntax compiles) without changing what gets built.
      # Both builds below point at the same caches, so the downstream
      # example's exec-config swift-syntax is a hit even on a run where
      # nothing was restored. The flags live on the command lines rather
      # than in `.bazelrc` so BCR's presubmit keeps building with
      # SafeDI's committed defaults.
      - name: Cache Bazel
        id: bazel-1
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repository
          key: bazel-${{ runner.os }}-xcode-26.0-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'Examples/ExampleBazelIntegration/MODULE.bazel', 'Examples/ExampleBazelIntegration/MODULE.bazel.lock') }}
          restore-keys: |
            bazel-${{ runner.os }}-xcode-26.0-
      # Wrapping `bazelisk build` in retry — not just dependency
      # resolution, like the SPM jobs above — because Bazel resolves
      # external repos lazily during the build itself. There's no
      # equivalent to `swift package resolve` we could isolate; a
      # transient HTTP failure (e.g. on a `rules_swift` transitive
      # like `MobileNativeFoundation/index-import`) surfaces as a
      # build failure. Bazel caches successful downloads, so a retry
      # after a flake is cheap.
      #
      # Each command runs in a subshell so a `cd` for the example
      # build doesn't leak its cwd change into subsequent retries.
      - name: Build SafeDI targets (mirrors BCR `verify_safedi_build`)
        timeout-minutes: 30
        id: bazel-2
        if: ${{ !cancelled() && steps.bazel-1.outcome == 'success' }}
        uses: ./.github/actions/retry
        with:
          # Kept on one line — the retry composite action splices
          # `${{ inputs.command }}` directly into a bash `for` loop
          # and tacks ` && break` onto the same source line, so a
          # multi-line YAML command leaves `&& break` orphaned.
          command: bazelisk build --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repository" //Sources/SafeDI:SafeDI //Sources/SafeDICore:SafeDICore //Sources/SafeDIMacros:SafeDIMacros //Sources/SafeDITool:SafeDITool //bazel:safedi
      - name: Build downstream example (mirrors BCR `bcr_test_module.build_example`)
        timeout-minutes: 30
        id: bazel-3
        if: ${{ !cancelled() && steps.bazel-2.outcome == 'success' }}
        uses: ./.github/actions/retry
        with:
          command: (cd Examples/ExampleBazelIntegration && bazelisk build --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repository" //Subproject:Subproject //ExampleBazelIntegration:ExampleBazelIntegration)
      # The example takes SafeDI from this checkout, whose
      # `bazel/private/prebuilt_safeditool.bzl` names no prebuilt
      # SafeDITool, so every SafeDI action must run the SafeDITool built
      # from the checkout: a release's prebuilt binary may not accept the
      # options this checkout's rule passes. A prebuilt binary's path is
      # under the `safeditool` extension's repository instead. Kept out of
      # the retry wrapper: the build above fetched everything the query
      # reads, and a wrong tool is deterministic, not a flake.
      - name: Verify the example ran the SafeDITool built from this checkout
        timeout-minutes: 3
        id: bazel-4
        if: ${{ !cancelled() && steps.bazel-3.outcome == 'success' }}
        working-directory: Examples/ExampleBazelIntegration
        run: |
          executables=$(bazelisk aquery --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repository" --output=jsonproto 'mnemonic("SafeDI", deps(//ExampleBazelIntegration:ExampleBazelIntegration))' | jq -r '.actions[].arguments[0]')
          echo "The example's SafeDI actions run:"
          echo "$executables"
          if [ -z "$executables" ]; then
            echo "::error::Found no SafeDI action in the example; the query in this step is out of date."
            exit 1
          fi
          if grep -v -E '^bazel-out/[^/]+/bin/external/safedi\+/Sources/SafeDITool/SafeDITool$' <<< "$executables"; then
            echo "::error::The example ran a SafeDITool other than //Sources/SafeDITool:SafeDITool built from this checkout."
            exit 1
          fi
      # `bazel run @safedi//:SafeDITool` runs SafeDITool in the
      # directory it is run from, so a relative path among its arguments
      # resolves there rather than in the runfiles tree. Run from a
      # subdirectory of the workspace, as a user may. No target outputs a
      # `.safedi` file at the top level, so Bazel writes one to bazel-bin
      # from the disk cache only when `--remote_download_regex` asks for
      # it, with the positions file beside it that `query` and `dump`
      # read lines from. Kept out of the retry wrapper: the build above
      # fetched everything this runs.
      - name: Run SafeDITool through bazel run with a relative path
        timeout-minutes: 5
        id: bazel-5
        if: ${{ !cancelled() && steps.bazel-4.outcome == 'success' }}
        working-directory: Examples/ExampleBazelIntegration/Subproject
        run: |
          bazelisk build --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repository" '--remote_download_regex=.*\.safedi(positions)?$' //Subproject:Subproject
          test -f ../bazel-bin/Subproject/Subproject_safedi.safedipositions
          bazelisk run --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repository" @safedi//:SafeDITool -- dump ../bazel-bin/Subproject/Subproject_safedi.safedi > /dev/null
          bazelisk run --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repository" @safedi//:SafeDITool -- query needs TitleFormatter --module-info ../bazel-bin/Subproject/Subproject_safedi.safedi > /dev/null
      # Optimized builds define `NDEBUG` and no `DEBUG`, so the rule must report the
      # former, withhold the latter, and SafeDI must wire the example's
      # `#elseif NDEBUG` logger. The `_safedi` target is listed so
      # Bazel writes its output to bazel-bin even when every action is a cache hit.
      - name: Build downstream example in opt mode
        timeout-minutes: 20
        id: bazel-6
        if: ${{ !cancelled() && steps.bazel-5.outcome == 'success' }}
        uses: ./.github/actions/retry
        with:
          command: (cd Examples/ExampleBazelIntegration && bazelisk build --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repository" -c opt //ExampleBazelIntegration:ExampleBazelIntegration //ExampleBazelIntegration:ExampleBazelIntegration_safedi)
      # Saved here, not when the job ends, so that an unrelated step that fails later loses no cache.
      - name: Save Bazel Cache
        if: ${{ !cancelled() && steps.bazel-1.outputs.cache-hit != 'true' && steps.bazel-6.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repository
          key: ${{ steps.bazel-1.outputs.cache-primary-key }}
      # Kept out of the retry wrapper: a missing logger is deterministic, not a flake.
      - name: Verify opt mode wired the `#elseif NDEBUG` logger
        id: bazel-7
        if: ${{ !cancelled() && steps.bazel-6.outcome == 'success' }}
        run: grep -q "DisabledEventLogger()" Examples/ExampleBazelIntegration/bazel-bin/ExampleBazelIntegration/ExampleBazelIntegration_safedi.swift
      # A line moved in a lower module, keeping every declaration's order in
      # its file, changes only that module's positions file, which the
      # root's SafeDI action lists as unused, so Bazel's local action cache
      # reruns Subproject's SafeDI action and no other. Each local action
      # cache hit is left out of the execution log; a disk cache hit is in
      # it. Kept out of the retry wrapper: an extra action is deterministic.
      - name: Verify a moved line in Subproject reruns no SafeDI action above it
        timeout-minutes: 10
        id: bazel-8
        if: ${{ !cancelled() && steps.bazel-7.outcome == 'success' }}
        working-directory: Examples/ExampleBazelIntegration
        run: |
          bazelisk build --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repository" //ExampleBazelIntegration:ExampleBazelIntegration_safedi
          cp Subproject/TitleFormatter.swift "$RUNNER_TEMP/TitleFormatter.swift"
          { echo; cat "$RUNNER_TEMP/TitleFormatter.swift"; } > Subproject/TitleFormatter.swift
          bazelisk build --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repository" --execution_log_json_file="$RUNNER_TEMP/moved-line.json" //ExampleBazelIntegration:ExampleBazelIntegration_safedi
          cp "$RUNNER_TEMP/TitleFormatter.swift" Subproject/TitleFormatter.swift
          ran=$(jq -r 'select(.mnemonic == "SafeDI") | .targetLabel' "$RUNNER_TEMP/moved-line.json" | sort -u)
          echo "SafeDI actions the moved line ran: $ran"
          if [ "$ran" != "//Subproject:Subproject_safedi" ]; then
            echo "::error::A line moved in Subproject ran SafeDI actions other than Subproject's own."
            exit 1
          fi
      # For main's run after the merge, which skips this job when it finds the record ("Find Builds a Pull Request
      # Passed on This Tree"). Only when every step passed and every cache restored was an exact hit, so that a
      # run with a stale cache leaves main to run the job and save it. A one-line file: uploads of files this
      # small took 1 and 2 seconds in run 44678862998, a minute is the shortest limit, and neither step can
      # fail the job.
      - name: Record That This Tree Passed
        id: passed-record
        if: ${{ success() && github.event_name == 'pull_request' && needs.passed-on-this-tree.outputs.tree != '' && needs.changes.outputs.source != 'false' && steps.bazel-1.outputs.cache-hit == 'true' }}
        continue-on-error: true
        env:
          TREE: ${{ needs.passed-on-this-tree.outputs.tree }}
        run: printf '%s\n' "$TREE" > "$RUNNER_TEMP/passed-tree.txt"
      - name: Upload the Record That This Tree Passed
        if: ${{ success() && steps.passed-record.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: passed-example-integrations-${{ needs.passed-on-this-tree.outputs.tree }}
          path: ${{ runner.temp }}/passed-tree.txt
          retention-days: 3
          overwrite: true

  # The Xcode 26 tests, as one job when most compile checks passed in an
  # earlier run and as two when few did, which "Choose How the Xcode 26 Tests
  # Run" decides. A run's time is mostly compile checks when none is skipped:
  # main's run 44839883136 skipped all 4,260 and tested for 26.5 minutes after
  # a 16.7-minute build, and run 44843308363, the first of a change to the
  # sources the macro plugin compiles, compiled all 4,287 and tested for 62.7
  # after a 26.5-minute build, 91 minutes on the one runner while the Linux
  # jobs of the same run took 78. Two runners each build, 17 to 27 minutes,
  # so two jobs spend a second runner to no gain when the checks are skipped,
  # and macOS runners are what pull requests queue on: only a run that would
  # compile most checks takes the second.
  #
  # The two parts are every test of the two targets whose tests compile the
  # most, and every other test: the second part skips what the first selects,
  # so no test runs in neither. With every check compiling, Verify's Linux
  # groups took 5.5 minutes for the seams and 5.0 for the mocks, 10.5 of the
  # 19.6 that all seven took (run 43766692766, which verify.yml describes).
  # No run has measured the parts on macOS yet.
  spm-tests:
    name: Build and Test on Xcode 26 (${{ matrix.part }})
    needs: [changes, spm-plan, stack-position]
    # Also runs on every push to main, Markdown-only or not, so the
    # Codecov report behind the README badge always comes from a real
    # test run. It runs when "Choose How the Xcode 26 Tests Run" failed too,
    # as one job.
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && (needs.changes.outputs.source != 'false' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    # Runs on macOS because it builds and tests SafeDI with Xcode's Swift,
    # the compiler adopters use, and compiles every test's generated code
    # with it: Xcode's Swift 6.2 and Linux's have disagreed about the same
    # code (#525; CLAUDE.md's rule on an actor's `lazy var`). It also
    # uploads the `macos` coverage flag that codecov.yml waits for.
    runs-on: macos-26
    permissions:
      contents: read
      # To read the passed compile checks other runs uploaded.
      actions: read
    strategy:
      # A part that fails says nothing about the other's tests.
      fail-fast: false
      matrix:
        # `all`, or `seams-and-mocks` and `the-rest`.
        part: ${{ fromJSON(needs.spm-plan.outputs.parts || '["all"]') }}
    outputs:
      # The same from every part: they build one commit with one compiler.
      compile-check-identity: ${{ steps.compile-check-identity.outputs.identity }}
    env:
      # What the build step passes `swift build --build-tests` and the test
      # step passes `swift test --skip-build`, which the compile check
      # identity below hashes too.
      SWIFT_TEST_ARGUMENTS: -c release --enable-code-coverage -Xswiftc -enable-testing -Xswiftc -Xllvm -Xswiftc -instrprof-atomic-counter-update-all --traits sourceBuild
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Select Xcode Version
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
      # Before anything reads a source's modification time: SwiftPM rebuilds
      # a target whose sources' times differ from the ones it built with,
      # and a checkout gives every file the time of the checkout, so without
      # this a restored build rebuilt every SafeDI target (17.1 minutes in
      # runs 44144477988 and 44153760541, which changed no Swift file and
      # restored the build of their own key).
      - name: Stamp Source Times
        run: .github/scripts/stamp-source-times.sh
      # What the test step adds to `swift test` for this part, and what the
      # part's coverage report says it is a part of, which the line coverage
      # check reads. Before the build, so that a part this step does not know
      # fails in seconds.
      - name: Select the Part's Tests
        id: part
        env:
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            all)
              selection=''
              report_part='1 of 1'
              ;;
            seams-and-mocks)
              selection='--filter ^SafeDIToolSeamTests\. --filter ^SafeDIToolMockTests\.'
              report_part='1 of 2'
              ;;
            the-rest)
              selection='--skip ^SafeDIToolSeamTests\. --skip ^SafeDIToolMockTests\.'
              report_part='2 of 2'
              ;;
            *)
              echo "::error::No part of the Xcode 26 tests is named $PART."
              exit 1
              ;;
          esac
          echo "selection=$selection" >> "$GITHUB_OUTPUT"
          echo "report-part=$report_part" >> "$GITHUB_OUTPUT"
      # GitHub's macOS images export ImageVersion (for example
      # 20261102.0473.1) from ~/.bashrc; it is not in the `env` context, so
      # a step reads it for the cache key below. The OS build stands in if
      # an image ever stops exporting it.
      - name: Read Runner Image Version
        id: runner-image
        run: echo "version=${ImageVersion:-$(sw_vers -buildVersion)}" >> "$GITHUB_OUTPUT"
      # The compiler is hashed with the arguments, since a build is no start
      # for another compiler's. Assigned first, so that a compiler that
      # fails to report its version fails this step.
      - name: Hash Build Arguments
        id: build-arguments
        run: |
          compiler=$(xcrun swift --version 2>&1)
          arguments=$(printf '%s\n%s' "$SWIFT_TEST_ARGUMENTS" "$compiler" | shasum -a 256 | cut -c1-16)
          test "${#arguments}" -eq 16
          echo "hash=$arguments" >> "$GITHUB_OUTPUT"
      # Restoring `.build` carries the build of main's newest commit over:
      # with the sources' times stamped above, SwiftPM rebuilds only the
      # targets whose files differ from that commit's, and what depends on
      # them. The key ends in the commit, so each push to main saves its own
      # build ("Save Build Directory" below) and "Delete Older Build
      # Directories" then removes main's older ones; a key without the
      # commit was never saved again once hit, so the build it held fell
      # further behind main with every landing. The key pins the Xcode
      # version because build products aren't portable across toolchains.
      # The restore-keys prefixes reuse the most recent build of the same
      # arguments, then of other arguments or another Package.resolved,
      # and the incremental build takes it from there. The key holds a
      # hash of the arguments and the compiler's version rather than of
      # this workflow, because every change to the workflow then saved
      # another 580 MB copy. `v2` keeps a build made before the sources
      # were stamped from being restored: SwiftPM would rebuild all of it.
      #
      # The key names the runner image: when runner image 20261102.0473
      # rolled out, every run restored the previous image's cache and
      # rebuilt swift-syntax (~8 min). The first run on a new image
      # restores an older image's cache, builds incrementally, and saves
      # under its own key.
      #
      # Only a run on main saves. A pull request can restore main's caches
      # and its own, never another pull request's, so a copy it saved
      # served only its own later runs, and the repository's caches are
      # evicted, least recently used first, above 10 GB: on 2026-11-17
      # they stood at 9.98 GB, two pull requests each held a 582 MB copy
      # of this build, and PR #765's run 44067580141, on image
      # 20261102.0473.1, found only image 20261112.0504.1's build to
      # restore and built for 23.5 minutes where main's run 44032976346
      # built for 14.1. A pull request builds from main's newest build on
      # every run until it lands.
      - name: Restore Build Directory
        id: build-cache
        if: ${{ needs.stack-position.outputs.clean-build != 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: spm-release-v2-${{ runner.os }}-xcode-26.0-${{ steps.runner-image.outputs.version }}-${{ hashFiles('Package.resolved') }}-${{ steps.build-arguments.outputs.hash }}-${{ github.sha }}
          restore-keys: |
            spm-release-v2-${{ runner.os }}-xcode-26.0-${{ steps.runner-image.outputs.version }}-${{ hashFiles('Package.resolved') }}-${{ steps.build-arguments.outputs.hash }}-
            spm-release-v2-${{ runner.os }}-xcode-26.0-${{ steps.runner-image.outputs.version }}-${{ hashFiles('Package.resolved') }}-
            spm-release-v2-${{ runner.os }}-xcode-26.0-${{ steps.runner-image.outputs.version }}-
            spm-release-v2-${{ runner.os }}-xcode-26.0-
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: xcrun swift package resolve
      # Compile verification skips each check that passed in an earlier
      # run of the same build (PassedCompileCheckCache.swift), which the
      # file SAFEDI_COMPILE_CHECK_PASSED_CACHE names lists. The cache is
      # keyed on what the file's checks were compiled with: SafeDI's
      # runtime and macro sources, the manifest, the verifier, the test
      # arguments, the compiler and the SDK. A change to any of them starts
      # from an empty file. A pull request restores its own branch's latest
      # entry, or its base branch's, never another pull request's. The save
      # runs even when tests fail or the run is cancelled: the file then
      # holds the checks that passed before that.
      - name: Compute Compile Check Identity
        id: compile-check-identity
        run: |
          # Assign first, so a failing script fails this step: inside `echo`, a
          # failed command substitution would write a partial identity, and a
          # partial identity could reuse checks another compiler passed.
          # shellcheck disable=SC2086 # The arguments are words to split.
          identity=$(.github/scripts/compile-check-identity.sh $SWIFT_TEST_ARGUMENTS)
          test "${#identity}" -eq 64
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Restore Passed Compile Checks
        uses: actions/cache/restore@v6
        with:
          path: .compile-check-cache
          key: compile-checks-v1-${{ runner.os }}-${{ steps.compile-check-identity.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compile-checks-v1-${{ runner.os }}-${{ steps.compile-check-identity.outputs.identity }}-
      # And the checks that passed in any other run of this repository, on
      # whatever branch, which this run's own cache cannot hold. Sharing only
      # saves compiles, so neither this step nor the upload after the tests
      # can fail the job.
      - name: Restore Shared Passed Compile Checks
        continue-on-error: true
        # Twice the longest it can take: its script stops reading after 90
        # seconds, and read 30 artifacts in 11.5 and 15.2 seconds (Verify runs
        # 43952868099 and 43954840461), where it now reads at most 15.
        timeout-minutes: 3
        uses: ./.github/actions/restore-shared-compile-checks
        with:
          identity: ${{ steps.compile-check-identity.outputs.identity }}
      # One pass, with compile verification. The passes that catch output
      # differing between processes (per-process hash seeds) run on Linux,
      # in "Repeat Tests on Linux", where runners are plentiful: on this
      # macOS runner the four of them took 9 minutes of every run.
      #
      # Coverage counters are plain loads and stores, and Swift Testing
      # runs tests in parallel, so a counter that many tests increment
      # loses the occasional increment. llvm-cov does not count an
      # `else` branch directly: it subtracts the `then` branch's counter
      # from the enclosing block's. A rarely taken `else` under an `if`
      # that runs a thousand times therefore reads zero whenever the
      # block's counter lost a few more increments than the branch's,
      # and Codecov reports a line that tests do run as missed (#507 saw
      # GenerateCommand.swift lose one such line on both platforms).
      # `-instrprof-atomic-counter-update-all` makes every update atomic,
      # so the counts are exact. SwiftPM's native build system passes the
      # flag through; the swiftbuild build system drops it.
      #
      # The build and the tests are two steps, as "Build Tests on Linux"
      # and the Linux test jobs are, so that a run's step list shows how
      # its time divides.
      #
      # Each time limit stops a step that hangs rather than letting it
      # hold the runner for GitHub's six-hour default, and is about twice
      # the longest duration measured, rounded up to 5 minutes. Two runs
      # measured the steps apart, read from their logs while they were
      # one step: PR #765's run 44067580141 built for 23.5 minutes and
      # tested for 18.6, and main's run 44032976346 for 14.1 and 16.8.
      # That is thin, so the limits also allow for the one step these
      # were: on 2026-11-15, eight successful runs of that combined step
      # took 17.1 to 55.1 minutes (median 32.2): 26.4 (run 43712596551),
      # 45.2 (43692820935), 55.1 (43687996075), 17.1 (43685323713), 23.9
      # (43682711345), 21.9 (43676467330), 38.0 (43671437925) and 54.9
      # (main's run 43721724778). The build's limit is twice 23.5, rounded
      # up to 55. The tests' longest is not measured: at most the combined
      # step's 55.1 less the shortest build, 14.1, so 41.0, when no compile
      # check had passed before; the limit was twice that, 85, until the
      # step lists gave the durations beside "Test Framework" below.
      - name: Build Framework and Tests
        timeout-minutes: 55
        run: |
          # shellcheck disable=SC2086 # The arguments are words to split.
          xcrun swift build --build-tests $SWIFT_TEST_ARGUMENTS
      # After the build rather than at the job's end, so the cache holds
      # the build alone and a failing test does not lose it.
      # One part saves it: the two build the same sources, under one key.
      - name: Save Build Directory
        if: ${{ github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true' && matrix.part != 'the-rest' }}
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      # A part's limit is twice the longer part's test step in the one run
      # that has measured the two with every check compiling, rounded up to
      # 5 minutes: 32.1 minutes for seams-and-mocks and 30.8 for the-rest
      # (run 45034492743), half each of the 62.7 the one job took then (run
      # 44843308363). One run is thin: set it again from the step lists once
      # eight two-part runs exist.
      #
      # The one job's limit is from its four runs in which many checks
      # compiled: 51.6 minutes (run 45626612103), 60.5 (45697927258), 75.4
      # (45743295805) and 48.6 (45766677692), where a run whose checks had
      # all passed before takes 26.5 to 34.6. Twice the longest would be
      # 150; 110 is about twice their median, 56, and leaves the longest 35
      # minutes, since each further minute is one a stalled test holds a
      # macOS runner.
      - name: Test Framework
        id: tests
        timeout-minutes: ${{ matrix.part == 'all' && 110 || 65 }}
        env:
          SAFEDI_COMPILE_CHECK_PASSED_CACHE: ${{ github.workspace }}/.compile-check-cache/passed.txt
          SELECTION: ${{ steps.part.outputs.selection }}
        run: |
          # shellcheck disable=SC2086 # The arguments and the selection are words to split.
          xcrun swift test --skip-build $SWIFT_TEST_ARGUMENTS $SELECTION
      # A run keeps in its branch's cache only the value comparison outputs it
      # read or printed and those the newest artifacts of its identity hold,
      # since the restore adds other runs' outputs to the directory, and keeps
      # them all when its tests did not run to their end
      # (.github/scripts/keep-value-outputs-used-in-run.sh says why). The
      # cache only saves time, so this cannot fail the job.
      - name: Keep the Value Comparison Outputs This Run Used
        if: ${{ always() && hashFiles('.compile-check-cache/passed.txt') != '' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: .github/scripts/keep-value-outputs-used-in-run.sh .compile-check-cache "$GITHUB_RUN_ID" "$TEST_OUTCOME"
      - name: Save Passed Compile Checks
        if: ${{ always() && hashFiles('.compile-check-cache/passed.txt') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .compile-check-cache
          # Each part saves its own list. The next run restores the newer of
          # the two and reads the other part's passes from the list "Build
          # and Test on Xcode 26" uploads to share.
          key: compile-checks-v1-${{ runner.os }}-${{ steps.compile-check-identity.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.part }}
      - name: Upload Passed Compile Checks to Share
        if: ${{ always() && matrix.part == 'all' }}
        continue-on-error: true
        uses: ./.github/actions/upload-passed-compile-checks
        with:
          identity: ${{ steps.compile-check-identity.outputs.identity }}
      # Two parts would upload to share under one name, and the second would
      # replace the first. Each hands on the checks it passed and the value
      # comparison outputs it printed, and "Build and Test on Xcode 26" joins
      # and uploads them, as "Save Passed Compile Checks of Verify" does for
      # Verify's groups.
      - name: Upload Passed Compile Checks of the Part
        if: ${{ always() && matrix.part != 'all' && hashFiles('.compile-check-cache/passed.txt') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: xcode-passed-compile-checks-${{ matrix.part }}
          path: |
            .compile-check-cache/passed-in-run-${{ github.run_id }}.txt
            .compile-check-cache/value-outputs/
            .compile-check-cache/value-outputs-written-in-run-${{ github.run_id }}.txt
          retention-days: 1
          include-hidden-files: true
          # A re-run of the job replaces what an earlier attempt uploaded.
          overwrite: true
      - name: Prepare Coverage Reports
        run: ./Scripts/prepare-coverage-reports.sh
      # "Check Line Coverage on Linux" unions this report with the Linux
      # job's. It is uploaded before the Codecov upload, so that the check
      # never depends on Codecov, and with the root its paths start with,
      # the commit it measured and the platform it ran on.
      - name: Stage Coverage Report for the Line Coverage Check
        env:
          REPORT_PART: ${{ steps.part.outputs.report-part }}
        run: |
          mkdir line-coverage
          cp .build/artifacts/SafeDIPackageTests.lcov line-coverage/coverage.lcov
          pwd -P > line-coverage/checkout-root.txt
          echo "$GITHUB_SHA" > line-coverage/commit.txt
          echo macos > line-coverage/platform.txt
          echo "$REPORT_PART" > line-coverage/part.txt
      - name: Upload Coverage Report for the Line Coverage Check
        uses: actions/upload-artifact@v7
        with:
          name: line-coverage-macos${{ matrix.part != 'all' && format('-{0}', matrix.part) || '' }}
          path: line-coverage/
          retention-days: 7
          if-no-files-found: error
          # A re-run of this job replaces the report an earlier attempt left.
          overwrite: true
      # Codecov's upload searches the workspace for coverage files and would
      # upload the staged copy too.
      - name: Remove the Staged Coverage Report
        run: rm -r line-coverage
      # Each part uploads under the one flag, and Codecov sums a flag's
      # uploads. codecov.yml holds its status for one `macos` upload, so with
      # two parts the status, which gates nothing, is first posted from one
      # part and then corrected by the other.
      - name: Upload Coverage Reports
        if: success()
        uses: codecov/codecov-action@v7
        with:
          # Codecov may refuse the upload of a fork's own run, which has no token for it, after every test has
          # passed, so only this repository's runs fail on a refused upload.
          fail_ci_if_error: ${{ github.repository == 'dfed/SafeDI' }}
          verbose: true
          os: macos
          flags: macos

  # Reports the parts of the Xcode 26 tests under the name the one job had,
  # which the required check is, and fails unless every part passed: skipped,
  # a part would satisfy the check. With two parts it also joins the compile
  # checks they passed into the one list other runs read, which cannot fail
  # the job, since sharing only saves compiles. It only reads results and
  # moves lists, so it runs on Linux and needs no container.
  spm:
    name: Build and Test on Xcode 26
    needs: [changes, spm-plan, spm-tests, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && (needs.changes.outputs.source != 'false' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require Every Part
        env:
          PARTS: ${{ needs.spm-plan.outputs.parts || '["all"]' }}
          PARTS_RESULT: ${{ needs.spm-tests.result }}
        run: |
          echo "Build and Test on Xcode 26, parts $PARTS: $PARTS_RESULT"
          test "$PARTS_RESULT" = success
      - name: Checkout Repo
        if: ${{ !cancelled() && needs.spm-plan.outputs.split == 'true' }}
        uses: actions/checkout@v7
      # The limits only stop a stalled transfer, as in "Save Passed Compile
      # Checks of Verify", whose steps these are.
      - name: Download the Parts' Passed Compile Checks
        if: ${{ !cancelled() && needs.spm-plan.outputs.split == 'true' }}
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: xcode-passed-compile-checks-*
          path: part-compile-checks
      - name: Join the Parts' Passed Compile Checks
        if: ${{ !cancelled() && needs.spm-plan.outputs.split == 'true' }}
        continue-on-error: true
        run: |
          mkdir -p .compile-check-cache/value-outputs
          parts=$(find part-compile-checks -name "passed-in-run-$GITHUB_RUN_ID.txt" 2>/dev/null | wc -l)
          if [ "$parts" -gt 0 ]; then
            find part-compile-checks -name "passed-in-run-$GITHUB_RUN_ID.txt" -exec cat {} + | LC_ALL=C sort -u > ".compile-check-cache/passed-in-run-$GITHUB_RUN_ID.txt"
            .github/scripts/join-value-outputs.sh part-compile-checks .compile-check-cache
            find part-compile-checks -name "value-outputs-written-in-run-$GITHUB_RUN_ID.txt" -exec cat {} + | LC_ALL=C sort -u > ".compile-check-cache/value-outputs-written-in-run-$GITHUB_RUN_ID.txt"
            echo "Passed compile checks of $parts parts: $(wc -l < ".compile-check-cache/passed-in-run-$GITHUB_RUN_ID.txt") passed in this run."
          else
            echo "No part uploaded passed compile checks."
          fi
          rm -rf part-compile-checks
      # Under macOS's name, which this Linux job gives: the parts passed
      # these checks with Xcode's compiler, under the identity they computed.
      - name: Upload Passed Compile Checks to Share
        if: ${{ !cancelled() && needs.spm-plan.outputs.split == 'true' && needs.spm-tests.outputs.compile-check-identity != '' }}
        continue-on-error: true
        uses: ./.github/actions/upload-passed-compile-checks
        with:
          identity: ${{ needs.spm-tests.outputs.compile-check-identity }}
          operating-system: macOS

  # Builds the test bundle that "Build and Test on Linux", the graph fuzzer's
  # shards and "Repeat Tests on Linux" all run, in a job of its own so that
  # the three start together when the build ends. While the build and the
  # tests were one job, the shards and the repeated passes started only after
  # the tests, 28.7 to 38.4 minutes into a run of which the tests were 13.5
  # to 17.8 (runs 43760851366, 43721724778, 43755152593, 43671437925).
  linux-build:
    name: Build Tests on Linux
    needs: [changes, stack-position]
    # Also runs on every push to main, Markdown-only or not, for the reason
    # "Build and Test on Linux" gives.
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && (needs.changes.outputs.source != 'false' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    container: swift:6.2
    permissions:
      contents: read
    env: &linux-test-environment
      # What the build passes `swift build --build-tests`, which the compile
      # check identity of "Build and Test on Linux" hashes too.
      SWIFT_TEST_ARGUMENTS: -c release --enable-code-coverage -Xswiftc -enable-testing -Xswiftc -Xllvm -Xswiftc -instrprof-atomic-counter-update-all --traits sourceBuild
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      # For the macOS job's reason (17.9 and 19.8 minutes in the same two
      # runs). The checkout is the container's, so git needs telling that
      # this user may read it.
      - name: Stamp Source Times
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          .github/scripts/stamp-source-times.sh
      # The compiler is hashed with the arguments, since a build is no start
      # for another compiler's. Assigned first, so that a compiler that
      # fails to report its version fails this step.
      - name: Hash Build Arguments
        id: build-arguments
        run: |
          compiler=$(swift --version 2>&1)
          arguments=$(printf '%s\n%s' "$SWIFT_TEST_ARGUMENTS" "$compiler" | sha256sum | cut -c1-16)
          test "${#arguments}" -eq 16
          echo "hash=$arguments" >> "$GITHUB_OUTPUT"
      # Same idea as the macOS test job: reuse dependency build products
      # between runs. Keyed on the container's Swift version, the compiler
      # the `swift:6.2` tag names today, and the build's arguments, for the
      # macOS job's reason, and on the commit, so that each push to main
      # saves the build a later run starts from. Only a run on main
      # saves ("Save Build Directory" below), for the macOS job's reason
      # too: two pull requests each held a 546 MB copy of this build.
      - name: Restore Build Directory
        id: build-cache
        if: ${{ needs.stack-position.outputs.clean-build != 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: spm-release-v2-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-${{ steps.build-arguments.outputs.hash }}-${{ github.sha }}
          restore-keys: |
            spm-release-v2-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-${{ steps.build-arguments.outputs.hash }}-
            spm-release-v2-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-
            spm-release-v2-${{ runner.os }}-swift-6.2-
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: swift package resolve
      # Atomic coverage counter updates, for the reason the macOS job gives.
      # The limit is twice the slowest build: the build took 10.0 to 15.2
      # minutes of the step that built and tested, going by the time of the
      # test run each log reports (the runs the job's comment names), and
      # Verify's release build from nothing 10 to 17.
      - name: Build Tests
        timeout-minutes: 35
        run: |
          # shellcheck disable=SC2086 # The arguments are words to split.
          swift build --build-tests $SWIFT_TEST_ARGUMENTS
      # After the build rather than at the job's end, so the cache holds
      # the build alone and a failing test does not lose it.
      - name: Save Build Directory
        if: ${{ github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      # What a job that runs the tests needs of the build: the bundle,
      # SafeDITool and the macro plugin (which compile checks and the
      # fuzzer's compiler runs use), SafeDI's module, and the build's record
      # of the dependency versions it resolved, which the key of each compile
      # check names (CompileCheckBuild).
      - name: Package Test Bundle
        run: |
          products=.build/x86_64-unknown-linux-gnu/release
          tar -czf graph-fuzzer-test-bundle.tar.gz \
            "$products/SafeDIPackageTests.xctest" \
            "$products/SafeDITool" \
            "$products/SafeDIMacros-tool" \
            "$products/Modules/SafeDI.swiftmodule" \
            .build/workspace-state.json
      # Kept three days, since two required checks now run it: a job re-run
      # after the bundle expired needs "Re-run all jobs".
      - name: Upload Test Bundle
        uses: actions/upload-artifact@v7
        with:
          name: graph-fuzzer-test-bundle
          path: graph-fuzzer-test-bundle.tar.gz
          retention-days: 3

  # Leaves main the builds of its newest commits only: each push to main
  # saves a build under a key that ends in its commit, about 580 MB on macOS
  # and 546 MB on Linux, and the repository's caches are evicted above
  # 10 GB. A build is deleted only when this run's commit has a build under
  # the same prefix and the other build's commit is an ancestor of this
  # run's. Two pushes to main do not cancel each other, so the older one's
  # run can finish last: it finds the newer build's commit ahead of its
  # own and leaves it. The macOS prefix names no runner image and the
  # debug prefix no Swift version, so a build an older image or release
  # made goes when a newer commit's build exists. Deleting a
  # cache takes `actions: write` and comparing two commits `contents: read`;
  # only this job has the first. It checks nothing out and calls only
  # GitHub's API, so it runs on Linux with no container. A failure warns and
  # leaves the builds for the next run or for eviction.
  prune-build-caches:
    name: Delete Older Build Directories
    needs: [spm, linux-build, linux-latest-swift-group, generate-time, example-integrations, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete the Builds of This Commit's Ancestors
        # A list for each job, then a comparison and a delete for each older
        # build, usually one per job. One minute is the least the limit can
        # be set to in whole minutes.
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          COMMIT: ${{ github.sha }}
        run: |
          for prefix in spm-release-v2-macOS-xcode-26.0- spm-release-v2-Linux-swift-6.2- spm-debug-v2-Linux-swift- generate-time-build-v1-Linux-swift-6.2-; do
            if ! builds=$(gh api -X GET "repos/$REPOSITORY/actions/caches" -f key="$prefix" -f ref="$REF" -F per_page=100 --jq '.actions_caches[] | "\(.id) \(.key)"' 2>&1); then
              echo "::warning::Listing $REF's builds under $prefix failed: $(printf '%s' "$builds" | tr '\r\n' '  ')"
              continue
            fi
            # Without this commit's build, an ancestor's is the one to keep.
            case "$builds" in
              *"-$COMMIT"*) ;;
              *)
                echo "$REF has no build of $COMMIT under $prefix, so its other builds stay."
                continue
                ;;
            esac
            printf '%s\n' "$builds" | while read -r id key; do
              other=${key##*-}
              if [ "$other" = "$COMMIT" ]; then
                continue
              fi
              if ! status=$(gh api "repos/$REPOSITORY/compare/$other...$COMMIT" --jq .status 2>&1); then
                echo "::warning::Comparing $other with $COMMIT failed, so $key stays: $(printf '%s' "$status" | tr '\r\n' '  ')"
                continue
              fi
              # "ahead" says this commit has commits the other lacks and lacks none of the other's.
              if [ "$status" != ahead ]; then
                echo "Kept $key, whose commit is not an ancestor of $COMMIT ($status)."
                continue
              fi
              if deleted=$(gh api -X DELETE "repos/$REPOSITORY/actions/caches/$id" 2>&1); then
                echo "Deleted $key."
              else
                echo "::warning::Deleting $key failed: $(printf '%s' "$deleted" | tr '\r\n' '  ')"
              fi
            done
          done
      # "Check Generate Time on Linux" saves each main commit's tool, 19 MB,
      # for the pull requests that branch from that commit, so ancestry is
      # the wrong rule here: an ancestor's tool is the one a pull request
      # needs. The thirty newest stay, a few days of main on a day of many
      # landings; a run whose base's tool is gone builds it, which costs
      # time and changes no result.
      - name: Delete All but the Thirty Newest Generate Time Tools
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          prefix=generate-time-tool-Linux-swift-6.2-
          if ! older=$(gh api -X GET "repos/$REPOSITORY/actions/caches" -f key="$prefix" -f ref="$REF" -f sort=created_at -f direction=desc -F per_page=100 --jq '.actions_caches[30:][] | "\(.id) \(.key)"' 2>&1); then
            echo "::warning::Listing $REF's tools under $prefix failed: $(printf '%s' "$older" | tr '\r\n' '  ')"
            exit 0
          fi
          if [ -z "$older" ]; then
            echo "$REF has thirty tools or fewer under $prefix."
            exit 0
          fi
          printf '%s\n' "$older" | while read -r id key; do
            if deleted=$(gh api -X DELETE "repos/$REPOSITORY/actions/caches/$id" 2>&1); then
              echo "Deleted $key."
            else
              echo "::warning::Deleting $key failed: $(printf '%s' "$deleted" | tr '\r\n' '  ')"
            fi
          done
      # The integrations job's scratch and DerivedData directories are saved
      # once per runner image and Package.resolved, about 690 and 520 MB
      # compressed (229 MB a scratch directory and 259 MB a DerivedData, run
      # 44203313851), and a run restores only the entry of its own image, by
      # its exact key. So one entry stays for each image still in use: the
      # newest saved for the highest image version, and the newest saved for
      # any other image that a run restored in the last two days. While GitHub
      # is moving runners, main's runs land on both images, and keeping the
      # newest entry alone would delete the other image's on every push, so
      # each run would build from nothing; two days after the last run on the
      # older image its entry goes. A hundred entries are listed, which the
      # repository's 10 GB cannot hold at these sizes.
      - name: Delete the Scratch Directories of the Integrations Job That No Image in Use Restores
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          in_use_since=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%S)
          for prefix in example-native-scratch-v1- example-xcodebuild-derived-data-v1-; do
            # Newest saved first.
            if ! entries=$(gh api -X GET "repos/$REPOSITORY/actions/caches" -f key="$prefix" -f ref="$REF" -f sort=created_at -f direction=desc -F per_page=100 --jq '.actions_caches[] | "\(.id) \(.last_accessed_at) \(.key)"' 2>&1); then
              echo "::warning::Listing $REF's entries under $prefix failed: $(printf '%s' "$entries" | tr '\r\n' '  ')"
              continue
            fi
            # <prefix>macOS-xcode-<Xcode version>-<image version, three numbers>-<hash>
            pattern="s/^${prefix}macOS-xcode-[0-9.]+-([0-9]+\.[0-9]+\.[0-9]+)-.*$/\1/p"
            highest=$(printf '%s\n' "$entries" | cut -d ' ' -f 3 | sed -n -E "$pattern" | sort -t . -k 1,1n -k 2,2n -k 3,3n | tail -n 1)
            if [ -z "$highest" ]; then
              echo "$REF has no entry under $prefix whose key names an image."
              continue
            fi
            kept=" "
            printf '%s\n' "$entries" | while read -r id accessed key; do
              image=$(printf '%s\n' "$key" | sed -n -E "$pattern")
              # A key this pattern does not read stays.
              if [ -z "$image" ]; then
                continue
              fi
              # The first entry met for an image is its newest.
              if [ "${kept#* $image }" = "$kept" ]; then
                kept="$kept$image "
                if [ "$image" = "$highest" ] || [[ "$accessed" > "$in_use_since" ]]; then
                  continue
                fi
              fi
              if deleted=$(gh api -X DELETE "repos/$REPOSITORY/actions/caches/$id" 2>&1); then
                echo "Deleted $key."
              else
                echo "::warning::Deleting $key failed: $(printf '%s' "$deleted" | tr '\r\n' '  ')"
              fi
            done
          done
      # The documentation build (219 MB) and CodeQL's build (337 MB, saved by
      # codeql.yml) are saved once per macOS runner image, and a run restores
      # the one for its own image, so the copy for an older image is 0.56 GB
      # nothing needs once GitHub has moved every runner. The image version
      # decides, not the time an entry was saved: while GitHub is moving
      # runners, a run on the older image can save after one on the newer.
      # Such a run then finds its own image's copy gone and restores the
      # newer image's build by prefix, which costs it a longer build and
      # changes no result.
      - name: Delete the Documentation and CodeQL Builds of Older Runner Images
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          for prefix in spm-debug-macOS-xcode- codeql-swift-native-macOS-xcode-; do
            if ! entries=$(gh api -X GET "repos/$REPOSITORY/actions/caches" -f key="$prefix" -f ref="$REF" -F per_page=100 --jq '.actions_caches[] | "\(.id) \(.key)"' 2>&1); then
              echo "::warning::Listing $REF's entries under $prefix failed: $(printf '%s' "$entries" | tr '\r\n' '  ')"
              continue
            fi
            # <prefix><Xcode version>-<image version, three numbers>-<hash>
            images=$(printf '%s\n' "$entries" | sed -n -E "s/^[0-9]+ $prefix[0-9.]+-([0-9]+\.[0-9]+\.[0-9]+)-.*$/\1/p")
            newest=$(printf '%s\n' "$images" | sort -t . -k 1,1n -k 2,2n -k 3,3n | tail -n 1)
            if [ -z "$newest" ]; then
              echo "$REF has no entry under $prefix whose key names an image."
              continue
            fi
            printf '%s\n' "$entries" | while read -r id key; do
              image=$(printf '%s\n' "$key" | sed -n -E "s/^$prefix[0-9.]+-([0-9]+\.[0-9]+\.[0-9]+)-.*$/\1/p")
              # A key this pattern does not read stays.
              if [ -z "$image" ] || [ "$image" = "$newest" ]; then
                continue
              fi
              if deleted=$(gh api -X DELETE "repos/$REPOSITORY/actions/caches/$id" 2>&1); then
                echo "Deleted $key, older than image $newest."
              else
                echo "::warning::Deleting $key failed: $(printf '%s' "$deleted" | tr '\r\n' '  ')"
              fi
            done
          done

  # Runs the suite once, with compile checks and coverage, from the bundle
  # "Build Tests on Linux" built. It keeps the name it had when it also
  # built, which is the name of a required check.
  linux:
    name: Build and Test on Linux
    needs: [changes, linux-build, stack-position]
    # Also runs on every push to main, Markdown-only or not, so the
    # Codecov report behind the README badge always comes from a real
    # test run. It runs when the build failed too, and fails in its first
    # step: a skipped job would satisfy the required check.
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && (needs.changes.outputs.source != 'false' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    container: swift:6.2
    permissions:
      contents: read
      # To read the passed compile checks other runs uploaded.
      actions: read
    env: *linux-test-environment
    steps:
      - name: Require the Build
        env:
          BUILD_RESULT: ${{ needs.linux-build.result }}
        run: |
          echo "Build Tests on Linux: $BUILD_RESULT"
          test "$BUILD_RESULT" = success
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Download Test Bundle
        uses: ./.github/actions/download-artifact
        with:
          name: graph-fuzzer-test-bundle
      - name: Unpack Test Bundle
        run: |
          tar -xzf graph-fuzzer-test-bundle.tar.gz
          mkdir -p "$RUNNER_TEMP/unit-suite-profiles"
      # Passed compile checks are cached as in the macOS job, under a key of
      # this runner's operating system.
      - name: Compute Compile Check Identity
        id: compile-check-identity
        run: |
          # Assign first, so a failing script fails this step: inside `echo`, a
          # failed command substitution would write a partial identity, and a
          # partial identity could reuse checks another compiler passed.
          # shellcheck disable=SC2086 # The arguments are words to split.
          identity=$(.github/scripts/compile-check-identity.sh $SWIFT_TEST_ARGUMENTS)
          test "${#identity}" -eq 64
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Restore Passed Compile Checks
        uses: actions/cache/restore@v6
        with:
          path: .compile-check-cache
          key: compile-checks-v1-${{ runner.os }}-${{ steps.compile-check-identity.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compile-checks-v1-${{ runner.os }}-${{ steps.compile-check-identity.outputs.identity }}-
      # And the checks that passed in any other run of this repository, on
      # whatever branch, which this run's own cache cannot hold. Sharing only
      # saves compiles, so neither this step nor the upload after the tests
      # can fail the job.
      - name: Restore Shared Passed Compile Checks
        continue-on-error: true
        # Twice the longest it can take: its script stops reading after 90
        # seconds, and read 30 artifacts in 11.5 and 15.2 seconds (Verify runs
        # 43952868099 and 43954840461), where it now reads at most 15.
        timeout-minutes: 3
        uses: ./.github/actions/restore-shared-compile-checks
        with:
          identity: ${{ steps.compile-check-identity.outputs.identity }}
      # Runs the bundle as `swift test` would, in one process. Only that
      # process writes to the profile folder: every process a test starts gets
      # an LLVM_PROFILE_FILE of its own in the test's temporary directory.
      # A time limit for the macOS job's reason: twice the slowest suite.
      # It took 13.5 to 17.8 minutes with every compile check compiling (the
      # runs "Build Tests on Linux" names; 15 to 20 in Verify's runs of the
      # suite in one process, as verify.yml says) and 7.5 with the checks
      # skipped (run 43765011597); the 2.3.0 stack's suite took 34.9 (run
      # 44545790927), and run 44573505588 passed 40 still running. Over
      # nine later runs it took 23.2 to 60.5 minutes (runs 45880961000 and
      # 45757312407; 45.5 in 45766677692), so the limit is twice 60.
      - name: Test
        id: tests
        timeout-minutes: 120
        env:
          SAFEDI_COMPILE_CHECK_PASSED_CACHE: ${{ github.workspace }}/.compile-check-cache/passed.txt
          LLVM_PROFILE_FILE: ${{ runner.temp }}/unit-suite-profiles/unit-suite-%p.profraw
        run: .build/x86_64-unknown-linux-gnu/release/SafeDIPackageTests.xctest --testing-library swift-testing
      # A run keeps in its branch's cache only the value comparison outputs it
      # read or printed and those the newest artifacts of its identity hold,
      # since the restore adds other runs' outputs to the directory, and keeps
      # them all when its tests did not run to their end
      # (.github/scripts/keep-value-outputs-used-in-run.sh says why). The
      # cache only saves time, so this cannot fail the job.
      - name: Keep the Value Comparison Outputs This Run Used
        if: ${{ always() && hashFiles('.compile-check-cache/passed.txt') != '' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: .github/scripts/keep-value-outputs-used-in-run.sh .compile-check-cache "$GITHUB_RUN_ID" "$TEST_OUTCOME"
      - name: Save Passed Compile Checks
        if: ${{ always() && hashFiles('.compile-check-cache/passed.txt') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .compile-check-cache
          key: compile-checks-v1-${{ runner.os }}-${{ steps.compile-check-identity.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Not when the job stopped before the identity was computed, as it does
      # when the build failed: there is then no checkout to take the action
      # from.
      - name: Upload Passed Compile Checks to Share
        if: ${{ always() && steps.compile-check-identity.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/upload-passed-compile-checks
        with:
          identity: ${{ steps.compile-check-identity.outputs.identity }}
      # The profile `swift test` would have left where the steps below read
      # it.
      - name: Merge Coverage Profile
        shell: bash
        run: |
          shopt -s nullglob
          profiles=("$RUNNER_TEMP"/unit-suite-profiles/*.profraw)
          if [ ${#profiles[@]} -eq 0 ]; then
            echo "::error::The suite wrote no coverage profile."
            exit 1
          fi
          mkdir -p .build/x86_64-unknown-linux-gnu/release/codecov
          llvm-profdata merge -sparse "${profiles[@]}" -o .build/x86_64-unknown-linux-gnu/release/codecov/default.profdata
      - name: Prepare Coverage Reports
        run: |
          llvm-cov export -format="lcov" .build/x86_64-unknown-linux-gnu/release/SafeDIPackageTests.xctest -instr-profile .build/x86_64-unknown-linux-gnu/release/codecov/default.profdata > coverage.lcov
      # Staged, uploaded and removed as in the macOS job, for the same
      # reasons, before curl is installed for Codecov.
      - name: Stage Coverage Report for the Line Coverage Check
        run: |
          mkdir line-coverage
          cp coverage.lcov line-coverage/coverage.lcov
          pwd -P > line-coverage/checkout-root.txt
          echo "$GITHUB_SHA" > line-coverage/commit.txt
          echo linux > line-coverage/platform.txt
      - name: Upload Coverage Report for the Line Coverage Check
        uses: actions/upload-artifact@v7
        with:
          name: line-coverage-linux
          path: line-coverage/
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - name: Remove the Staged Coverage Report
        run: rm -r line-coverage
      # The suite's coverage, for the fuzzer coverage report's split between
      # lines a unit test reaches and lines nothing reaches.
      - name: Upload Unit Suite Profile for the Fuzzer Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: unit-suite-profile
          path: .build/x86_64-unknown-linux-gnu/release/codecov/default.profdata
          retention-days: 1
      # Retried because the runner sometimes cannot resolve Ubuntu's package
      # servers. `apt-get update` exits 0 when it cannot fetch an index, so the
      # retry covers the install, which is what fails.
      - name: Install curl for Codecov
        uses: ./.github/actions/retry
        with:
          command: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
      - name: Upload Coverage Reports
        if: success()
        uses: codecov/codecov-action@v7
        with:
          # Codecov may refuse the upload of a fork's own run, which has no token for it, after every test has
          # passed, so only this repository's runs fail on a refused upload.
          fail_ci_if_error: ${{ github.repository == 'dfed/SafeDI' }}
          verbose: true
          os: linux
          flags: linux

  # Runs the whole suite four more times, each in a process of its own, to
  # catch generated code or diagnostics that differ between processes:
  # Swift seeds hashing per process, so an order that leaks from a `Set` or
  # `Dictionary` changes from one pass to the next, and every pass compares
  # generated output against the expected strings. Compile verification is
  # off: it compiles strings "Build and Test on Linux" compiles from the
  # same bundle, and a pass whose strings differ fails its comparison. The
  # passes run the bundle "Build Tests on Linux" built, as the graph fuzzer's
  # shards do, each in a job of its own beside that job and the shards: one
  # after another in one job they took 9.7 to 25.3 minutes and ended run
  # 43755152593. Coverage is not collected: the bundle is built for
  # coverage, so its profiles go to the runner's temporary directory.
  # Checks that every graph of the base, seam and public mock corpora that
  # SafeDI 2.3.0 accepts still compiles and builds the same values, on every pull request and push to main, so a
  # break is attributed or fixed in the change that makes it rather than
  # found before a release candidate. release-acceptance.yml's jobs run in
  # this run from the bundle "Build Tests on Linux" built: one job that
  # builds 2.3.0 (restored from a cache after its first run on main), the
  # shards of each corpus and the job that combines their reports. No required check.
  # graph-fuzzer.yml's `release_acceptance` input checks a branch by hand.
  # Chooses whether the Xcode 26 tests run as one job or two, which the comment
  # on "Build and Test on Xcode 26 (…)" explains: two when few of the suite's
  # compile checks have passed under this commit's identity.
  #
  # The macOS jobs' own list of passed checks is keyed on an identity that
  # hashes Xcode's compiler and SDK, so only a macOS runner can look it up,
  # and a macOS job that only chose would queue for the runner the choice is
  # meant to save. This job reads Linux's list instead, as "Build and Test on
  # Linux" restores it: the two identities hash the same sources, manifest
  # and verifier, so a change that empties one empties the other. They differ
  # after a new Xcode or runner image, which empties only macOS's, and such a
  # run keeps the one job, as every run did before this one existed.
  #
  # Both macOS parts and the line coverage check read this one answer, so
  # they cannot disagree about how many reports there are. A failure here
  # leaves the answer empty, which each reads as one job.
  spm-plan:
    name: Choose How the Xcode 26 Tests Run
    needs: [changes, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && (needs.changes.outputs.source != 'false' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    container: swift:6.2
    # About twice what its steps take: the checkout, the two restores, of
    # which the second stops itself after three minutes, and a count.
    timeout-minutes: 10
    permissions:
      contents: read
      # To read the passed compile checks other runs uploaded.
      actions: read
    env: *linux-test-environment
    outputs:
      parts: ${{ steps.choose.outputs.parts }}
      split: ${{ steps.choose.outputs.split }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Compute Compile Check Identity
        id: compile-check-identity
        run: |
          # Assign first, so a failing script fails this step, as in "Build
          # and Test on Linux".
          # shellcheck disable=SC2086 # The arguments are words to split.
          identity=$(.github/scripts/compile-check-identity.sh $SWIFT_TEST_ARGUMENTS)
          test "${#identity}" -eq 64
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Restore Passed Compile Checks
        uses: actions/cache/restore@v6
        with:
          path: .compile-check-cache
          key: compile-checks-v1-${{ runner.os }}-${{ steps.compile-check-identity.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compile-checks-v1-${{ runner.os }}-${{ steps.compile-check-identity.outputs.identity }}-
      - name: Restore Shared Passed Compile Checks
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/restore-shared-compile-checks
        with:
          identity: ${{ steps.compile-check-identity.outputs.identity }}
      # Two jobs below half of what a run skips when every check has passed:
      # main's run 44839883136 skipped 4,260 on macOS, and the first run of a
      # change to the macro plugin's sources skipped none (run 44843308363).
      # A list between the two is a run that was cancelled part way, which
      # the one job finishes in less than a second runner's build takes once
      # half the checks are skipped.
      - name: Choose One Job or Two
        id: choose
        env:
          FEWEST_PASSED_CHECKS_FOR_ONE_JOB: 2000
        run: |
          passed=0
          if [ -f .compile-check-cache/passed.txt ]; then
            passed=$(wc -l < .compile-check-cache/passed.txt)
          fi
          if [ "$passed" -lt "$FEWEST_PASSED_CHECKS_FOR_ONE_JOB" ]; then
            echo "$passed compile checks have passed under this identity, fewer than $FEWEST_PASSED_CHECKS_FOR_ONE_JOB: the Xcode 26 tests run as two jobs."
            echo 'parts=["seams-and-mocks","the-rest"]' >> "$GITHUB_OUTPUT"
            echo "split=true" >> "$GITHUB_OUTPUT"
          else
            echo "$passed compile checks have passed under this identity: the Xcode 26 tests run as one job."
            echo 'parts=["all"]' >> "$GITHUB_OUTPUT"
            echo "split=false" >> "$GITHUB_OUTPUT"
          fi

  release-acceptance:
    name: Release Acceptance
    # On main it skips when a pull request's run passed every one of its jobs on the same tree ("Find Builds a
    # Pull Request Passed on This Tree").
    needs: [changes, linux-build, passed-on-this-tree, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && !(github.event_name == 'push' && needs.passed-on-this-tree.outputs.release-acceptance == 'true') && needs.changes.outputs.source != 'false' && needs.linux-build.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-acceptance.yml
    with:
      bundle: graph-fuzzer-test-bundle

  # Compiles the hand-written calls of every generated declaration the
  # Manual documents (Scripts/release-checks/written-calls.sh) against the
  # code this change's SafeDITool generates, so that a change that breaks a
  # documented call form fails on its own pull request rather than at the
  # next release. It reuses the tool, macros and SafeDI module "Build Tests
  # on Linux" bundles, so it builds nothing. It runs main's copy of the
  # fixtures, so that a pull request cannot pass by editing a call: a change
  # that documents a new call form adds it, and the check runs it once that
  # change is on main. Main's copy holds every call the last stable release's
  # copy holds, since no change edits one of those; the check before a stable
  # tag still runs that release's own copy, as
  # `.claude/rules/releases-and-packaging.md` says.
  written-calls:
    name: Check Written Calls on Linux
    needs: [changes, linux-build, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && needs.changes.outputs.source != 'false' && needs.linux-build.result == 'success' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Download Test Bundle
        uses: ./.github/actions/download-artifact
        with:
          name: graph-fuzzer-test-bundle
      - name: Unpack Test Bundle
        run: tar -xzf graph-fuzzer-test-bundle.tar.gz
      # The script is zsh's, which the container lacks. Retried for the
      # reason "Install curl for Codecov" gives.
      - name: Install zsh
        uses: ./.github/actions/retry
        with:
          command: command -v zsh >/dev/null || { apt-get update && apt-get install -y --no-install-recommends zsh; }
      # The checkout is the container's, so git needs telling that this user
      # may read it.
      - name: Fetch Main
        uses: ./.github/actions/retry
        with:
          command: git config --global --add safe.directory "$GITHUB_WORKSPACE" && git fetch --no-tags --depth=1 origin main
      - name: Check Out Main's Fixtures
        run: git worktree add --detach "$RUNNER_TEMP/main" FETCH_HEAD
      # The check took 8 seconds on a 4-core Linux machine with a release
      # tool (2026-11-20); the limit leaves room for a slower runner and the
      # bundle's coverage-instrumented tool.
      - name: Compile Written Calls
        timeout-minutes: 2
        run: |
          products="$GITHUB_WORKSPACE/.build/x86_64-unknown-linux-gnu/release"
          "$RUNNER_TEMP/main/Scripts/release-checks/written-calls.sh" --keep-going \
            --tool "$products/SafeDITool" --output "$RUNNER_TEMP/written-calls"

  linux-repeat-pass:
    name: Repeat Tests on Linux (pass ${{ matrix.pass }})
    # On main it skips when a pull request's run passed the four passes on the same tree ("Find Builds a Pull
    # Request Passed on This Tree").
    needs: [changes, linux-build, passed-on-this-tree, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && !(github.event_name == 'push' && needs.passed-on-this-tree.outputs.linux-repeat == 'true') && needs.changes.outputs.source != 'false' && needs.linux-build.result == 'success' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2, 3, 4]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Download Test Bundle
        uses: ./.github/actions/download-artifact
        with:
          name: graph-fuzzer-test-bundle
      - name: Unpack Test Bundle
        run: tar -xzf graph-fuzzer-test-bundle.tar.gz
      # A pass took about 6.3 minutes when four took 25.3 (run 43755152593)
      # and about 5.1 in run 43760851366, and up to 8.3 over forty passes
      # since (run 44034763455). The 2.3.0 stack's suite, 6,735 tests, took
      # 12.5 to 16.1 minutes a pass (run 44243231996), and 13.0 in run
      # 44545790927, whose other two passes the old limit of 17 cut off
      # seven tests from the end; the limit then was twice the slowest, 18.
      # With 7,824 tests three passes of run 45907962627 took 20.0, 27.6 and
      # 32.3 minutes, and the old limit of 36 cut off the fourth with no
      # test failed; over the nine runs before it a pass took 17.1 to 32.0.
      # The limit is twice 36. Every test starts when the pass does, and the
      # seam smoke tests end it: they took 1,923 of that 32.3 minute pass's
      # 1,932 seconds.
      - name: Run Tests
        timeout-minutes: 72
        env:
          SAFEDI_SKIP_COMPILE_CHECK: 1
          LLVM_PROFILE_FILE: ${{ runner.temp }}/repeat-tests-%p.profraw
        run: .build/x86_64-unknown-linux-gnu/release/SafeDIPackageTests.xctest --testing-library swift-testing

  # Reports the four passes under the name the one job that ran them had. It
  # only reads their result, so it needs no container. It fails when a pass
  # failed or did not run although the change has source: skipped, it would
  # satisfy a required check.
  linux-repeat:
    name: Repeat Tests on Linux
    # Skips on main when the passes do, since it would have no result to require.
    needs: [changes, linux-repeat-pass, passed-on-this-tree, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && !(github.event_name == 'push' && needs.passed-on-this-tree.outputs.linux-repeat == 'true') && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the Four Passes
        env:
          PASSES_RESULT: ${{ needs.linux-repeat-pass.result }}
        run: |
          echo "Repeat Tests on Linux (pass 1 to 4): $PASSES_RESULT"
          test "$PASSES_RESULT" = success

  # Builds SafeDITool exactly as publish.yml's Linux jobs build the release
  # binary, so a compiler crash that only that build meets fails a pull
  # request rather than a publish: Swift 6.3.3 crashed compiling SafeDICore
  # with -Osize while publishing 2.3.0-alpha-1, on x86_64 and arm64 alike,
  # though the same commit had passed the test job's release build under
  # Swift 6.2. It therefore runs in publish's container, swift:6.3, not the
  # test job's swift:6.2; keep it in step with publish.yml, flags included:
  # publish built for size then, and now builds for speed, with the -O that
  # `-c release` passes. It caches nothing,
  # so every module is compiled from scratch, as publish compiles it.
  #
  # Because every module compiles here, this job also fails when SafeDI's own
  # sources produce a compiler warning. After the product it builds, one at a
  # time, every target whose path `swift package describe` lists under Sources
  # or Plugins (SafeDIMacros and the plugins among them), and fails on any
  # warning located under Sources or Plugins of this checkout. A whole-package
  # build would not do: with these flags it fails compiling
  # SafeDIToolTestSupport ("no such module 'Testing'"). Warnings in
  # dependencies (swift-syntax, swift-argument-parser, under .build) are
  # ignored, which is why it reads the log instead of passing
  # -warnings-as-errors. It sees only what Swift 6.3 reports on Linux: code
  # under `#if canImport(Darwin)` and other Apple-only branches is not compiled
  # here.
  linux-release-build:
    name: Build Release SafeDITool on Linux
    # On main it skips when a pull request's run passed it on the same tree ("Find Builds a Pull Request Passed
    # on This Tree").
    needs: [changes, passed-on-this-tree, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && !(github.event_name == 'push' && needs.passed-on-this-tree.outputs.linux-release-build == 'true') && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    container: swift:6.3
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Build SafeDITool and Check for Warnings
        shell: bash
        run: |
          set -eo pipefail
          log="$RUNNER_TEMP/swift-build.log"
          swift build -c release --product SafeDITool --static-swift-stdlib 2>&1 | tee "$log"
          targets=$(swift package describe | awk '/^ *Name: /{name=$2} /^ *Path: (Sources|Plugins)\//{print name}' | sort -u)
          if [ -z "$targets" ]; then
            echo "::error::swift package describe listed no target under Sources or Plugins."
            exit 1
          fi
          for target in $targets; do
            swift build -c release --target "$target" --static-swift-stdlib 2>&1 | tee -a "$log"
          done
          if grep -F ': warning: ' "$log" | grep -F -e "$PWD/Sources/" -e "$PWD/Plugins/" > "$RUNNER_TEMP/source-warnings.log"; then
            echo "::error::SafeDI's own sources produced a compiler warning:"
            sort -u "$RUNNER_TEMP/source-warnings.log"
            exit 1
          fi
      - name: Smoke test
        run: .build/release/SafeDITool --version
      # The only place a miscompile of the tool shows before a publish: 2.3.1's
      # release binaries, built as this job builds, made `query` return no
      # modules or crash, while every test passed, because no job ran a
      # command of a binary built this way. 2.4.2's crashed on `query graph`
      # over any root, which the script's chain, declaring none, did not
      # reach; it now runs `query graph`, `query needs`, `generate` and `dump`
      # over a root too. A crash or wrong output ends the
      # step at once; the limit is for a hang. Not yet measured on a runner
      # (under a minute on a 4-core Linux machine); set it from the first runs.
      - name: Run generate and query with the Release SafeDITool
        timeout-minutes: 5
        run: Scripts/query-release-smoke-test.sh .build/release/SafeDITool

  # Compares how long `SafeDITool generate` takes on synthetic dependency
  # graphs, the change's tool against the tool of the commit it is based on,
  # both measured in this job, on this runner, in alternating runs
  # (Scripts/generate-time-check.py). It fails when a graph takes twice as
  # long, because a generator that slowed down several times over passed
  # every other check and was found only by a benchmark run by hand, or when
  # its `generate` processes' median peak memory is 1.3 times the base's and
  # 8 MB more: main's tool against itself differed by 1% at most on every
  # shape (45 to 308 MB, 2026-11-20). Four shapes with the largest peaks,
  # each one module without seams (a graph of screens that reach one
  # another, with and without mocks, thirty-three mocks over layers of
  # screens, and a mock 1,500 levels deep), also fail at 1.1 times with the
  # same 8 MB, since memory is decided where the peak is largest, on their
  # peak in runs with one allocator arena: with glibc's arenas one tool's
  # peak on one graph sits at either of two levels a tenth apart, which
  # failed changes that used no more memory. It also fails
  # when a module's `.safedi`
  # file is twice the base's size, because storing seam signatures once made
  # one 400 times its size unnoticed.
  # The base is the main commit a pull request branched from, and for a push
  # to main the commit before the push. Its tool comes from the cache the
  # push to main that built it saved; when the cache has none, the job builds
  # it in this checkout first, so the change's build after it compiles only
  # what differs.
  generate-time:
    name: Check Generate Time on Linux
    needs: [changes, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # Main's history, for the merge base.
          fetch-depth: 0
      # Retried for the reason "Install curl for Codecov" gives.
      - name: Install Python
        uses: ./.github/actions/retry
        with:
          command: command -v python3 >/dev/null || { apt-get update && apt-get install -y --no-install-recommends python3; }
      - name: Check the Script
        run: python3 -I Scripts/generate-time-check.py --self-test "$RUNNER_TEMP/generate-time-self-test"
      # Scripts/compile-time-check.py imports this job's script, and its timed
      # comparison is run by hand, so a change to either that breaks it fails
      # here. About 40 s.
      - name: Check the Compile Time Script
        run: python3 -I Scripts/compile-time-check.py --self-test "$RUNNER_TEMP/compile-time-self-test"
      # For the reason "Build Tests on Linux" gives. The builds below stamp
      # again after each checkout of another commit, with this copy of the
      # script, which the checkout of the base commit cannot change.
      - name: Stamp Source Times
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp .github/scripts/stamp-source-times.sh "$RUNNER_TEMP/stamp-source-times.sh"
          "$RUNNER_TEMP/stamp-source-times.sh"
      # The release build of the SafeDITool product alone, which no other
      # job builds with these arguments. Keyed on the commit, so that each
      # push to main saves the build a later run starts from, and a run
      # compiles only the targets whose files differ from that commit's.
      # What the job measures is unchanged: a release build compiles each
      # module whole, so a tool built on a restored build is the tool a
      # build from nothing makes.
      - name: Restore Build Directory
        id: build-cache
        if: ${{ needs.stack-position.outputs.clean-build != 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: generate-time-build-v1-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            generate-time-build-v1-${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}-
            generate-time-build-v1-${{ runner.os }}-swift-6.2-
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: swift package resolve
      - name: Name the Base Commit
        id: commits
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          head=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && git rev-parse --verify --quiet "$BEFORE^{commit}" > /dev/null; then
            base=$(git rev-parse "$BEFORE^{commit}")
          else
            base=$(git merge-base origin/main HEAD)
          fi
          # A run on main itself that is not a push (the weekly run) has
          # nothing beneath it but the commit before.
          if [ "$base" = "$head" ]; then
            base=$(git rev-parse HEAD^)
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head $head, base $base"
      - name: Restore the Base Commit's SafeDITool
        id: base-tool
        uses: actions/cache/restore@v6
        with:
          path: .generate-time/cached
          key: generate-time-tool-${{ runner.os }}-swift-6.2-${{ steps.commits.outputs.base }}
      # The limits are about twice the slowest build, which is the build
      # from nothing a run makes when no build directory is restored: this
      # step took 10.3 and 11.2 minutes from nothing, and the change's build after it 2 seconds
      # where the tool's sources were the same and 6.3 minutes where the
      # generator differed (probe runs 44053665790 and 44055931063); the
      # change's build alone, when the cache has the base's tool, is a build
      # from nothing.
      - name: Build the Base Commit's SafeDITool
        if: ${{ steps.base-tool.outputs.cache-hit != 'true' }}
        timeout-minutes: 25
        env:
          BASE: ${{ steps.commits.outputs.base }}
          HEAD: ${{ steps.commits.outputs.head }}
        run: |
          git checkout --quiet --detach "$BASE"
          "$RUNNER_TEMP/stamp-source-times.sh"
          swift build -c release --product SafeDITool
          mkdir -p .generate-time/cached
          cp .build/release/SafeDITool .generate-time/cached/SafeDITool
          git checkout --quiet --detach "$HEAD"
          "$RUNNER_TEMP/stamp-source-times.sh"
      - name: Build SafeDITool
        timeout-minutes: 25
        run: |
          mkdir -p .generate-time/base .generate-time/head
          mv .generate-time/cached/SafeDITool .generate-time/base/SafeDITool
          swift build -c release --product SafeDITool
          cp .build/release/SafeDITool .generate-time/head/SafeDITool
      # After the build rather than at the job's end, so that the cache
      # holds this commit's build whatever the comparison finds.
      - name: Save Build Directory
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      # The comparison of every shape took 5.6 minutes in this container
      # (run 44968921336, comparing a tool with itself). Before the four
      # large-memory shapes it took 3.9 minutes for eight shapes (probe run
      # 44630955284) and about 13 seconds more for I800-seam (probe run
      # 44359835414), so those four add about a minute and a half. With
      # eleven timed runs of those four in place of five it took 6.0 minutes
      # (run 45110501373, comparing a tool with itself). With five timed runs
      # and five runs with one allocator arena of each tool on those four,
      # the four took 229 seconds where they had taken 207, on a four-core
      # Linux machine comparing a tool with itself; in this container the
      # step took 7.5 minutes (run 45332820533), on a runner whose other
      # shapes ran a third slower than in run 45110501373. The first seventeen
      # growth rows added about 2.6 minutes on a four-core Linux machine (the
      # published 2.4.0 tool, four runs of each row at both depths), so about
      # 10 minutes in all; there are now twenty-nine, whose time in this
      # container the next run of this step measures, and this comment then
      # carries. The limit is about twice the measurement: a head
      # tool slow enough to pass it fails the wall-time limit on its shapes
      # first.
      - name: Compare Generate Time
        timeout-minutes: 20
        run: |
          python3 -I Scripts/generate-time-check.py --summary "$GITHUB_STEP_SUMMARY" \
            .generate-time/base/SafeDITool .generate-time/head/SafeDITool "$RUNNER_TEMP/generate-time"
      # The lines the change's tool generates for wide graphs, against
      # Scripts/compile-time-baseline.txt: generated code that compiled 2.4
      # times slower passed the step above, which times `generate` alone.
      # Nothing is compiled. Measured: 22 s with main's release tool on four
      # cores (00da8b5, 2026-11-20); one minute is the least the limit can be
      # set to in whole minutes. Warns rather
      # than fails (`--warn-only`) while the generator's output is still being
      # rewritten often; a tool that cannot generate a shape still fails.
      - name: Compare Generated Lines with the Baseline
        if: ${{ !cancelled() && hashFiles('.generate-time/head/SafeDITool') != '' }}
        timeout-minutes: 1
        run: |
          python3 -I Scripts/compile-time-check.py --lines --warn-only --summary "$GITHUB_STEP_SUMMARY" \
            .generate-time/head/SafeDITool "$RUNNER_TEMP/compile-time-lines"
      # Main's tool, for the pull requests that branch from this commit. Saved
      # whatever the comparison found: the tool is this commit's either way.
      - name: Stage This Commit's SafeDITool
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('.generate-time/head/SafeDITool') != '' }}
        run: |
          mkdir -p .generate-time/cached
          cp .generate-time/head/SafeDITool .generate-time/cached/SafeDITool
      - name: Save This Commit's SafeDITool
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('.generate-time/head/SafeDITool') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .generate-time/cached
          key: generate-time-tool-${{ runner.os }}-swift-6.2-${{ steps.commits.outputs.head }}

  # Builds the SafeDITool of the pull request's base, which each fuzzer shard
  # below runs beside this commit's over the shard's graphs
  # (SafeDIToolBaseComparisonTests/longRun), comparing exit statuses,
  # diagnostics, generated files and `.safedi` bytes; "Check Graph Fuzzer
  # Corpus on Linux" judges the result. A rewrite that means to change no
  # output says `Generated output: unchanged` in its description and then
  # fails on any difference, so it can delete the code it replaces rather
  # than keep both in the tree to compare them. See
  # .claude/rules/fuzzer-base-comparison.md.
  #
  # The base is the first parent of the merge commit this run checks out
  # (`github.sha`): the tip of the branch beneath a stacked pull request, or
  # of main, as it was when GitHub made the merge the shards build. It is not
  # `github.event.pull_request.base.sha`, which can name an older tip when
  # the base branch moved just before the run was queued; a comparison with
  # that commit reports what landed on the base as this pull request's
  # change. ci.yml's jobs otherwise
  # build `github.sha` alone, to keep a cache from holding a build of a
  # commit nobody reviewed; the base is always a commit of this repository,
  # and the one cache this job saves holds only the tool, under a key made
  # of the base's tree hashes of what the tool is built from (`Sources`,
  # `Package.swift`, `Package.resolved`) and the compiler, so a restack
  # that leaves the parent's sources alone reuses it. Main's own tool,
  # which "Check Generate Time on Linux" saves on every push to main, is the
  # second place it looks.
  #
  # Also prints the generator's lines of code at the base and the head
  # (Swift under Sources/SafeDICore/Generators, blank and comment-only
  # lines left out), as information that fails nothing.
  base-tool:
    name: Build the Base SafeDITool on Linux
    needs: [changes, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && github.event_name == 'pull_request' && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    # A cold build is the job's long pole: 8.6 minutes locally, and 10 to 11
    # on CI for "Check Generate Time on Linux"'s build of the same product.
    # The build step keeps its own 25; this bounds the fetch, cache and
    # upload steps around it.
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      base: ${{ steps.parents.outputs.base }}
    defaults:
      run:
        shell: bash
    env:
      EVENT_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      # This commit, for its scripts and its retry action; its two parents,
      # the base and the head, beside it for their trees.
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Fetch the Base and the Head
        id: parents
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          base=$(git rev-parse --verify "$GITHUB_SHA^1")
          head=$(git rev-parse --verify "$GITHUB_SHA^2")
          if [ "$base" != "$EVENT_BASE" ]; then
            echo "::notice::The merge commit $GITHUB_SHA was made from the base $base, not from $EVENT_BASE, which the event names: the base branch moved before this run was queued. The base tool is built from $base."
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "HEAD=$head" >> "$GITHUB_ENV"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Count Generator Lines
        run: |
          base_lines=$(.github/scripts/count-generator-lines.sh "$BASE")
          head_lines=$(.github/scripts/count-generator-lines.sh "$HEAD")
          {
            echo "## Generator lines of code"
            echo ""
            echo "Swift under \`Sources/SafeDICore/Generators\`, blank and comment-only lines left out. Information only."
            echo ""
            echo "| Base | Head | Change |"
            echo "| ---: | ---: | ---: |"
            printf '| %s | %s | %+d |\n' "$base_lines" "$head_lines" "$((head_lines - base_lines))"
          } >> "$GITHUB_STEP_SUMMARY"
      # The key names every input to the tool's build: the trees of the
      # base's `Sources`, `Package.swift` and `Package.resolved`, the runner's
      # operating system, the container image, and a hash of the compiler's
      # `swift --version`, which tells two compilers that image tag has named
      # apart.
      - name: Compute Base Tool Cache Key
        id: key
        run: |
          compiler=$(swift --version 2>&1 | sha256sum | cut -c1-16)
          test "${#compiler}" -eq 16
          sources=$(git rev-parse "$BASE:Sources" "$BASE:Package.swift" "$BASE:Package.resolved" | sha256sum | cut -c1-16)
          test "${#sources}" -eq 16
          echo "key=base-safedi-tool-$RUNNER_OS-swift-6.2-$compiler-$sources" >> "$GITHUB_OUTPUT"
      - name: Restore the Base Tool
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .base-tool
          key: ${{ steps.key.outputs.key }}
      # The tool "Check Generate Time on Linux" saved for this commit when it
      # was main's, built the same way.
      - name: Restore Main's Tool
        id: main-cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .generate-time/cached
          key: generate-time-tool-${{ runner.os }}-swift-6.2-${{ steps.parents.outputs.base }}
      - name: Check Out the Base
        if: ${{ steps.cache.outputs.cache-hit != 'true' && steps.main-cache.outputs.cache-hit != 'true' }}
        run: git worktree add --detach base "$BASE"
      - name: Resolve Package Dependencies
        if: ${{ steps.cache.outputs.cache-hit != 'true' && steps.main-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/retry
        with:
          command: swift package resolve --package-path base
      # As "Check Generate Time on Linux" builds it, whose build of a base
      # from nothing took 10.3 and 11.2 minutes (runs 44053665790 and
      # 44055931063); the limit is about twice that.
      - name: Build the Base Tool
        if: ${{ steps.cache.outputs.cache-hit != 'true' && steps.main-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 25
        run: swift build -c release --package-path base --product SafeDITool
      - name: Stage the Base Tool
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p .base-tool
          if [ -x .generate-time/cached/SafeDITool ]; then
            cp .generate-time/cached/SafeDITool .base-tool/SafeDITool
          else
            cp base/.build/release/SafeDITool .base-tool/SafeDITool
          fi
      # Saved from a pull request too: the cache serves the restacks of this
      # pull request, whose base keeps its sources, and holds one binary.
      - name: Save the Base Tool
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .base-tool
          key: ${{ steps.key.outputs.key }}
      - name: Check the Base Tool
        run: .base-tool/SafeDITool --version
      - name: Upload the Base Tool
        uses: actions/upload-artifact@v7
        with:
          name: base-safedi-tool
          path: .base-tool/SafeDITool
          retention-days: 3

  # Fails when the compiler spends too long on one function of SafeDICore in
  # a release build (Scripts/function-compile-time-check.py): one initializer
  # took 40% of the module's release compile, in every release build of every
  # job, and no check said so. It builds SafeDICore alone, with the
  # optimizer's and the type checker's timers on, and reads the log. The
  # build caches nothing, so it runs only when the change touches what it
  # times: SafeDICore's sources, the package manifest or the check itself.
  function-compile-time:
    name: Check Function Compile Time on Linux
    # On main it skips when a pull request's run passed it on the same tree ("Find Builds a Pull Request Passed
    # on This Tree").
    needs: [changes, passed-on-this-tree, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && !(github.event_name == 'push' && needs.passed-on-this-tree.outputs.function-compile-time == 'true') && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # Main's history, for the diff below.
          fetch-depth: 0
      # Retried for the reason "Install curl for Codecov" gives.
      - name: Install Python
        uses: ./.github/actions/retry
        with:
          command: command -v python3 >/dev/null || { apt-get update && apt-get install -y --no-install-recommends python3; }
      - name: Check the Script
        run: python3 -I Scripts/function-compile-time-check.py --self-test "$RUNNER_TEMP/function-compile-time-self-test"
      # A pull request is compared with the default branch, as `changes`
      # compares it, because CI runs on the top pull request of a stack only;
      # a push to main with the commit before it. Anything else, or a base
      # that cannot be read, is timed.
      - name: See Whether the Change Touches What Is Timed
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base=
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || true)
          elif [ "$GITHUB_EVENT_NAME" = push ] && git rev-parse --verify --quiet "$BEFORE^{commit}" > /dev/null; then
            base=$BEFORE
          fi
          timed=true
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- Sources/SafeDICore Package.swift Package.resolved \
              Scripts/function-compile-time-check.py Scripts/function-compile-time-waivers.txt .github/workflows/ci.yml; then
            timed=false
            echo "Nothing this check times changed since $base." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "timed=$timed" >> "$GITHUB_OUTPUT"
      - name: Resolve Package Dependencies
        if: ${{ steps.scope.outputs.timed == 'true' }}
        uses: ./.github/actions/retry
        with:
          command: swift package resolve
      # Measured: 604 s and 733 s on four cores, swift-syntax included,
      # before #819 split SafeDICore's long initializer, and 537 s after it
      # on a four-core cloud machine (main at 00da8b5, 2026-11-20).
      # The optimizer prints each pass of 20 ms or more over one function:
      # about 1,400 lines, 5% of the log, where 200 ms printed 62 and missed
      # a function whose time is spread over short passes.
      - name: Build SafeDICore with the Compiler's Timers
        if: ${{ steps.scope.outputs.timed == 'true' }}
        timeout-minutes: 25
        run: |
          set -o pipefail
          swift build -c release --traits sourceBuild --target SafeDICore -v \
            -Xswiftc -Xfrontend -Xswiftc -debug-time-function-bodies \
            -Xswiftc -Xllvm -Xswiftc -sil-print-pass-time -Xswiftc -Xllvm -Xswiftc -sil-min-pass-time=20 \
            > "$RUNNER_TEMP/function-compile-time.log" 2>&1 || { tail -n 200 "$RUNNER_TEMP/function-compile-time.log"; exit 1; }
      - name: Check Each Function's Time
        if: ${{ steps.scope.outputs.timed == 'true' }}
        run: python3 -I Scripts/function-compile-time-check.py --summary "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/function-compile-time.log"

  # Fuzzes each of the graph fuzzer's corpora whole – the base corpus, seeds
  # 0..<corpusSeedCount, the seam corpus, seeds 0..<seamCorpusSeedCount
  # drawn with the generateDependencyTree feature, and the public mock corpus,
  # seeds 0..<publicMockCorpusSeedCount drawn with the generateMockPublic
  # feature (see SafeDIToolGraphFuzzerTests.swift) – split across shards that run the test
  # bundle "Build Tests on Linux" built. A shard fails when a graph fails,
  # a known issue goes stale, the run reports a problem with itself, the
  # process crashes, or no graph runs, and names the seeds in its summary.
  # The fixed seeds make a failure deterministic, so it belongs to the change
  # that caused it.
  graph-fuzzer:
    name: Fuzz Dependency Graphs on Linux (${{ matrix.corpus }} seeds ${{ matrix.starting-seed }}+${{ matrix.iterations }})
    # The base tool, which only a pull request builds, is waited for but not
    # required: a shard runs whatever its build's result, and compares with
    # the base only when it built.
    # On main it skips when a pull request's run passed every shard and the corpus check on the same tree
    # ("Find Builds a Pull Request Passed on This Tree").
    needs: [changes, linux-build, base-tool, passed-on-this-tree, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && !(github.event_name == 'push' && needs.passed-on-this-tree.outputs.graph-fuzzer == 'true') && needs.changes.outputs.source != 'false' && needs.linux-build.result == 'success' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    # Above the fuzzer's and the base comparison's limits together by more
    # than the longest the job's other steps have taken, so that a shard that
    # runs out of time still uploads: one job spent 11 minutes initializing
    # its container (run 43879263598).
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Each corpus is drawn with a set of generator features (SAFEDI_GRAPH_FUZZER_FEATURES, empty for the base
      # corpus, `generateDependencyTree` for the seam corpus, `generateMockPublic` for the public mock corpus) and
      # has pins of its own (fixture hash, accepted count
      # and seed-set sum, known issues); the combine job checks each corpus's shards against its pins, that the
      # shards cover it exactly once, and that every corpus the long run names has a report.
      # The base corpus runs in four shards: its value oracle compiles every accepted graph's root mocks and mirrors
      # again, which the smoke batch suggests about doubles a base shard's time (not yet measured on CI). The seam
      # corpus runs in four and the public mock corpus in two, because their graphs cost the most and a shard's
      # time is what a run waits for after its build: in run 43751741235 the base shards fuzzed for 5.3 to 7.7
      # minutes, the seam corpus's two shards of 500 seeds for 14.0 and 9.9, and the public mock corpus's one of
      # 1000 for 16.5; split as below, the ten shards fuzzed for 4.4 to 10.1 minutes (runs 43762600658, 43774447047). Each
      # report's `cpu` line says what each phase of a shard cost, which the combine job adds up per corpus.
      # No required check is a shard's: "Check Graph Fuzzer Corpus on Linux" is, so a change to this matrix needs no
      # stand-in for a Markdown-only change. A change to it changes graph-fuzzer-coverage's EXPECTED_SHARDS too.
      matrix:
        include:
          - corpus: base
            features: ""
            starting-seed: 0
            iterations: 1250
          - corpus: base
            features: ""
            starting-seed: 1250
            iterations: 1250
          - corpus: base
            features: ""
            starting-seed: 2500
            iterations: 1250
          - corpus: base
            features: ""
            starting-seed: 3750
            iterations: 1250
          - corpus: generateDependencyTree
            features: generateDependencyTree
            starting-seed: 0
            iterations: 125
          - corpus: generateDependencyTree
            features: generateDependencyTree
            starting-seed: 125
            iterations: 125
          - corpus: generateDependencyTree
            features: generateDependencyTree
            starting-seed: 250
            iterations: 125
          - corpus: generateDependencyTree
            features: generateDependencyTree
            starting-seed: 375
            iterations: 125
          - corpus: generateDependencyTree
            features: generateDependencyTree
            starting-seed: 500
            iterations: 125
          - corpus: generateDependencyTree
            features: generateDependencyTree
            starting-seed: 625
            iterations: 125
          - corpus: generateDependencyTree
            features: generateDependencyTree
            starting-seed: 750
            iterations: 125
          - corpus: generateDependencyTree
            features: generateDependencyTree
            starting-seed: 875
            iterations: 125
          - corpus: generateDependencyTree
            features: generateDependencyTree
            starting-seed: 1000
            iterations: 125
          - corpus: generateDependencyTree
            features: generateDependencyTree
            starting-seed: 1125
            iterations: 125
          - corpus: generateDependencyTree
            features: generateDependencyTree
            starting-seed: 1250
            iterations: 125
          - corpus: generateDependencyTree
            features: generateDependencyTree
            starting-seed: 1375
            iterations: 125
          - corpus: generateDependencyTree
            features: generateDependencyTree
            starting-seed: 1500
            iterations: 125
          - corpus: generateDependencyTree
            features: generateDependencyTree
            starting-seed: 1625
            iterations: 125
          - corpus: generateDependencyTree
            features: generateDependencyTree
            starting-seed: 1750
            iterations: 125
          - corpus: generateDependencyTree
            features: generateDependencyTree
            starting-seed: 1875
            iterations: 125
          - corpus: generateMockPublic
            features: generateMockPublic
            starting-seed: 0
            iterations: 500
          - corpus: generateMockPublic
            features: generateMockPublic
            starting-seed: 500
            iterations: 500
    defaults:
      run:
        shell: bash
    env:
      REPORT: ${{ github.workspace }}/graph-fuzzer/report.txt
      SUMMARY: ${{ github.workspace }}/graph-fuzzer/summary.md
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Download Test Bundle
        uses: ./.github/actions/download-artifact
        with:
          name: graph-fuzzer-test-bundle
      - name: Unpack Test Bundle
        run: |
          tar -xzf graph-fuzzer-test-bundle.tar.gz
          mkdir -p graph-fuzzer "$RUNNER_TEMP/graph-fuzzer-profiles"
      # The bundle is built for coverage, and "Report Changed Lines No Fuzzer
      # Graph Executed on Linux" reads each shard's. Only the fuzzer's own
      # process writes to the profile folder: every process it starts gets an
      # LLVM_PROFILE_FILE of its own in the test's temporary directory
      # (TestTemporaryDirectory.environment). The step's limit is under the
      # job's, so a shard that runs out of time still summarizes and uploads
      # its report; the job's limit would cancel those steps too. A shard's
      # fuzzer took 4.4 to 10.1 minutes when the corpora were split this way
      # (runs 43762600658, 43774447047), and up to 12.8 over ten runs since
      # (run 44095267353, the newest and the longest). Over ten later runs
      # the slowest shard of each took 14.1 to 20.5 minutes (runs
      # 45779351174 and 45895711547; 18.4 in 45800264261), so the limit is
      # twice 20.5.
      - name: Run Graph Fuzzer
        timeout-minutes: 41
        env:
          SAFEDI_GRAPH_FUZZER_ITERATIONS: ${{ matrix.iterations }}
          SAFEDI_GRAPH_FUZZER_STARTING_SEED: ${{ matrix.starting-seed }}
          SAFEDI_GRAPH_FUZZER_FEATURES: ${{ matrix.features }}
          SAFEDI_GRAPH_FUZZER_REPORT: ${{ github.workspace }}/graph-fuzzer/report.txt
          LLVM_PROFILE_FILE: ${{ runner.temp }}/graph-fuzzer-profiles/graph-fuzzer-%p.profraw
        run: .build/x86_64-unknown-linux-gnu/release/SafeDIPackageTests.xctest --testing-library swift-testing --filter 'SafeDIToolGraphFuzzerTests/longRun'
      - name: Download the Base Tool
        if: ${{ !cancelled() && needs.base-tool.result == 'success' }}
        uses: ./.github/actions/download-artifact
        with:
          name: base-safedi-tool
          path: base-tool
      # Runs the shard's graphs through the base's SafeDITool and this
      # commit's, the one the bundle holds, and writes what differs to
      # base-comparison.txt, which "Check Graph Fuzzer Corpus on Linux"
      # judges. It fails only when it cannot compare every seed. Its
      # profiles go to a folder of their own, so the fuzzer's coverage
      # report reads the fuzzer's alone. Measured across the 22 shards of run
      # 44878123154: 1.1 minutes at most (base seeds 3750+1250), 0.5 on
      # average; the limit is about twice the longest.
      - name: Compare with the Base Tool
        if: ${{ !cancelled() && needs.base-tool.result == 'success' }}
        timeout-minutes: 3
        env:
          SAFEDI_BASE_COMPARISON_BASE_TOOL: ${{ github.workspace }}/base-tool/SafeDITool
          SAFEDI_BASE_COMPARISON_HEAD_TOOL: ${{ github.workspace }}/.build/x86_64-unknown-linux-gnu/release/SafeDITool
          SAFEDI_BASE_COMPARISON_FEATURES: ${{ matrix.features }}
          SAFEDI_BASE_COMPARISON_STARTING_SEED: ${{ matrix.starting-seed }}
          SAFEDI_BASE_COMPARISON_ITERATIONS: ${{ matrix.iterations }}
          SAFEDI_BASE_COMPARISON_REPORT: ${{ github.workspace }}/graph-fuzzer/base-comparison.txt
          LLVM_PROFILE_FILE: ${{ runner.temp }}/base-comparison-profiles/base-comparison-%p.profraw
        run: |
          chmod +x base-tool/SafeDITool
          .build/x86_64-unknown-linux-gnu/release/SafeDIPackageTests.xctest --testing-library swift-testing --filter 'SafeDIToolBaseComparisonTests/longRun'
      - name: Summarize
        if: ${{ !cancelled() }}
        run: .github/scripts/summarize-graph-fuzzer-report.sh "$REPORT" "$SUMMARY" ${{ matrix.starting-seed }} ${{ matrix.iterations }} "${{ matrix.features }}"
      # Into the report folder, so the coverage report finds a shard's profile
      # beside its report, and names a shard that reported without one: a
      # crashed fuzzer writes no profile. Merging takes under a second.
      - name: Merge Coverage Profile
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          profiles=("$RUNNER_TEMP"/graph-fuzzer-profiles/*.profraw)
          if [ ${#profiles[@]} -gt 0 ]; then
            llvm-profdata merge -sparse "${profiles[@]}" -o graph-fuzzer/coverage.profdata
          else
            echo "The fuzzer wrote no coverage profile."
          fi
      - name: Upload Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: graph-fuzzer-report-${{ matrix.corpus }}-${{ matrix.starting-seed }}
          path: graph-fuzzer/
          if-no-files-found: ignore

  # Checks the pins over each whole corpus, which no one shard sees: that a
  # report arrived for every corpus, that the shards covered each exactly
  # once, that together they accepted exactly its pinned set of seeds,
  # that the base corpus's accepted graphs show each feature the pinned
  # number of times, and that what the base corpus's value oracle compared
  # and skipped adds up to its pins (`value-oracle`).
  # This is the one check to require for the fuzzer.
  graph-fuzzer-corpus:
    name: Check Graph Fuzzer Corpus on Linux
    # Skips on main when the shards do, since it would have no report to read.
    needs: [changes, graph-fuzzer, base-tool, passed-on-this-tree, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && !(github.event_name == 'push' && needs.passed-on-this-tree.outputs.graph-fuzzer == 'true') && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read the pull request's current description (below).
      pull-requests: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Download Shard Reports
        uses: ./.github/actions/download-artifact
        with:
          pattern: graph-fuzzer-report-*
          path: reports
      # `reports/report.txt` is where the one report lies when one shard alone
      # uploaded: a pattern that matches one artifact unpacks it into the path
      # itself. The script keeps the paths that exist, and names the shards
      # whose reports are absent.
      - name: Combine Shard Reports
        run: python3 .github/scripts/combine-graph-fuzzer-reports.py "$RUNNER_TEMP/graph-fuzzer-corpus.md" reports/*/report.txt reports/report.txt
      # Judges the shards' comparisons with the base's SafeDITool: a pull
      # request whose description holds the line `Generated output:
      # unchanged` fails on any difference; any other pull request gets the
      # list in the summary. The description is read as it is now, not as
      # the event that started the run carried it, so a re-run of this job
      # after the line is added judges it; it is read through the
      # environment, never spelled into the script.
      - name: Compare Generated Output with the Base
        if: ${{ !cancelled() }}
        env:
          BASE_TOOL_RESULT: ${{ needs.base-tool.result }}
          COMPARED_BASE: ${{ needs.base-tool.outputs.base }}
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          EVENT_PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 -I .github/scripts/combine-base-comparison-reports.py --self-test
          # A comparison with any commit but the one this run's merge was
          # made from says nothing about the pull request, whichever way it
          # comes out, so it fails here and names both.
          if [ "$BASE_TOOL_RESULT" = "success" ]; then
            git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
            merge_base=$(git rev-parse --verify "$GITHUB_SHA^1")
            if [ "$COMPARED_BASE" != "$merge_base" ]; then
              echo "::error::The base tool was built from '$COMPARED_BASE', but the merge commit $GITHUB_SHA this run tests was made from the base $merge_base, so the comparison says nothing about this pull request."
              exit 1
            fi
          fi
          PULL_REQUEST_BODY="$EVENT_PULL_REQUEST_BODY"
          if [ -n "$PULL_REQUEST" ]; then
            if live_body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq '.body // ""'); then
              PULL_REQUEST_BODY="$live_body"
            else
              echo "::warning::Could not read the pull request's current description; judging the one the run's event carried."
            fi
          fi
          export PULL_REQUEST_BODY
          # The summary goes to the log too, for a session that can read a
          # job's log but not its summary page.
          result=0
          python3 -I .github/scripts/combine-base-comparison-reports.py reports > base-comparison-summary.md || result=$?
          cat base-comparison-summary.md
          cat base-comparison-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      # Prints what the shards' reports say the pins should be, for a session
      # that cannot download this run's artifacts: the analysis's report, then
      # its pins.json as lines that
      # .claude/skills/apply-fuzzer-pins/apply-fuzzer-pins.py reads back from
      # a saved copy of this job's log. It runs when the step above fails,
      # which is when pins moved, and it never fails the job.
      - name: Print the Pins the Reports Derive
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/report-graph-fuzzer-pins.sh reports

  # Fails on any line under Sources/ or Plugins/ that no test executes on
  # Linux or macOS, over the whole tree, from the lcov reports the two test
  # jobs upload: a line either platform executed counts, as in Codecov's
  # union of the `linux` and `macos` flags, and lines whose only text is a
  # brace are left out, as Codecov leaves them out. Every Swift file there
  # is either recorded by a report or listed, with its reason, in
  # Scripts/unmeasured-files.txt. It reads nothing from Codecov and nothing
  # from the pull request's base, so a stacked pull request whose base has
  # no report is checked like any other, and a missing, partial or stale
  # report fails the check rather than passing it. It runs when the test
  # jobs run, so a Markdown-only pull request skips it, and a skipped job
  # that is not a matrix job reports success under its own name, so it
  # needs no stand-in. It only reads reports with Python, as "Check Graph
  # Fuzzer Corpus on Linux" does, so it runs on Linux with no container.
  line-coverage:
    name: Check Line Coverage on Linux
    needs: [changes, spm-plan, spm, linux, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && (needs.changes.outputs.source != 'false' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      # .github/scripts/analyze-graph-fuzzer-pins.py derives the fuzzer's pins in
      # "Check Graph Fuzzer Corpus on Linux"; this checks how it fills its
      # inputs from a run and what it does without them.
      - name: Check the Fuzzer Pins Analysis Against Its Fixtures
        run: python3 -I .github/scripts/analyze-graph-fuzzer-pins.py --self-test "$RUNNER_TEMP/analyze-graph-fuzzer-pins-self-test"
      # The check is the only thing between an unexecuted line and main, so
      # its script proves on fixtures that it unions the platforms, resolves
      # symbolic links and refuses missing data before it reads the reports.
      - name: Check the Script Against Its Fixtures
        run: python3 -I Scripts/unexecuted-lines.py --self-test "$RUNNER_TEMP/unexecuted-lines-self-test"
      # No test has a time limit of its own, so a test that never ends is
      # named only by reading the log of the step whose limit stopped it.
      - name: Check the Unfinished Tests Script Against Its Fixtures
        run: python3 -I Scripts/unfinished-tests.py --self-test
      # Scripts/changed-line-coverage.sh is how a change is checked before it
      # is pushed; its report of the files no report records must agree with
      # this job's, or a change passes there and fails here.
      - name: Check the Changed Line Coverage Script Against Its Fixtures
        run: python3 -I Scripts/changed-line-coverage.py --self-test "$RUNNER_TEMP/changed-line-coverage-self-test"
      # .github/actions/restore-shared-compile-checks/restore-from-artifacts.js
      # decides which other runs' passed compile checks a test job skips, so
      # it proves on fixtures that it takes no line from a fork, another
      # workflow, another identity or an archive it cannot read.
      - name: Check the Passed Compile Checks Script Against Its Fixtures
        run: node .github/actions/restore-shared-compile-checks/restore-from-artifacts.js --self-test "$RUNNER_TEMP/restore-from-artifacts-self-test"
      # .github/scripts/keep-value-outputs-used-in-run.sh decides which value
      # comparison outputs a branch's cache keeps, so it proves on fixtures
      # that it keeps what the newest artifacts hold and everything when the
      # tests did not run to their end.
      - name: Check the Value Comparison Outputs Script Against Its Fixtures
        run: .github/scripts/keep-value-outputs-used-in-run.sh --self-test "$RUNNER_TEMP/keep-value-outputs-self-test"
      # .github/scripts/join-value-outputs.sh joins the outputs the parts or
      # groups of a split test job used, so it proves on fixtures that an
      # output two groups hold is kept once and that one they disagree on is
      # not kept.
      - name: Check the Value Comparison Outputs Join Against Its Fixtures
        run: .github/scripts/join-value-outputs.sh --self-test "$RUNNER_TEMP/join-value-outputs-self-test"
      # A test job that failed, was cancelled or could not export uploads no
      # report, and "Find Lines No Test Executes" names the report that is
      # missing, so a download that finds nothing is not its step's failure.
      # Each report is downloaded by name into a directory of its own, never
      # by a pattern: a pattern that matches one artifact unpacks it into the
      # path itself, without the directory named after it that two matches
      # get, so with the Xcode 26 job's report absent the Linux job's was
      # reported missing too.
      - name: Download the Linux Coverage Report
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: line-coverage-linux
          path: ${{ runner.temp }}/line-coverage/line-coverage-linux
      - name: Download the Xcode 26 Coverage Report
        if: ${{ needs.spm-plan.outputs.split != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: line-coverage-macos
          path: ${{ runner.temp }}/line-coverage/line-coverage-macos
      - name: Download the Xcode 26 Coverage Report of the Seams and Mocks Part
        if: ${{ needs.spm-plan.outputs.split == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: line-coverage-macos-seams-and-mocks
          path: ${{ runner.temp }}/line-coverage/line-coverage-macos-seams-and-mocks
      - name: Download the Xcode 26 Coverage Report of the Rest
        if: ${{ needs.spm-plan.outputs.split == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: line-coverage-macos-the-rest
          path: ${{ runner.temp }}/line-coverage/line-coverage-macos-the-rest
      # When the Xcode 26 tests ran as two jobs, each uploaded the report of
      # its part, and the script sums the two. It refuses a part without the
      # other, whichever directories this step names, since each report says
      # which part of how many it is.
      - name: Find Lines No Test Executes
        env:
          XCODE_TESTS_SPLIT: ${{ needs.spm-plan.outputs.split }}
        run: |
          reports="$RUNNER_TEMP/line-coverage"
          if [ "$XCODE_TESTS_SPLIT" = true ]; then
            macos=(macos="$reports/line-coverage-macos-seams-and-mocks" macos="$reports/line-coverage-macos-the-rest")
          else
            macos=(macos="$reports/line-coverage-macos")
          fi
          python3 -I Scripts/unexecuted-lines.py --summary "$GITHUB_STEP_SUMMARY" --commit "$GITHUB_SHA" linux="$reports/line-coverage-linux" "${macos[@]}"

  # Lists the generator lines the change adds or modifies that no graph of the
  # fuzzer's corpora executed, from the shards' coverage profiles, split by
  # whether a unit test reaches each line, from "Build and Test on Linux"'s
  # (.github/scripts/report-graph-fuzzer-coverage.sh). The change is
  # everything since the merge base with main, so a stack's top pull request,
  # the only one CI runs on, lists every slice's lines; a push to main lists
  # what it pushed. Advisory: it fails only when it cannot report, and no
  # required check is its. It runs when a shard fails, and names a shard that
  # left no profile or no report, since a line only that shard ran would be
  # listed; EXPECTED_SHARDS names graph-fuzzer's matrix, and the report fails
  # when a shard it does not name uploads a report.
  # graph-fuzzer.yml's `coverage` input makes the same report for a commit
  # before review; see "Coverage of a change" in
  # .claude/rules/fuzzer-corpora.md.
  graph-fuzzer-coverage:
    name: Report Changed Lines No Fuzzer Graph Executed on Linux
    # Skips on main when the shards do, since it would have no report to read.
    needs: [changes, linux, graph-fuzzer, passed-on-this-tree, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && !(github.event_name == 'push' && needs.passed-on-this-tree.outputs.graph-fuzzer == 'true') && needs.changes.outputs.source != 'false' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # Main's history, for the merge base.
          fetch-depth: 0
      - name: Download Test Bundle
        uses: ./.github/actions/download-artifact
        with:
          name: graph-fuzzer-test-bundle
      - name: Download Unit Suite Profile
        uses: ./.github/actions/download-artifact
        with:
          name: unit-suite-profile
          path: unit-suite
      - name: Download Shard Reports
        uses: ./.github/actions/download-artifact
        with:
          pattern: graph-fuzzer-report-*
          path: reports
      # Retried for the reason "Install curl for Codecov" gives.
      - name: Install Python
        uses: ./.github/actions/retry
        with:
          command: command -v python3 >/dev/null || { apt-get update && apt-get install -y --no-install-recommends python3; }
      - name: Report
        env:
          BEFORE: ${{ github.event.before }}
          # graph-fuzzer's matrix, `<corpus>-<starting-seed>` per shard.
          EXPECTED_SHARDS: base-0 base-1250 base-2500 base-3750 generateDependencyTree-0 generateDependencyTree-125 generateDependencyTree-250 generateDependencyTree-375 generateDependencyTree-500 generateDependencyTree-625 generateDependencyTree-750 generateDependencyTree-875 generateDependencyTree-1000 generateDependencyTree-1125 generateDependencyTree-1250 generateDependencyTree-1375 generateDependencyTree-1500 generateDependencyTree-1625 generateDependencyTree-1750 generateDependencyTree-1875 generateMockPublic-0 generateMockPublic-500
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tar -xzf graph-fuzzer-test-bundle.tar.gz
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && git rev-parse --verify --quiet "$BEFORE^{commit}" > /dev/null; then
            base=$BEFORE
          else
            base=$(git merge-base origin/main HEAD)
          fi
          .github/scripts/report-graph-fuzzer-coverage.sh \
            .build/x86_64-unknown-linux-gnu/release/SafeDIPackageTests.xctest reports unit-suite/default.profdata \
            "$base" "$RUNNER_TEMP/fuzzer-coverage" "$EXPECTED_SHARDS"
      # What Scripts/fuzzer-coverage-report.sh reads to report against
      # another base without running anything.
      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: fuzzer-coverage
          path: ${{ runner.temp }}/fuzzer-coverage/
          if-no-files-found: ignore
          retention-days: 3

  # The whole suite on the newest Swift release, one job per group of test
  # targets, as "Verify Tests on Linux" in verify.yml splits it. In one job
  # this was the last check of a pull request to report by half an hour or
  # more: of the 2.3.0 stack's run 44594501340, every other job had ended 40
  # minutes after the push, and this one was cut off at 73 with its tests
  # still running. A debug build runs the tests slower than the pinned jobs'
  # release build, and this job compiles every test's generated code (see
  # the test step), so its time is the suite's, which four cores bound.
  # Each group builds for itself from the same cache rather than taking a
  # build directory from a build job, which was measured to report later
  # (see the test step). "Build and Test on Latest Swift" below reports the
  # groups under the one name the job had.
  linux-latest-swift-group:
    name: Build and Test on Latest Swift (${{ matrix.group }})
    needs: [changes, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    # `swift:latest` floats to the newest Swift release so this job
    # catches toolchain changes (e.g. SwiftPM's `swiftbuild` build
    # system and its new `.build` layout) before anyone pins to them.
    # Runs on Linux rather than macOS to save runner minutes. Coverage
    # is deliberately not collected or uploaded here: the pinned `spm`
    # and `linux` jobs own the Codecov report, and a second upload
    # from a different toolchain would skew it.
    container: swift:latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # verify.yml's groups, selection for selection: "Check Every Verify
        # Test Ran Once" proves there that they run each test once, and
        # "Build and Test on Latest Swift" below proves it here.
        include:
          - group: mocks
            selection: --filter ^SafeDIToolMockTests\.
          - group: seams
            selection: --filter ^SafeDIToolSeamTests\.
          - group: dependency-trees
            selection: --filter ^SafeDIToolDependencyTreeTests\.
          - group: tool
            selection: --filter ^SafeDIToolTests\.
          - group: fuzzer-seam-smoke
            selection: --filter ^SafeDIToolFuzzerTests\.SafeDIToolGraphFuzzerTests/seamSmokeSeeds
          - group: fuzzer-smoke
            selection: --filter ^SafeDIToolFuzzerTests\.SafeDIToolGraphFuzzerTests/ --skip ^SafeDIToolFuzzerTests\.SafeDIToolGraphFuzzerTests/seamSmokeSeeds
          - group: others
            selection: --skip ^SafeDIToolMockTests\. --skip ^SafeDIToolSeamTests\. --skip ^SafeDIToolDependencyTreeTests\. --skip ^SafeDIToolTests\. --skip ^SafeDIToolFuzzerTests\.SafeDIToolGraphFuzzerTests/
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      # For the reason "Build Tests on Linux" gives: without it, a restored
      # build directory rebuilds every target of this package, in each of
      # the seven groups.
      - name: Stamp Source Times
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          .github/scripts/stamp-source-times.sh
      - name: Print Swift Version
        id: swift
        run: |
          swift --version
          echo "version=$(swift --version 2>&1 | grep -m1 -oE 'Swift version [0-9.]+' | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      # The toolchain floats, so the key carries the version printed
      # above: a new release starts from an empty cache. It ends in the
      # commit, so that each push to main saves the build a later run
      # starts from ("Save Build Directory" below), and only a run on main
      # saves, both for the reasons "Build Tests on Linux" gives; "Delete
      # Older Build Directories" removes main's older ones. `v2` keeps a
      # build made before the sources were stamped from being restored.
      - name: Restore Build Directory
        id: build-cache
        if: ${{ needs.stack-position.outputs.clean-build != 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: spm-debug-v2-${{ runner.os }}-swift-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-debug-v2-${{ runner.os }}-swift-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}-
            spm-debug-v2-${{ runner.os }}-swift-${{ steps.swift.outputs.version }}-
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: swift package resolve
      # Swift Build (the default build system from Swift 6.4) compiles a
      # target only after the targets that the graph SwiftPM hands it
      # names as its dependencies. A full build can hide a missing edge
      # by compiling the imported module first by chance, so this builds
      # the support target the `SafeDITool` test targets share on its
      # own, from an empty scratch path rather than the cached `.build`:
      # it fails whenever that graph omits a module the support target
      # imports, which `SafeDIToolTestSupport` depending on the
      # executable target `SafeDITool` did. One group does it for all.
      - name: Build the SafeDITool Test Support Target Alone with Swift Build
        if: ${{ matrix.group == 'others' }}
        # Every run is cold: swift-syntax builds from source into the empty
        # scratch path. Ten CI runs on the 4-core Linux runner took at most
        # 1.9 minutes (2026-11-16 and 17); the limit is about two and a half
        # times that, rounded up for the runner's variance.
        timeout-minutes: 5
        run: swift build --build-system swiftbuild --traits sourceBuild --target SafeDIToolTestSupport --scratch-path "$RUNNER_TEMP/swiftbuild-test-support"
      # Built in a step of its own so that one group saves the build
      # directory after a build that succeeded and before the tests, which
      # a failure of theirs then cannot lose. Before the groups, the build
      # from nothing took 4.2 minutes on the 4-core Linux runner, 2.5
      # minutes on a restored build whose sources were not stamped, and 7
      # seconds on one whose sources were (run 44189733147, 2026-11-17); the
      # limit was about twice the first. With seven groups building at
      # once the slowest build of each of five runs took 5.7 to 7.1 minutes
      # (runs 45757312407 and 45907962627; 6.3, 5.7 and 6.6 between), so the
      # limit is twice 7.1.
      - name: Build Tests
        timeout-minutes: 14
        run: swift build --build-tests --traits sourceBuild
      # One group saves, since all seven build the same thing.
      - name: Save Build Directory
        if: ${{ matrix.group == 'others' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      # A time limit for the macOS job's reason: about twice the longest
      # duration measured. On their first run (44625637732, 2026-11-19, the
      # 2.3.0 stack's tests, the build restored from the cache) the groups'
      # step took 17.6 minutes for mocks, 16.0 for fuzzer-seam-smoke, 14.0
      # for seams, 11.2 for fuzzer-smoke, 9.4 for others, 5.3 for tool and
      # 5.2 for dependency-trees, of which the build was 3 to 5 before it
      # moved to "Build Tests" above. Twice 17.6
      # is 35. A build job that hands the groups its build directory was
      # measured beside it (run 44625836276): the build job took 9.6
      # minutes and each group another minute to fetch its work, so the
      # last group ended about 9 minutes later than here, for 12 fewer
      # runner minutes.
      #
      # No cache of passed compile checks here, deliberately: this job
      # compiles every test's generated code on every run, so a check the
      # pinned jobs skip because it passed in an earlier run is still
      # compiled once per run, by a third compiler.
      #
      # Over ten later runs the slowest group, fuzzer-seam-smoke in eight
      # of them, took 15.6 to 32.0 minutes (runs 45779105193 and
      # 45907962627; 30.1 in 45895711547 and 27.2 in 45766677692), so the
      # limit is twice 32.
      - name: Build and Test Framework
        timeout-minutes: 64
        shell: bash
        env:
          SELECTION: ${{ matrix.selection }}
          GROUP: ${{ matrix.group }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086 # The selection is words to split.
          swift test --traits sourceBuild $SELECTION 2>&1 | tee "$RUNNER_TEMP/latest-swift-test-output.txt"
          # The tests the group ran: Swift Build makes one bundle per test
          # target and each reports its own count, so the counts are summed.
          mkdir -p latest-swift-test-count
          grep -oE 'Test run with [0-9]+ tests? in [0-9]+ suites?' "$RUNNER_TEMP/latest-swift-test-output.txt" | awk '{ sum += $4 } END { if (NR > 0) print sum }' > "latest-swift-test-count/$GROUP.txt"
          test -s "latest-swift-test-count/$GROUP.txt"
          echo "The group ran $(cat "latest-swift-test-count/$GROUP.txt") tests."
      # A listing ignores `--filter` and `--skip`, so one group lists every
      # test of the build it just made, for the count the groups must add up
      # to.
      - name: Count Every Test
        if: ${{ matrix.group == 'others' }}
        shell: bash
        run: |
          swift test list --skip-build --traits sourceBuild > "$RUNNER_TEMP/latest-swift-tests.txt"
          tests=$(LC_ALL=C sort -u "$RUNNER_TEMP/latest-swift-tests.txt" | wc -l)
          test "$tests" -gt 0
          echo "$tests" > latest-swift-test-count/every-test.txt
          echo "The build lists $tests tests."
      - name: Upload the Group's Test Count
        uses: actions/upload-artifact@v7
        with:
          name: latest-swift-test-count-${{ matrix.group }}
          path: latest-swift-test-count
          retention-days: 1
          # A re-run of the job replaces what an earlier attempt uploaded.
          overwrite: true

  # Reports the seven groups under the name the one job that ran them had,
  # and fails unless every group passed and their test counts sum to the
  # count the build lists, which any selection that drops or repeats a test
  # breaks. It only reads results and counts, so it needs no container. It
  # fails when a group failed or did not run although the change has source:
  # skipped, it would satisfy a required check.
  linux-latest-swift:
    name: Build and Test on Latest Swift
    needs: [changes, linux-latest-swift-group, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # To check out the download action.
    permissions:
      contents: read
    steps:
      - name: Require the Seven Groups
        env:
          GROUPS_RESULT: ${{ needs.linux-latest-swift-group.result }}
        run: |
          echo "Build and Test on Latest Swift (seven groups): $GROUPS_RESULT"
          test "$GROUPS_RESULT" = success
      # The download below is a local action, which needs its files checked out.
      - name: Checkout the Download Action
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/download-artifact
      - name: Download the Groups' Test Counts
        uses: ./.github/actions/download-artifact
        with:
          pattern: latest-swift-test-count-*
          path: latest-swift-test-counts
          merge-multiple: true
      - name: Compare the Groups' Tests With the Build's
        env:
          # The count of groups in the matrix above.
          EXPECTED_GROUPS: 7
        run: |
          every_test=$(cat latest-swift-test-counts/every-test.txt)
          groups=0
          sum=0
          for count in latest-swift-test-counts/*.txt; do
            [ "$(basename "$count")" != every-test.txt ] || continue
            echo "$(basename "$count" .txt): $(cat "$count") tests"
            groups=$((groups + 1))
            sum=$((sum + $(cat "$count")))
          done
          echo "The $groups groups ran $sum tests; the build lists $every_test."
          test "$groups" -eq "$EXPECTED_GROUPS"
          test "$sum" -eq "$every_test"
  # Uploads, for each Linux check a push to main may skip, the record that it passed on this tree in this pull
  # request's run ("Find Builds a Pull Request Passed on This Tree" says what a record proves and which jobs
  # read it). A check gets a record only when its job, and for a matrix every one of its jobs, ended in success:
  # a failed, cancelled or skipped check leaves none, and main then runs it. The job first checks that the
  # commit it checked out has the tree the records are named for. Nothing here fails a pull request: a record
  # that is not uploaded only means main runs the check. No container, since it only uploads.
  record-passed-on-this-tree:
    name: Record the Linux Checks That Passed on This Tree
    needs: [changes, passed-on-this-tree, graph-fuzzer, graph-fuzzer-corpus, linux-repeat-pass, linux-repeat, release-acceptance, linux-release-build, function-compile-time, stack-position]
    if: ${{ !cancelled() && needs.stack-position.outputs.stacked-under == '' && github.event_name == 'pull_request' && needs.passed-on-this-tree.outputs.tree != '' && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Check That This Commit Has the Recorded Tree
        id: tree
        continue-on-error: true
        env:
          TREE: ${{ needs.passed-on-this-tree.outputs.tree }}
        run: |
          test "$(git rev-parse 'HEAD^{tree}')" = "$TREE"
          printf '%s\n' "$TREE" > "$RUNNER_TEMP/passed-tree.txt"
      - name: Upload the Record That the Fuzzer's Corpora Passed
        if: ${{ steps.tree.outcome == 'success' && needs.graph-fuzzer.result == 'success' && needs.graph-fuzzer-corpus.result == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: passed-graph-fuzzer-${{ needs.passed-on-this-tree.outputs.tree }}
          path: ${{ runner.temp }}/passed-tree.txt
          retention-days: 3
          overwrite: true
      - name: Upload the Record That the Repeat Passes Passed
        if: ${{ steps.tree.outcome == 'success' && needs.linux-repeat-pass.result == 'success' && needs.linux-repeat.result == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: passed-linux-repeat-${{ needs.passed-on-this-tree.outputs.tree }}
          path: ${{ runner.temp }}/passed-tree.txt
          retention-days: 3
          overwrite: true
      - name: Upload the Record That Release Acceptance Passed
        if: ${{ steps.tree.outcome == 'success' && needs.release-acceptance.result == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: passed-release-acceptance-${{ needs.passed-on-this-tree.outputs.tree }}
          path: ${{ runner.temp }}/passed-tree.txt
          retention-days: 3
          overwrite: true
      - name: Upload the Record That the Release SafeDITool Built
        if: ${{ steps.tree.outcome == 'success' && needs.linux-release-build.result == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: passed-linux-release-build-${{ needs.passed-on-this-tree.outputs.tree }}
          path: ${{ runner.temp }}/passed-tree.txt
          retention-days: 3
          overwrite: true
      - name: Upload the Record That the Function Compile Time Check Passed
        if: ${{ steps.tree.outcome == 'success' && needs.function-compile-time.result == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: passed-function-compile-time-${{ needs.passed-on-this-tree.outputs.tree }}
          path: ${{ runner.temp }}/passed-tree.txt
          retention-days: 3
          overwrite: true

  readme-validation:
    name: Check Markdown links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Link Checker
        uses: AlexanderDokuchaev/md-dead-link-check@5b5641a92ec95d13a5b04927e0e11de5c3405298 # v1.3.0
        with:
          config: .github/md-dead-link-check.toml
      # The checker cannot decode `%20`, so its configuration excludes the links
      # that need it, and this step checks that each names a path that exists.
      - name: Check Excluded Links
        run: python3 .github/scripts/check-excluded-markdown-links.py .github/md-dead-link-check.toml
      # Claude Code truncates an instruction file it loads on demand at 40,000
      # characters, and loads a rules file without `paths:` in every session, so
      # this step keeps CLAUDE.md, the directory CLAUDE.md files and
      # `.claude/rules` within the limits the root CLAUDE.md states.
      - name: Check Claude Instruction Files
        run: Scripts/check-claude-instruction-files.sh
      # A merge resolved by hand can commit its conflict markers, and in a
      # Markdown file nothing else fails on them: main once held them in a rules
      # file. This job runs for Markdown-only changes too, so the check is here.
      - name: Check for Merge Conflict Markers
        run: |
          if git grep -nI -E '^(<{7}|>{7}) ' -- . ; then
            echo "::error::The lines above are merge conflict markers. Resolve the conflict and remove them."
            exit 1
          fi

  # Runs the fixture self-test of each script under `.claude/skills`. It runs
  # on every change, with no `if:`, because the classifier above leaves a
  # change under `.claude/` out of `source`: these steps are the only thing
  # in this workflow that reads a file there, so nothing a `.claude/` change
  # can alter goes unchecked when the build and test jobs skip, and its first
  # step fails when another job starts to read one. Each step
  # runs whatever the others concluded, so one run names every script that
  # fails. The scripts need only Python, so the job runs on Linux with no
  # container, in about half a minute.
  skill-self-tests:
    name: Check Agent Skill Scripts on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      # The skip is sound only while nothing the build and test jobs run
      # reads a file under `.claude/`. This step fails when a step of another
      # job, or Swift code under Sources, Plugins or Tests, names one.
      - name: Check That No Skipped Job Reads a Skipped Path
        run: python3 -I .github/scripts/check-skipped-paths.py --self-test && python3 -I .github/scripts/check-skipped-paths.py
      # .claude/skills/apply-fuzzer-pins/apply-fuzzer-pins.py writes a corpus
      # run's values into the fuzzer's pins, so it proves on fixtures that it
      # refuses values that are not known to be of the commit it edits.
      - name: Check the Fuzzer Pins Script Against Its Fixtures
        if: ${{ !cancelled() }}
        run: python3 -I .claude/skills/apply-fuzzer-pins/apply-fuzzer-pins.py --self-test "$RUNNER_TEMP/apply-fuzzer-pins-self-test"
      # .claude/skills/verify-touched/verify-touched.py chooses the suites a
      # local run tests before a full Verify, so it proves on fixtures which
      # suites a change selects and which lines of a run it reports.
      - name: Check the Touched Suites Script Against Its Fixtures
        if: ${{ !cancelled() }}
        run: python3 -I .claude/skills/verify-touched/verify-touched.py --self-test
      # .claude/skills/pre-review/pre-review.py prints the block a hand-back
      # carries, so it proves on fixtures which changes owe a pins run, which
      # run it accepts as one, and what makes a block say it is not ready.
      - name: Check the Pre-Review Script Against Its Fixtures
        if: ${{ !cancelled() }}
        run: python3 -I .claude/skills/pre-review/pre-review.py --self-test
      # .claude/skills/ci-step-limits/step-limits.py says which step limits a
      # larger suite has outgrown, so it proves on fixtures which steps it
      # measures, how it matches a matrix job, and each verdict.
      - name: Check the Step Limits Script Against Its Fixtures
        if: ${{ !cancelled() }}
        run: python3 -I .claude/skills/ci-step-limits/step-limits.py --self-test
      # This job has no container, so it does not run as the superuser, and
      # the script's read-only file case runs here.
      - name: Check the Edit Script Against Its Fixtures
        if: ${{ !cancelled() }}
        run: python3 -I .claude/skills/apply-edit/apply-edit.py --self-test "$RUNNER_TEMP/apply-edit-self-test"
      # .claude/skills/review-expectation-diffs/review-expectation-diffs.py
      # accepts the generated outputs an approved-differences file explains,
      # so its fixtures prove a moved function is accepted and a changed type
      # or body is reported.
      - name: Check the Expectation Diff Classifier Against Its Fixtures
        if: ${{ !cancelled() }}
        run: python3 -I .claude/skills/review-expectation-diffs/review-expectation-diffs.py --self-test "$RUNNER_TEMP/review-expectation-diffs-self-test"
      # .claude/skills/regenerate-expectations/regenerate-expectations.py rewrites test expectations from
      # what the test helpers record, so its fixtures prove it rewrites only
      # literals that equalled a recorded output and refuses records made over
      # other test sources.
      - name: Check the Expectation Regenerator Against Its Fixtures
        if: ${{ !cancelled() }}
        run: python3 -I .claude/skills/regenerate-expectations/regenerate-expectations.py --self-test "$RUNNER_TEMP/regenerate-expectations-self-test"

  lint-swift:
    name: Lint Swift
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    container: swift:6.3
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      # `swift run` otherwise compiles SwiftFormat from source on every
      # run. Keyed on the container's Swift version and the release
      # configuration, so a cache holding only a debug build is not restored.
      - name: Cache SwiftFormat Build
        uses: actions/cache@v6
        with:
          path: CLI/.build
          key: swiftformat-release-${{ runner.os }}-swift-6.3-${{ hashFiles('CLI/Package.resolved') }}
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: swift package resolve --package-path CLI
      - name: Lint Swift
        # A release build, as `CLI/lint.sh` runs. SwiftFormat stops a file with "rule timed out" when one rule is
        # still running after 1 to 2 times (1 second plus 1 millisecond per token) of wall-clock time, a limit its
        # command line cannot change. A debug build on this 4-core runner overran it on the largest files; a release
        # build runs each rule tens of times faster.
        run: swift run -c release --package-path CLI swiftformat . --lint
