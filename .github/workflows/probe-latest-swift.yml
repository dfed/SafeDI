name: Probe Latest Swift Build Once

# A scratch copy of ci.yml's Latest Swift jobs, to measure them without a
# pull request. Never merged.
on:
  push:
    branches:
      - claude/latest-swift-build-once-probe

permissions: {}

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      source: 'true'
    steps:
      - run: 'true'

  # The newest Swift release builds the tests once here, and "Test on Latest
  # Swift" below runs them in seven jobs from this build, as "Verify Tests on
  # Linux" in verify.yml runs Verify's. In one job the build and the suite
  # were the last check of a pull request to report by half an hour or more:
  # of the 2.3.0 stack's run 44594501340, every other job had ended 40
  # minutes after the push, and this one was cut off at 73 with its tests
  # still running. A debug build runs the tests slower than the pinned jobs'
  # release build, and these jobs compile every test's generated code (see
  # the test step), so the suite's time is what four cores bound; seven
  # runners bound it seven times less. The groups take the build from here
  # rather than each building it, which would hold six more runners for the
  # length of a build while the fuzzer's shards wait for one.
  linux-latest-swift-build:
    name: Build Tests on Latest Swift
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    # `swift:latest` floats to the newest Swift release so this job
    # catches toolchain changes (e.g. SwiftPM's `swiftbuild` build
    # system and its new `.build` layout) before anyone pins to them.
    # Runs on Linux rather than macOS to save runner minutes. Coverage
    # is deliberately not collected or uploaded here: the pinned `spm`
    # and `linux` jobs own the Codecov report, and a second upload
    # from a different toolchain would skew it.
    container: swift:latest
    permissions:
      contents: read
    outputs:
      tests: ${{ steps.count.outputs.tests }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Print Swift Version
        id: swift
        run: |
          swift --version
          echo "version=$(swift --version 2>&1 | grep -m1 -oE 'Swift version [0-9.]+' | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      # The toolchain floats, so the key carries the version printed
      # above: a new release starts from an empty cache.
      - name: Cache Build Directory
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-swift-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-debug-${{ runner.os }}-swift-${{ steps.swift.outputs.version }}-
      - name: Resolve Package Dependencies
        uses: ./.github/actions/retry
        with:
          command: swift package resolve
      # Swift Build (the default build system from Swift 6.4) compiles a
      # target only after the targets that the graph SwiftPM hands it
      # names as its dependencies. A full build can hide a missing edge
      # by compiling the imported module first by chance, so this builds
      # the support target the `SafeDITool` test targets share on its
      # own, from an empty scratch path rather than the cached `.build`:
      # it fails whenever that graph omits a module the support target
      # imports, which `SafeDIToolTestSupport` depending on the
      # executable target `SafeDITool` did.
      - name: Build the SafeDITool Test Support Target Alone with Swift Build
        # Measured 26 s on a 10-core Mac (Swift 6.4.2, swift-syntax built
        # from source into the empty scratch path) and 1.9 minutes on the
        # 4-core Linux runner (run 44594501340).
        timeout-minutes: 15
        run: swift build --build-system swiftbuild --traits sourceBuild --target SafeDIToolTestSupport --scratch-path "$RUNNER_TEMP/swiftbuild-test-support"
      # LATEST_SWIFT_BUILD_LIMIT_COMMENT
      - name: Build Tests
        timeout-minutes: 60
        run: swift build --build-tests --traits sourceBuild
      # A listing ignores `--filter` and `--skip`, so the groups cannot list
      # what they would run; this lists every test of the build, for the
      # count the groups' tests must add up to.
      - name: Count Every Test
        id: count
        shell: bash
        run: |
          swift test list --skip-build --traits sourceBuild > "$RUNNER_TEMP/latest-swift-tests.txt"
          tests=$(LC_ALL=C sort -u "$RUNNER_TEMP/latest-swift-tests.txt" | wc -l)
          test "$tests" -gt 0
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "The build lists $tests tests."
      # The whole build directory, whatever layout this toolchain's build
      # system gives it, since where a test bundle lands is one of the things
      # these jobs exist to notice; less what only a later build reads
      # (object files and the compiler's dependency records) and the
      # dependencies' repositories, which the checkouts were cloned from.
      # The fastest compression: the runners' network is faster than gzip.
      - name: Package Build Directory
        run: |
          tar --use-compress-program='gzip -1' -cf latest-swift-build.tar.gz \
            --exclude='*.o' --exclude='*.d' --exclude='*.dia' --exclude='*.swiftdeps' --exclude='.build/repositories' \
            .build
          ls -l latest-swift-build.tar.gz
      - name: Upload Build Directory
        uses: actions/upload-artifact@v7
        with:
          name: latest-swift-build
          path: latest-swift-build.tar.gz
          retention-days: 1
          # The archive is compressed already.
          compression-level: 0
          # A re-run of the job replaces what an earlier attempt uploaded.
          overwrite: true

  linux-latest-swift-group:
    name: Test on Latest Swift (${{ matrix.group }})
    needs: [changes, linux-latest-swift-build]
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' && needs.linux-latest-swift-build.result == 'success' }}
    runs-on: ubuntu-latest
    container: swift:latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # verify.yml's groups, selection for selection: "Check Every Verify
        # Test Ran Once" proves there that they run each test once, and
        # "Build and Test on Latest Swift" below proves it here.
        include:
          - group: mocks
            selection: --filter ^SafeDIToolMockTests\.
          - group: seams
            selection: --filter ^SafeDIToolSeamTests\.
          - group: dependency-trees
            selection: --filter ^SafeDIToolDependencyTreeTests\.
          - group: tool
            selection: --filter ^SafeDIToolTests\.
          - group: fuzzer-seam-smoke
            selection: --filter ^SafeDIToolFuzzerTests\.SafeDIToolGraphFuzzerTests/seamSmokeSeeds
          - group: fuzzer-smoke
            selection: --filter ^SafeDIToolFuzzerTests\.SafeDIToolGraphFuzzerTests/ --skip ^SafeDIToolFuzzerTests\.SafeDIToolGraphFuzzerTests/seamSmokeSeeds
          - group: others
            selection: --skip ^SafeDIToolMockTests\. --skip ^SafeDIToolSeamTests\. --skip ^SafeDIToolDependencyTreeTests\. --skip ^SafeDIToolTests\. --skip ^SafeDIToolFuzzerTests\.SafeDIToolGraphFuzzerTests/
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Download Build Directory
        uses: actions/download-artifact@v8
        with:
          name: latest-swift-build
      - name: Unpack Build Directory
        run: |
          tar -xzf latest-swift-build.tar.gz
          rm latest-swift-build.tar.gz
      # LATEST_SWIFT_GROUP_LIMIT_COMMENT
      #
      # No cache of passed compile checks here, deliberately: these jobs
      # compile every test's generated code on every run, so a check the
      # pinned jobs skip because it passed in an earlier run is still
      # compiled once per run, by a third compiler.
      - name: Test
        timeout-minutes: 60
        shell: bash
        env:
          SELECTION: ${{ matrix.selection }}
          GROUP: ${{ matrix.group }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086 # The selection is words to split.
          swift test --skip-build --traits sourceBuild $SELECTION 2>&1 | tee "$RUNNER_TEMP/latest-swift-test-output.txt"
          # The tests the group ran: Swift Build makes one bundle per test
          # target and each reports its own count, so the counts are summed.
          mkdir -p latest-swift-test-count
          grep -oE 'Test run with [0-9]+ tests? in [0-9]+ suites?' "$RUNNER_TEMP/latest-swift-test-output.txt" | awk '{ sum += $4 } END { if (NR > 0) print sum }' > "latest-swift-test-count/$GROUP.txt"
          test -s "latest-swift-test-count/$GROUP.txt"
          echo "The group ran $(cat "latest-swift-test-count/$GROUP.txt") tests."
      - name: Upload the Group's Test Count
        uses: actions/upload-artifact@v7
        with:
          name: latest-swift-test-count-${{ matrix.group }}
          path: latest-swift-test-count
          retention-days: 1
          # A re-run of the job replaces what an earlier attempt uploaded.
          overwrite: true

  # Reports the build and the seven groups under the name the one job that
  # did both had, and fails unless every group passed and their test counts
  # sum to the count the build lists, which any selection that drops or
  # repeats a test breaks. It only reads results and counts, so it needs no
  # container. It fails when a group failed or did not run although the
  # change has source: skipped, it would satisfy a required check.
  linux-latest-swift:
    name: Build and Test on Latest Swift
    needs: [changes, linux-latest-swift-build, linux-latest-swift-group]
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the Build and the Seven Groups
        env:
          BUILD_RESULT: ${{ needs.linux-latest-swift-build.result }}
          GROUPS_RESULT: ${{ needs.linux-latest-swift-group.result }}
        run: |
          echo "Build Tests on Latest Swift: $BUILD_RESULT"
          echo "Test on Latest Swift (seven groups): $GROUPS_RESULT"
          test "$BUILD_RESULT" = success
          test "$GROUPS_RESULT" = success
      - name: Download the Groups' Test Counts
        uses: actions/download-artifact@v8
        with:
          pattern: latest-swift-test-count-*
          path: latest-swift-test-counts
          merge-multiple: true
      - name: Compare the Groups' Tests With the Build's
        env:
          BUILD_TESTS: ${{ needs.linux-latest-swift-build.outputs.tests }}
          # The count of groups in the matrix above.
          EXPECTED_GROUPS: 7
        run: |
          groups=$(find latest-swift-test-counts -name '*.txt' | wc -l)
          sum=0
          for count in latest-swift-test-counts/*.txt; do
            echo "$(basename "$count" .txt): $(cat "$count") tests"
            sum=$((sum + $(cat "$count")))
          done
          echo "The $groups groups ran $sum tests; the build lists $BUILD_TESTS."
          test "$groups" -eq "$EXPECTED_GROUPS"
          test "$sum" -eq "$BUILD_TESTS"

