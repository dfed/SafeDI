name: Upload Passed Compile Checks
description: Uploads the compile checks this run's own tests passed, and the value comparison outputs they printed, with their identity, for other runs to read and for "Share Passed Compile Checks" to add the checks to the shared list.

# Call it after the tests, with `if: always()`: the checks that passed before a
# failure or a cancellation passed all the same. A run with no file uploads
# nothing.
#
# It uploads the list the test processes of this run wrote
# (`fileOfPassesInThisRun` in PassedCompileCheckCache.swift), never
# `passed.txt`, which also holds what the job restored from its branch's cache
# and from the shared list. So whatever a job restores, by whatever key, only
# checks this run compiled reach the list other branches read.

inputs:
  identity:
    description: What `.github/scripts/compile-check-identity.sh` printed for this job.
    required: true

runs:
  using: composite
  steps:
    # With the value comparison outputs this run's test processes printed
    # (`fileOfKeysWrittenInThisRun` in DifferentialValueOutputMemo.swift), for
    # the same reason: `.compile-check-cache/value-outputs` also holds what
    # the job restored. An output larger than restore-from-artifacts.js reads
    # is left out.
    - shell: bash
      env:
        IDENTITY: ${{ inputs.identity }}
      run: |
        rm -rf passed-compile-checks
        passed=".compile-check-cache/passed-in-run-$GITHUB_RUN_ID.txt"
        written=".compile-check-cache/value-outputs-written-in-run-$GITHUB_RUN_ID.txt"
        if { [ -s "$passed" ] || [ -s "$written" ]; } && [ -n "$IDENTITY" ]; then
          mkdir -p passed-compile-checks/value-outputs
          if [ -s "$passed" ]; then
            cp "$passed" passed-compile-checks/passed.txt
          else
            touch passed-compile-checks/passed.txt
          fi
          echo "$IDENTITY" > passed-compile-checks/identity.txt
          if [ -s "$written" ]; then
            LC_ALL=C sort -u "$written" | { grep -Ex '[0-9a-f]{64}' || true; } | while read -r key; do
              output=".compile-check-cache/value-outputs/$key.txt"
              if [ -f "$output" ] && [ "$(wc -c < "$output")" -le 8388608 ]; then
                cp "$output" passed-compile-checks/value-outputs/
              fi
            done
          fi
          echo "Uploading $(wc -l < passed-compile-checks/passed.txt | tr -d ' ') passed compile checks and $(find passed-compile-checks/value-outputs -type f | wc -l | tr -d ' ') value comparison outputs of this run."
        fi
    # One artifact per operating system, since CI's two test jobs each upload
    # one. The name ends with the identity, so that a run lists only the
    # artifacts of its own (restore-from-artifacts.js, which spells this name
    # too, as share-compile-checks.yml does). `v1` is what to change to leave
    # every artifact uploaded so far unread; share-compile-checks.yml says
    # when.
    # Sharing only saves compiles, so a failed upload never fails the job.
    - uses: actions/upload-artifact@v7
      continue-on-error: true
      with:
        name: passed-compile-checks-v1-${{ runner.os }}-${{ inputs.identity }}
        path: passed-compile-checks/
        # Other runs read it for as long as it is among the newest of its
        # identity (restore-shared-compile-checks), which a stack needs for
        # the days it is in review. "Share Passed Compile Checks" reads it
        # when the run ends.
        retention-days: 7
        if-no-files-found: ignore
        # A re-run of the job replaces what an earlier attempt uploaded.
        overwrite: true
    - shell: bash
      run: rm -rf passed-compile-checks
