name: Restore Shared Passed Compile Checks
description: Adds the compile checks that passed in any run of this repository, under the same identity, to this run's file of passed checks, and the value comparison outputs the newest such runs printed to its directory of outputs.

# A run restores its file of passed compile checks from its own branch's or
# pull request's cache, or main's. It cannot read another branch's cache, so a
# check that passed on one branch compiled again on every other: on a pull
# request stacked on the one that changed it, on each scratch branch a change
# is verified on, and on main after the change landed. "Share Passed Compile
# Checks" (share-compile-checks.yml) therefore keeps one list per identity in a
# cache it saves under main, which every run can restore, and this action adds
# that list to the run's own.
#
# A key is the hash of everything one check compiles, and a list is kept per
# identity, the hash of what compiles it (compile-check-identity.sh), so a
# check that passed in any run passes in this one.
#
# A `workflow_run` workflow that follows a pull request's run may not save a
# cache ("cache write denied: token has no writable scopes"), so that list
# holds only what runs on main and Verify runs passed, and a pull request's
# passes reached no other run: each pull request of a stack compiled what the
# one below it had passed. The last step therefore also reads the lists the
# newest runs of this identity uploaded as artifacts (restore-from-artifacts.js,
# which says which artifacts it trusts and how many requests it makes), which
# every run can read whatever branch made them.
#
# The same artifacts carry what the value comparison's programs printed in
# those runs (DifferentialValueOutputMemo.swift), which the last step adds to
# `.compile-check-cache/value-outputs`, so a program another branch ran under
# this identity runs nowhere else. Each output is named by its program's key,
# which hashes everything that decides what the program prints but the macro
# plugin, and the identity hashes the plugin's sources, so an output is read
# only where the same program would print it. The shared list in main's cache
# holds no outputs: it is saved again whenever it grows, and a list of outputs
# would grow on nearly every run, by megabytes, while the cache that holds it
# is shared with the builds every run restores.
#
# Call it after "Restore Passed Compile Checks", which restores
# `.compile-check-cache`, from a job with `actions: read`, and give the step a
# `timeout-minutes`. Without the permission the last step warns and adds
# nothing.

inputs:
  identity:
    description: What `.github/scripts/compile-check-identity.sh` printed for this job.
    required: true

runs:
  using: composite
  steps:
    # No run saves under this key, so the restore key always decides: the
    # newest list saved for this identity.
    - uses: actions/cache/restore@v6
      with:
        path: .shared-compile-check-cache
        key: shared-compile-checks-v1-${{ runner.os }}-${{ inputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          shared-compile-checks-v1-${{ runner.os }}-${{ inputs.identity }}-
    # The lists earlier runs wrote of their own passes, and of the value
    # comparison outputs they wrote and used, came back with the branch's
    # cache. Nothing reads another run's list, so they only take room.
    #
    # The file of passed checks is made here when nothing restored one, since
    # the steps that keep and upload the directory run only where it exists: a
    # job whose tests run value comparison programs and pass no compile check,
    # as the graph fuzzer's smoke tests do in Verify, still hands on what its
    # programs printed.
    - shell: bash
      run: |
        mkdir -p .compile-check-cache
        touch .compile-check-cache/passed.txt
        find .compile-check-cache -maxdepth 1 \( -name 'passed-in-run-*.txt' -o -name 'value-outputs-*-in-run-*.txt' \) \
          ! -name "passed-in-run-$GITHUB_RUN_ID.txt" \
          ! -name "value-outputs-written-in-run-$GITHUB_RUN_ID.txt" \
          ! -name "value-outputs-used-in-run-$GITHUB_RUN_ID.txt" \
          -delete
    # Sorted and without duplicates, so the file a run saves does not grow by
    # the shared list on every run.
    - shell: bash
      run: |
        if [ -s .shared-compile-check-cache/passed.txt ]; then
          mkdir -p .compile-check-cache
          touch .compile-check-cache/passed.txt
          own=$(wc -l < .compile-check-cache/passed.txt)
          LC_ALL=C sort -u .compile-check-cache/passed.txt .shared-compile-check-cache/passed.txt > .compile-check-cache/merged.txt
          mv .compile-check-cache/merged.txt .compile-check-cache/passed.txt
          echo "Passed compile checks: $own from this branch's cache, $(wc -l < .shared-compile-check-cache/passed.txt) shared, $(wc -l < .compile-check-cache/passed.txt) together."
        else
          echo "No shared passed compile checks for this identity yet."
        fi
    - uses: actions/github-script@v8
      env:
        IDENTITY: ${{ inputs.identity }}
        OPERATING_SYSTEM: ${{ runner.os }}
      with:
        script: |
          const path = require('path')
          const restore = require(path.join(process.env.GITHUB_WORKSPACE, '.github/actions/restore-shared-compile-checks/restore-from-artifacts.js'))
          await restore({
            github,
            context,
            core,
            identity: process.env.IDENTITY,
            os: process.env.OPERATING_SYSTEM,
            directory: path.join(process.env.GITHUB_WORKSPACE, '.compile-check-cache'),
          })
